package:
  name: werewolf-ipe-build
  version: 0.1.0
  epoch: 0
  description: Pinned IPE kernel build output for host-side image signing
  copyright:
    - license: GPL-2.0-only
environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      # Match the upstream compiler version in Alpine's pinned kernel configuration.
      - gcc-15-default=15.2.0-r12
      - busybox
      - bash
      - coreutils
      - findutils
      - gnutar
      - gzip
      - xz
      - curl
      - ca-certificates-bundle
      - flex
      - bison
      - openssl-dev
      - openssl
      - perl
      - gmp-dev
      - mpfr-dev
      - mpc-dev
      - elfutils-dev
      - bc
      - kmod
      - hexdump
pipeline:
  - runs: |
      sh boot/build-kernel base.tar policy.crt - /var/tmp/ww-ipe-build
      install -Dm644 /var/tmp/ww-ipe-build/rootfs.tar \
        "${{targets.destdir}}/usr/share/werewolf-build/rootfs.tar"
