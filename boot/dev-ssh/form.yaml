packages: [openssh-server, openssh-sftp-server]
programs: [dhcp-client, sh-shim]
allow: [pty]
prune:
  - usr/bin/unix_chkpwd
accounts:
  groups:
    - groupname: _netcfg
      gid: 73
    - groupname: sshd
      gid: 22
    - groupname: _dhcp
      gid: 67
  users:
    - username: _netcfg
      uid: 73
      gid: 73
      homedir: /var/empty
      shell: /sbin/nologin
    - username: sshd
      uid: 22
      gid: 22
      homedir: /var/empty
      shell: /sbin/nologin
    - username: _dhcp
      uid: 67
      gid: 67
      homedir: /var/empty
      shell: /sbin/nologin
services:
  sshd-dev:
    exec: /usr/bin/sshd -D -e -f /etc/ssh/howl-dev.conf
    before: /usr/lib/werewolf/ssh-host-key /data/svc/sshd-dev/host-key /run/svc/sshd-dev/host-key
    user: root
    caps: login
    listen: [tcp/2222]
    read: /etc/ssh/howl-dev.conf
    nofile: 1024
    pledge: stdio rpath wpath inet unix netlink packet connect listen proc exec setuid setgid setgroups caps chroot seccomp landlock reboot syslog sendfile
