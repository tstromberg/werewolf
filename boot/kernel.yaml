# kernel: Alpine's linux-virt, the KVM guest kernel. The build keeps
# boot/vmlinuz-virt and the modules; the rest of what the package pulls in
# stays behind. Alpine's keys, in alpine-keys/, are the ones the prod form
# carries (cmd/howl's tests keep the two the same).
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  keyring:
    - alpine-keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
    - alpine-keys/alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub
  packages:
    - linux-virt

archs:
  - aarch64
  - x86_64
