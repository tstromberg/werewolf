# stage0: the small initramfs every werewolf machine boots through. Its
# /init is cmd/stage0/stage0.zig, which needs nothing installed: this image is
# Wolfi's base layout, for /dev/console and the directories, and nothing
# else. The build adds the module loader and the form's modules.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout

archs:
  - aarch64
  - x86_64
