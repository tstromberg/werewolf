# boot: systemd-boot, the EFI program werewolf's own disk starts with
# (design/native-boot.md). The build keeps its EFI binary, one file;
# what the package pulls in for bootctl stays behind.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - systemd-boot

archs:
  - aarch64
  - x86_64
