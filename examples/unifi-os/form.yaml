# Experimental UniFi OS 5.1.42 integration; outside the released catalog
# until its console, service-control compatibility and adoption are tested.
base: prod
with: [postgresql, mongodb, rabbitmq]
archs: [aarch64]
updates: off
allow: [jit]

weaknesses:
  kernel-write-xor-execute: UniFi's Java and Node runtimes, PostgreSQL and Erlang use JIT compilation

dev: [curl]

check:
  memory: 8192
  skip: [http-answering]

services:
  postgres:
    exec: /usr/bin/postgres -D /data/svc/postgres/data -c config_file=/usr/share/werewolf-unifi/postgresql.conf
    before: /usr/lib/werewolf/pg-init
    user: postgres
    pledge: stdio rpath wpath inet proc ipc unix listen connect
    listen: tcp/5432 loopback
    run: [/usr/bin/initdb, /usr/lib/werewolf/sh-shim, /usr/bin/locale]
    read: /run/werewolf/import
    share: shared

  unifi-core:
    image: ghcr.io/lemker/uosserver@sha256:7b66869dacf35184d856a12dee146437abf725608b5cfad20e543e3f7742059b
    exec: /usr/bin/node24 --expose-gc /usr/share/unifi-core/app/service.js
    before: /usr/bin/node24 /werewolf/core-setup.mjs
    dir: /usr/share/unifi-core/app
    pledge: stdio rpath wpath inet unix netlink connect listen proc exec sendfile
    listen: [tcp/11051 tcp/11081 tcp/11082 tcp/11083 tcp/11084 loopback]
    connect: [tcp/5432 tcp/5672 tcp/8081 tcp/11010 tcp/11011]
    run: [/usr/lib/werewolf/unifi-host-info, /bin/cat]
    memory: 1024
    nofile: 65536
    env:
      - NODE_ENV=production
      - '"NODE_OPTIONS=--max-old-space-size=300 --openssl-legacy-provider --no-network-family-autoselection --dns-result-order=ipv4first"'
      - UV_THREADPOOL_SIZE=16
      - NODE_CONFIG_DIR=/usr/share/unifi-core/app/config:/data/unifi-core/config/overrides
      - HOME=/data/unifi-core

  unifi-network:
    image: ghcr.io/lemker/uosserver@sha256:7b66869dacf35184d856a12dee146437abf725608b5cfad20e543e3f7742059b
    exec: /usr/bin/java @/werewolf/network.args
    before: /usr/bin/node24 /werewolf/network-setup.mjs
    dir: /usr/lib/unifi
    pledge: stdio rpath wpath inet unix netlink connect listen proc exec
    listen:
      - tcp/8080 udp/3478 udp/10001
      - tcp/8081 tcp/8443 tcp/8843 tcp/8880 tcp/6789 loopback
    connect: [tcp/27017 tcp/5432 tcp/5672 tcp/11081]
    write: /var/lib/unifi
    run: /usr/bin/node24
    memory: 1536
    nofile: 65536
    env:
      - HOME=/data/unifi
      - UNIFI_CORE_ENABLED=true
      - UNIFI_MONGODB_SERVICE_ENABLED=false
      - UNIFI_MQ_ENABLED=false
