# Path traversal blocks (UOS-16199). Primary defense lives in the auth
# backend (src/core/auth/server.ts) — these are edge belt-and-suspenders.

# Service-name divergence: only fires for /proxy/* and /app-assets/*
# where the maps extract a runnable name.
if ($target_runnable != $target_runnable_normalized) {
    return 400;
}

# Literal traversal patterns in the raw URI. Shared with the standalone
# identity-hub site (src/tools/nginx/identityHub.ts) so both stay in sync.
include /usr/share/unifi-core/http/path-traversal-guard.conf;


# Logging
access_log off;
error_log stderr warn;


# Static assets proxy (requires further configuration for specific site)
location @uos-proxy {
    include /usr/share/unifi-core/http/strip-internal-headers.conf;

    proxy_pass http://uos_api_backend;
    proxy_pass_request_headers on;
    proxy_read_timeout 90;
}


# Model specific static assets
location /assets/ {
    include /usr/share/unifi-core/http/cors.conf;
    include /usr/share/unifi-core/http/security.conf;

    alias /usr/share/unifi-assets/;

    expires max;

    location = /assets/manifest.json {
        expires -1;
    }
}

location /idpLogin/ {
    alias /usr/lib/unifi-directory/login_portal/;
    index index.html;
}

include /run/svc/nginx/http/shared-runnable-*.conf;
