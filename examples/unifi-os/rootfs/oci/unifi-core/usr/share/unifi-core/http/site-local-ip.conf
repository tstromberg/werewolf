server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    include /run/svc/nginx/http/local-certs.conf;

    include /usr/share/unifi-core/http/errors.conf;

    include /usr/share/unifi-core/http/shared-server-defaults.conf;
    include /usr/share/unifi-core/http/shared-post-setup-server.conf;
}

server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}


server {
    listen 8444 ssl default_server;
    http2 on;
    server_name _;

    include /run/svc/nginx/http/local-certs.conf;

    location /guest/ {
        include /usr/share/unifi-core/http/strip-internal-headers.conf;
        proxy_pass https://127.0.0.1:8843/guest/;
        proxy_pass_request_headers on;
    }
}
