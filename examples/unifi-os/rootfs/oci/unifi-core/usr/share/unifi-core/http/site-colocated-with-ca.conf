server {
    access_log off;
    error_log stderr warn;

    listen 127.0.0.1:11083 ssl default_server;
    http2 on;
    server_name _;

    # Restrict this peer port to the shadow management peer once shadow mode is
    # configured (open to all sources during initial adoption) — see colocatedAccess.ts.
    include /run/svc/nginx/http/colocated-access.conf;

    ssl_trusted_certificate /werewolf/config/unifi-core-console-group-ca.crt;

    ssl_certificate /werewolf/config/unifi-core-console-group-client.crt;
    ssl_certificate_key /werewolf/config/unifi-core-console-group-client.key;

    include /usr/share/unifi-core/http/errors.conf;

    include /usr/share/unifi-core/http/shared-post-setup-server.conf;
    ssl_verify_client optional_no_ca;

    include /usr/share/unifi-core/http/console-group-websocket-endpoint.conf;

    location ^~ /proxy/ {
        include /usr/share/unifi-core/http/auth-internal-proxy.conf;

        location /proxy/ipc/ {

            proxy_ssl_verify on;
            include /usr/share/unifi-core/http/websocket.conf;

            proxy_pass_request_headers on;
            proxy_read_timeout 60;

            proxy_pass http://localhost:11081;
            rewrite ^/proxy/ipc(.*)$ $1 break;
            proxy_set_header Host localhost;
        }

    }
}

