server {
    listen unix:/data/share/unifi/reload/uos-internal.sock;


    # Logging
    access_log off;
    error_log stderr warn;

    include /usr/share/unifi-core/http/errors.conf;

    # UOS static files
    location /device-assets/ {
        alias /data/unifi-core/devices/;
        expires max;
    }
}
