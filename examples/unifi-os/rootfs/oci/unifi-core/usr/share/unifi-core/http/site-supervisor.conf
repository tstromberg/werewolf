server {
    listen 127.0.0.1:11084 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /werewolf/config/tls/unifi-core.crt;
    ssl_certificate_key /werewolf/config/tls/unifi-core.key;

    include /usr/share/unifi-core/http/errors.conf;
    include /usr/share/unifi-core/http/gzip.conf;

    location /api/ws/supervisor {
        include /usr/share/unifi-core/http/cors.conf;
        include /usr/share/unifi-core/http/security.conf;
        include /usr/share/unifi-core/http/proxy.conf;
        include /usr/share/unifi-core/http/strip-internal-headers.conf;

        proxy_pass http://uos_api_backend/api/ws/supervisor;
    }
}
