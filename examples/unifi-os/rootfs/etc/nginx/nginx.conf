
# Foreground mode is supplied by the native supervisor.
worker_processes  2;

error_log  stderr warn;
pid /run/svc/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path /run/svc/nginx/proxy;
    fastcgi_temp_path /run/svc/nginx/fastcgi;
    uwsgi_temp_path /run/svc/nginx/uwsgi;
    scgi_temp_path /run/svc/nginx/scgi;
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Customize logging
    map $time_iso8601 $time_date {
        ~([^+]+) $1;
    }
    map $time_iso8601 $time_offset {
        ~\+([0-9:]+)$ $1;
    }
    map $msec $millis {
        ~\.([0-9]+)$ $1;
    }
    map $server_name $connection_type {
        default                     'local ';
        ~\.id\.ui\.direct$          'direct';
        ~\.unifi-hosting\.ui\.com$  'direct';
        ''                          'cloud';
    }

    log_format apm '$time_date.$millis+$time_offset $connection_type '
               '$status "$request" '
               'rt=$request_time tx=$bytes_sent '
               'u_rt=$upstream_response_time u_tx=$upstream_bytes_received '
               'ip=$remote_addr user="$sent_http_x_username"';

    access_log off;
    error_log stderr warn;


    # Generic params
    disable_symlinks on from=$document_root;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 1g;
    server_names_hash_bucket_size 128;


    # Common proxy configuration
    proxy_read_timeout 10m;
    proxy_cache_path /run/svc/nginx/uos_auth keys_zone=auth_responses:1m max_size=1m;


    # SSL
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 4h;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    include /run/svc/nginx/http/ssl-dynamic[.]conf;

    # WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    map $sent_http_sec_websocket_protocol:$http_sec_websocket_protocol $ws_protocol {
        default     '';
        ~^:(.+)$    $http_sec_websocket_protocol;
    }


    # CORS
    map $http_origin $cors_origin {
        default                                         '';
        https://unifi.ui.com                            $http_origin;
        https://developer.ui.com                        $http_origin;
        ~^https://unifi\.(stg|dev|df)\.ui\.com$         $http_origin;
        ~^https://developer\.(stg|dev)\.ui\.com$        $http_origin;
        ~\.unifi\.dev\.ui\.com$                         $http_origin;
        https://dev.unifi.ui.com:3001                   $http_origin;
        https://dev.unifi.ui.local:3002                 $http_origin;
        https://setup.dev.ui.com:3001                   $http_origin;
        include /run/svc/nginx/http/cors-origin-*.conf;
    }
    map $http_origin $cors_credentials {
        default                                         'false';
        https://unifi.ui.com                            'true';
        https://developer.ui.com                        'true';
        ~^https://unifi\.(stg|dev|df)\.ui\.com$         'true';
        ~^https://developer\.(stg|dev)\.ui\.com$        'true';
        ~\.unifi\.dev\.ui\.com$                         'true';
        https://dev.unifi.ui.com:3001                   'true';
        https://dev.unifi.ui.local:3002                 'true';
        https://setup.dev.ui.com:3001                   'true';
        include /run/svc/nginx/http/cors-credentials-*.conf;
    }


    # CSRF
    map $sent_http_x_updated_csrf_token:$sent_http_x_provided_csrf_token:$sent_http_x_expected_csrf_token $csrf_token_header {
        default             '';
        ~^(.+):(.*):(.*)$   $sent_http_x_updated_csrf_token;
        ~^::(.+)$           $sent_http_x_expected_csrf_token;
    }


    # WS Origin
    map $connection_upgrade|$cors_credentials|$http_origin $provided_ws_origin {
        default                 "";
        ~^upgrade\|true\|(.+)$  $cors_origin;
        ~^upgrade\|false\|(.+)$ $host;
    }
    map $connection_upgrade|$cors_credentials|$http_origin $expected_ws_origin {
        default                                                         "";
        ~^upgrade\|true\|(.+)$                                          $http_origin;
        ~^upgrade\|false\|(\w+:\/\/)([^:]+|(\[[a-f0-9:]+\])):?(\d+)?$   $2;

    }


    # Extract the target runnable (service/app name) from the raw request URI.
    # Passed to the auth backend via X-Target-Runnable for per-service access checks.
    # Uses [a-z][-a-z]* to match hyphenated names like uid-agent and talk-relay.
    map $request_uri $target_runnable {
        default                             '';
        ~^/proxy/([a-z][-a-z]*)/(.*)$       $1;
        ~^/app-assets/([a-z][-a-z]*)/(.*)$  $1;
    }

    # Same extraction from the normalized URI ($uri has percent-decoding and ../ resolution applied).
    # Compared against $target_runnable in the server block to detect path traversal attacks where
    # the raw and normalized service names diverge (e.g., /proxy/access/.%2e/network/ → access vs network).
    map $uri $target_runnable_normalized {
        default                             '';
        ~^/proxy/([a-z][-a-z]*)/(.*)$       $1;
        ~^/app-assets/([a-z][-a-z]*)/(.*)$  $1;
    }


    # Upstream servers
    include /run/svc/nginx/http/upstream-*.conf;


    # Extra includes
    include /run/svc/nginx/http/site-*.conf;
}

