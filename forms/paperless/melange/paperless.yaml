# Paperless-ngx for werewolf's paperless form, as Wolfi would package it.
# The release tarball carries the built web interface. uv installs what
# uv.lock pins, into a virtual environment on Wolfi's Python 3.13 at
# /usr/lib/paperless. The assistant's packages (torch, llama-index,
# sentence-transformers) are left out: nothing imports them until a chat
# runs, and this form does not run one. OCR programs are not in this
# package. The form installs Wolfi's tesseract, ghostscript, ImageMagick,
# poppler and qpdf, which the updater can replace. Offered to wolfi-dev/os
# as it is; when Wolfi ships Paperless, the form names the package and
# this file goes.
package:
  name: paperless
  version: 3.3.0
  epoch: 1
  description: Document management with OCR, tags and full-text search
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - file
      - gettext
      - ghostscript
      - imagemagick-7
      - libxml2
      - libxslt
      - openssl
      - python-3.13
      - qpdf
      - tesseract
      - tesseract-eng
      - python-3.13-dev
      - postgresql-17-dev
      - uv
  environment:
    UV_PYTHON_DOWNLOADS: never
    UV_NO_CACHE: "1"
    UV_LINK_MODE: copy

pipeline:
  - runs: mkdir -p paperless

  - uses: fetch
    with:
      uri: https://github.com/paperless-ngx/paperless-ngx/releases/download/v${{package.version}}/paperless-ngx-v${{package.version}}.tar.xz
      expected-sha256: 3332b18d914a26e225d47c0fae4680ffd7db80bdaee6a337d010619a98d75502
      directory: paperless

  # The lock is the release's. --no-emit-package drops the assistant's
  # stack and keeps every other pin, hashes included. Importing the
  # application proves the rest is enough to start. The archive's top
  # directory is paperless-ngx; fetch may leave it or strip it.
  - runs: |
      if [ -f paperless/pyproject.toml ]; then cd paperless
      elif [ -f paperless/paperless-ngx/pyproject.toml ]; then cd paperless/paperless-ngx
      else find paperless -maxdepth 2 -type d -print; exit 1; fi
      uv export --frozen --python /usr/bin/python3.13 --no-dev --extra webserver --extra postgres \
        --no-emit-project \
        --no-emit-package torch \
        --no-emit-package sentence-transformers \
        --no-emit-package llama-index-core \
        --no-emit-package llama-index-embeddings-huggingface \
        --no-emit-package llama-index-embeddings-ollama \
        --no-emit-package llama-index-embeddings-openai-like \
        --no-emit-package llama-index-llms-ollama \
        --no-emit-package llama-index-llms-openai-like \
        --output-file /tmp/requirements.txt
      uv venv --python /usr/bin/python3.13 /usr/lib/paperless
      export VIRTUAL_ENV=/usr/lib/paperless
      uv pip install --compile-bytecode -r /tmp/requirements.txt
      rm -rf /usr/lib/paperless/app
      cp -a src /usr/lib/paperless/app
      rm -rf /usr/lib/paperless/app/paperless_testing /usr/lib/paperless/app/conftest.py
      find /usr/lib/paperless/app -type d -name tests -print | sort -r | while IFS= read -r d; do rm -rf "$d"; done
      cd /usr/lib/paperless/app
      export PAPERLESS_SECRET_KEY=build
      export PAPERLESS_REDIS=redis://127.0.0.1:6379
      export PAPERLESS_DATA_DIR=/tmp/paperless-build
      export PAPERLESS_MEDIA_ROOT=/tmp/paperless-build/media
      export PAPERLESS_CONSUMPTION_DIR=/tmp/paperless-build/consume
      export PAPERLESS_STATICDIR=/usr/lib/paperless/static
      /usr/lib/paperless/bin/python manage.py compilemessages
      mkdir -p "$PAPERLESS_MEDIA_ROOT" "$PAPERLESS_CONSUMPTION_DIR" "$PAPERLESS_STATICDIR"
      /usr/lib/paperless/bin/python manage.py collectstatic --no-input
      /usr/lib/paperless/bin/python manage.py check
      rm -rf /tmp/paperless-build

  - runs: |
      cd /usr/lib/paperless
      rm -f bin/activate* bin/deactivate* .gitignore .lock
      mkdir -p ${{targets.destdir}}/usr/lib
      cp -a /usr/lib/paperless ${{targets.destdir}}/usr/lib/paperless

update:
  enabled: true
  github:
    identifier: paperless-ngx/paperless-ngx
    strip-prefix: v
