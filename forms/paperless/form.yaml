# paperless: Paperless-ngx 3.3, documents with OCR, behind Caddy, with
# Valkey as its queue. The application is built from the release
# (../packages/www/paperless/paperless.yaml). Tesseract, Ghostscript,
# ImageMagick, poppler and qpdf are Wolfi's packages, not copies frozen
# in Paperless's container image. Valkey is the valkey form, on its
# socket. Sign-up is closed. The administrator comes from the config.
# PostgreSQL holds the database; document files are in /data/svc/paperless. See
# forms/paperless/README.md.
base: prod

with: [postgresql, valkey, caddy]

packages:
  - paperless
  # The interpreter, and what the wheels link. howl build-apk names the rest.
  - python-3.15
  - libstdc++
  - libgcc
  - libpq~18
  - zlib
  # OCR and the file tools, Wolfi's, so a later package replaces them.
  - tesseract
  - tesseract-eng
  - ghostscript
  - imagemagick-7>=7.1.2.34-r1000
  - poppler-utils
  - qpdf
  - pngquant
  - file
  - font-liberation
  - fontconfig
  - tzdata

# The checks sign in with curl, which keeps the token.
dev:
  - curl
  - postgresql-client~18

# make check's (forms/README.md): four Paperless services, Valkey and Caddy.
check:
  memory: 4096

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  kernel-write-xor-execute: the postgresql form permits JIT, though this form starts PostgreSQL with jit=off
  programs-no-interpreters: python3 runs Paperless, which is what this form is for

services:
  # The components share the paperless UNIX identity and private scratch
  # files, as upstream expects. The valkey group grants its queue socket.
  # Each still has separate service rules and process limits. paperless-init
  # makes the directories and waits for Valkey, then the database is
  # migrated and the administrator is made from the config, and the ready
  # mark lets the other three start. Sign-up is closed. Page cleaning is
  # off: Wolfi does not package unpaper. It reaches the local Valkey and
  # PostgreSQL sockets; neither needs a network listener.
  paperless:
    allow: [python:native]
    exec: /usr/lib/paperless/bin/python3 -B -u -m granian --interface asginl --ws --loop uvloop --host 127.0.0.1 --port 8000 --workers 1 paperless.asgi:application
    before:
      - /usr/lib/werewolf/paperless-init
      - /usr/lib/paperless/bin/python3 -B -u /usr/lib/paperless/app/manage.py migrate --skip-checks --no-input
      - /usr/lib/paperless/bin/python3 -B -u /usr/lib/paperless/app/manage.py manage_superuser --skip-checks
      - /usr/lib/werewolf/paperless-init ready
    user: paperless
    shared-user: true
    group: valkey
    # netlink: glibc lists the host's addresses before a lookup.
    pledge: stdio rpath wpath inet unix netlink connect listen proc exec
    listen: [tcp/8000 loopback]
    connect: [/run/svc/valkey/valkey.sock, /run/svc/postgres/.s.PGSQL.5432]
    run: /usr/lib/paperless/bin/python3
    secret:
      - PAPERLESS_SECRET_KEY /run/config/paperless/secret-key
      - PAPERLESS_ADMIN_PASSWORD /run/config/paperless/admin-password
    config: settings /run/config/paperless/settings.json
    setting:
      - domain hostname required as DOMAIN
      - admin string required as PAPERLESS_ADMIN_USER
    render: env site
    memory: 768
    nofile: 16384
    env:
      - PAPERLESS_REDIS=unix:///run/svc/valkey/valkey.sock
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=/run/svc/postgres
      - PAPERLESS_DBNAME=postgres
      - PAPERLESS_DBPASS=
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DATA_DIR=/data/svc/paperless
      - PAPERLESS_MEDIA_ROOT=/data/svc/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/data/svc/paperless/consume
      - PAPERLESS_SCRATCH_DIR=/run/svc/paperless/tmp
      - PAPERLESS_STATICDIR=/usr/lib/paperless/static
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_OCR_CLEAN=none
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_TRUSTED_PROXIES=127.0.0.1

  # The consumer, the worker and the scheduler share paperless's identity
  # and write the library and upload scratch files. They wait for the ready
  # mark, so they do not open the database mid-migration. The consumer
  # watches the consume folder. It and the worker run the OCR tools.
  # Django's startup check runs Tesseract, so the scheduler may too.
  # The worker is one process: a pool would need shared memory.
  paperless-consumer:
    allow: [python:native]
    exec: /usr/lib/paperless/bin/python3 -B -u /usr/lib/paperless/app/manage.py document_consumer
    before: /usr/lib/werewolf/paperless-init wait
    user: paperless
    shared-user: true
    group: valkey
    pledge: stdio rpath wpath inet unix netlink connect proc exec watch
    connect: [/run/svc/valkey/valkey.sock, /run/svc/postgres/.s.PGSQL.5432]
    write: [/data/svc/paperless, /run/svc/paperless/tmp]
    read: /run/svc/paperless
    run:
      - /usr/lib/paperless/bin/python3
      - /usr/bin/tesseract
      - /usr/sbin/tesseract
      - /usr/bin/gs
      - /usr/bin/convert
      - /usr/bin/identify
      - /usr/bin/qpdf
      - /usr/bin/pdftoppm
      - /usr/bin/pdfinfo
      - /usr/bin/pdftotext
      - /usr/bin/pngquant
      - /usr/bin/file
    secret: PAPERLESS_SECRET_KEY /run/config/paperless/secret-key
    config: settings /run/config/paperless-consumer/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 768
    nofile: 4096
    env:
      - PAPERLESS_REDIS=unix:///run/svc/valkey/valkey.sock
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=/run/svc/postgres
      - PAPERLESS_DBNAME=postgres
      - PAPERLESS_DBPASS=
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DATA_DIR=/data/svc/paperless
      - PAPERLESS_MEDIA_ROOT=/data/svc/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/data/svc/paperless/consume
      - PAPERLESS_SCRATCH_DIR=/run/svc/paperless/tmp
      - PAPERLESS_STATICDIR=/usr/lib/paperless/static
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_OCR_CLEAN=none
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_TRUSTED_PROXIES=127.0.0.1

  paperless-worker:
    allow: [python:native]
    exec: /usr/lib/paperless/bin/python3 -B -u -m celery --app paperless worker --loglevel INFO --pool=solo --without-mingle --without-gossip
    before: /usr/lib/werewolf/paperless-init wait
    user: paperless
    shared-user: true
    group: valkey
    pledge: stdio rpath wpath inet unix netlink connect proc exec
    connect: [/run/svc/valkey/valkey.sock, /run/svc/postgres/.s.PGSQL.5432]
    write: [/data/svc/paperless, /run/svc/paperless/tmp]
    read: /run/svc/paperless
    run:
      - /usr/lib/paperless/bin/python3
      - /usr/bin/tesseract
      - /usr/sbin/tesseract
      - /usr/bin/gs
      - /usr/bin/convert
      - /usr/bin/identify
      - /usr/bin/qpdf
      - /usr/bin/pdftoppm
      - /usr/bin/pdfinfo
      - /usr/bin/pdftotext
      - /usr/bin/pngquant
      - /usr/bin/file
    secret: PAPERLESS_SECRET_KEY /run/config/paperless/secret-key
    config: settings /run/config/paperless-worker/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 768
    nofile: 4096
    env:
      - PAPERLESS_REDIS=unix:///run/svc/valkey/valkey.sock
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=/run/svc/postgres
      - PAPERLESS_DBNAME=postgres
      - PAPERLESS_DBPASS=
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DATA_DIR=/data/svc/paperless
      - PAPERLESS_MEDIA_ROOT=/data/svc/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/data/svc/paperless/consume
      - PAPERLESS_SCRATCH_DIR=/run/svc/paperless/tmp
      - PAPERLESS_STATICDIR=/usr/lib/paperless/static
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_OCR_CLEAN=none
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_TRUSTED_PROXIES=127.0.0.1

  paperless-beat:
    allow: [python:native]
    exec: /usr/lib/paperless/bin/python3 -B -u -m celery --app paperless beat --loglevel INFO --schedule /data/svc/paperless/celerybeat-schedule
    before: /usr/lib/werewolf/paperless-init wait
    user: paperless
    shared-user: true
    group: valkey
    pledge: stdio rpath wpath inet unix netlink connect proc exec
    connect: [/run/svc/valkey/valkey.sock, /run/svc/postgres/.s.PGSQL.5432]
    write: [/data/svc/paperless, /run/svc/paperless/tmp]
    read: /run/svc/paperless
    run:
      - /usr/lib/paperless/bin/python3
      - /usr/bin/tesseract
      - /usr/sbin/tesseract
    secret: PAPERLESS_SECRET_KEY /run/config/paperless/secret-key
    config: settings /run/config/paperless-beat/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 256
    nofile: 1024
    env:
      - PAPERLESS_REDIS=unix:///run/svc/valkey/valkey.sock
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=/run/svc/postgres
      - PAPERLESS_DBNAME=postgres
      - PAPERLESS_DBPASS=
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DATA_DIR=/data/svc/paperless
      - PAPERLESS_MEDIA_ROOT=/data/svc/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/data/svc/paperless/consume
      - PAPERLESS_SCRATCH_DIR=/run/svc/paperless/tmp
      - PAPERLESS_STATICDIR=/usr/lib/paperless/static
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_OCR_CLEAN=none
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=false
      - PAPERLESS_TRUSTED_PROXIES=127.0.0.1

  # Caddy, as its own user, for Paperless: ports 80 and 443, the ACME CA,
  # a resolver, and Paperless on loopback. The site is the machine's
  # domain, the same setting Paperless takes as DOMAIN.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/8000]
    lookup: "*"
    read: /etc/caddy
    config: settings /run/config/caddy/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB

  # The local database uses peer authentication only. Paperless's schema
  # and roles are made by pg-init before the server accepts connections.
  postgres:
    exec: /usr/bin/postgres -D /data/svc/postgres/data -c listen_addresses= -c unix_socket_directories=/run/svc/postgres -c jit=off
    before: /usr/lib/werewolf/pg-init
    user: postgres
    pledge: stdio rpath wpath proc shm unix listen connect
    run:
      - /usr/bin/initdb
      - /usr/lib/werewolf/sh-shim
      - /usr/bin/locale
    read: /run/werewolf/import
    share: shared
