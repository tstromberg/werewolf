# Mosquitto for the mosquitto form: MQTT over TLS on :8883 for the users
# the config names, each held to the topics its ACL allows. leash starts
# Mosquitto (etc/sv/mosquitto/service) as the mosquitto user; leash
# copies the certificate, key, passwords and ACLs from the config into
# /run/svc/mosquitto. A form on this one lays its own file here.

per_listener_settings false
log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true

# TLS alone, 1.2 at least, with the config's certificate. A plain
# listener for a LAN that must have one is two lines, in a form of your
# own:
#   listener 1883
#   protocol mqtt
listener 8883
protocol mqtt
certfile /run/svc/mosquitto/tls-cert
keyfile /run/svc/mosquitto/tls-key
tls_version tlsv1.2

# Who, and what each may do: nothing anonymous, passwords from the config
# (mosquitto_passwd makes the file), topics by the config's ACLs.
allow_anonymous false
password_file /run/svc/mosquitto/passwords
acl_file /run/svc/mosquitto/acls

# Retained messages, subscriptions and queued messages survive a restart.
persistence true
persistence_location /data/svc/mosquitto/
persistence_file mosquitto.db
autosave_interval 300

# Limits under the leash's memory: a device that floods is held, not the
# broker.
max_connections 1000
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 1048576
max_keepalive 300
# No $SYS topics: a broker's statistics are not for its clients.
sys_interval 0
