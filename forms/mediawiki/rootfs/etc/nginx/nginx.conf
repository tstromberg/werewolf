# nginx for the mediawiki form: MediaWiki in /usr/share/mediawiki, from
# the image, its entry points run by php-fpm over its UNIX socket and
# nothing else of it served but stylesheets, scripts, images and fonts.
# leash starts nginx (etc/sv/nginx/service) as the nginx user, able to
# bind :80 and nothing else. TLS is in front of it: a caddy machine or
# the cloud's load balancer.

daemon off;                         # runsv supervises it
worker_processes auto;
error_log stderr warn;              # the console, like every service
pid /run/svc/nginx/nginx.pid;       # its own directory, from leash

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path       /run/svc/nginx/proxy;
    fastcgi_temp_path     /run/svc/nginx/fastcgi;
    uwsgi_temp_path       /run/svc/nginx/uwsgi;
    scgi_temp_path        /run/svc/nginx/scgi;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 64m;       # php-fpm.conf's upload limit

    # Behind the TLS in front, which says so in X-Forwarded-Proto:
    # MediaWiki then knows it is on HTTPS. A client that reaches :80
    # directly can only claim the same, which gains it nothing.
    map $http_x_forwarded_proto $forwarded_https {
        https on;
        default "";
    }

    server {
        listen 80 default_server;
        root /usr/share/mediawiki;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Pages, by their short address.
        location = / {
            return 302 /wiki/;
        }
        location ^~ /wiki/ {
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
        # MediaWiki's entry points, and only those: img_auth.php hands out
        # uploads to whoever may read the wiki.
        location ~ ^/(index|load|api|rest|img_auth|opensearch_desc)\.php(/|$) {
            include fastcgi_params;
            fastcgi_split_path_info ^(/[a-z_]+\.php)(/.*)$;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
        # What the skins and extensions load directly.
        location ~ ^/(resources|skins|extensions)/.+\.(css|js|mjs|gif|jpe?g|png|svg|webp|ico|cur|woff2?|ttf|eot|otf)$ {
            try_files $uri =404;
            expires 7d;
        }
        location = /favicon.ico {
            return 204;
        }
        # The rest of the code (includes, maintenance, vendor, the cache,
        # the images directory) is never served.
        location / {
            return 404;
        }
    }
}
