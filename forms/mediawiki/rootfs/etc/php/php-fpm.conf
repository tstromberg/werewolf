; php-fpm for the mediawiki form: the php form's pool, with MediaWiki's
; limits and the hardening its code cannot do for itself. leash starts it
; as the php user (etc/sv/php-fpm/service). This file is the whole
; configuration: Wolfi's php-fpm.d is not read.

[global]
error_log = /run/svc/php-fpm/error.log
daemonize = no
pid = /run/svc/php-fpm/php-fpm.pid

[mediawiki]
listen = /run/svc/php-fpm/php.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
; MediaWiki's settings, in the image but outside its code.
env[MW_CONFIG_FILE] = /etc/mediawiki/LocalSettings.php
; SQLite keeps its statement journals and temporary tables in a temporary
; directory, which the leash lets php write only in its own.
env[SQLITE_TMPDIR] = /run/svc/php-fpm
env[TMPDIR] = /run/svc/php-fpm
; Only scripts nginx serves, and no way to run a file of another name.
security.limit_extensions = .php
; What PHP may read: the code, its settings, its own directory and its
; data. Nothing else of the machine, whatever a page or an extension tries.
php_admin_value[open_basedir] = /usr/share/mediawiki:/etc/mediawiki:/run/svc/php-fpm:/data/svc/php-fpm
php_admin_value[upload_tmp_dir] = /run/svc/php-fpm
php_admin_value[sys_temp_dir] = /run/svc/php-fpm
php_admin_value[session.save_path] = /run/svc/php-fpm
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 60
; The opcode cache's and APCu's settings are on php-fpm's command line
; (etc/sv/php-fpm/service): they start before any pool's values apply.
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[session.use_strict_mode] = on
