# SSH reauthentication for a root shell, using the existing listener.
base: sshd
packages: [openssh-client]

sshd:
  pubkey-accepted-algorithms: sk-ssh-ed25519@openssh.com,sk-ecdsa-sha2-nistp256@openssh.com
  allow-agent-forwarding: "yes"
  agent-socket-path: shared:/run/ssh-agent
  pubkey-auth-options: touch-required verify-required
  # Every su caller shares this source address. Keep external penalties.
  per-source-penalty-exempt-list: 127.0.0.1/32

net:
  - connect all tcp/22 loopback

# Services replace whole declarations. This is sshd's service with a public
# localhost host-key pin published before the same daemon starts.
services:
  sshd:
    exec: /usr/bin/sshd -D -e
    before:
      - /usr/bin/mkdir -p -m 1777 /run/ssh-agent
      - /usr/lib/werewolf/ssh-host-key /data/svc/sshd/host-key /run/svc/sshd/host-key /run/werewolf/ssh_known_hosts
    user: root
    caps: login
    listen: [tcp/22]
    nofile: 1024
    pledge: stdio rpath wpath inet unix netlink packet connect listen proc exec setuid setgid setgroups caps chroot seccomp landlock reboot syslog sendfile

weaknesses:
  network-no-login: SSH provides operator shells and fresh authentication for su
  network-ssh-config: operator sessions may forward an agent for local reauthentication
  programs-no-downloaders: interactive tools include SSH, scp and busybox wget
  programs-no-interpreters: busybox-full supplies awk for interactive use
  programs-no-shell: busybox-full supplies operator shells
