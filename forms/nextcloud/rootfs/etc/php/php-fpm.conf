; php-fpm for the nextcloud form: one pool, on a UNIX socket in its own
; directory, which Caddy, of nextcloud's group, may use. leash starts it as
; the nextcloud user (etc/sv/nextcloud/service), so there is no root master
; to drop privileges from and no user to name. This file is the whole
; configuration: Wolfi's php-fpm.d is not read.

[global]
; --force-stderr sends the log to the console, like every service; the
; file is only where php-fpm insists on opening one.
error_log = /run/svc/nextcloud/error.log
daemonize = no
pid = /run/svc/nextcloud/php-fpm.pid

[nextcloud]
listen = /run/svc/nextcloud/php.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
; What Nextcloud reads of its environment: its config on /data, and a
; PATH, which its checks insist on.
env[NEXTCLOUD_CONFIG_DIR] = /data/svc/nextcloud/config
env[PATH] = /usr/bin
env[TMPDIR] = /data/svc/nextcloud/tmp
; Only scripts Caddy hands it, and no way to run a file of another name.
security.limit_extensions = .php
php_admin_value[upload_tmp_dir] = /data/svc/nextcloud/tmp
php_admin_value[sys_temp_dir] = /data/svc/nextcloud/tmp
php_admin_value[session.save_path] = /run/svc/nextcloud
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_include] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
; Nextcloud's own advice: memory, uploads (its clients send large files in
; chunks), long requests, and its output unbuffered.
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 1G
php_admin_value[post_max_size] = 1G
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_time] = 3600
php_admin_value[output_buffering] = 0
php_admin_value[default_charset] = UTF-8
; Cookies PHP itself sets.
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.use_strict_mode] = on
; The opcode cache's settings are on php-fpm's command line
; (etc/sv/nextcloud/service): it starts before any pool's values apply.
; Its cache keeps the comments Nextcloud reads its routes from, and checks
; for changed files a minute apart, as apps from the app store change.
