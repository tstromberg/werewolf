# nginx for the nextcloud form: Nextcloud in /usr/share/nextcloud from the
# image, custom app assets from /data/svc/nextcloud/apps with symlink
# traversal disabled, and PHP entry points dispatched over php-fpm's UNIX
# socket. leash starts nginx on loopback behind Caddy, holding no TLS keys.

daemon off;
worker_processes auto;
error_log stderr warn;
pid /run/svc/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path       /run/svc/nginx/proxy;
    fastcgi_temp_path     /run/svc/nginx/fastcgi;
    uwsgi_temp_path       /run/svc/nginx/uwsgi;
    scgi_temp_path        /run/svc/nginx/scgi;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1g;
    fastcgi_buffers 64 4K;

    map $http_x_forwarded_proto $forwarded_https {
        https on;
        default "";
    }

    server {
        listen 127.0.0.1:8080 default_server;
        root /usr/share/nextcloud;
        disable_symlinks on from=$document_root;
        autoindex off;

        # Hidden files, internal directories and CLI/updater files.
        location ~ /(?:^|/)\. {
            return 404;
        }
        location ~ ^/(?:3rdparty|build|config|data|lib|templates|tests|updater)(?:$|/) {
            return 404;
        }
        location ~ ^/(?:AUTHORS|COPYING|README|REUSE\.toml|composer\.|console\.php|cron\.php|db_structure|occ|package(?:-lock)?\.json) {
            return 404;
        }

        # App-store static assets on /data, never PHP or dotfiles, with
        # symlink escapes outside /data/svc/nextcloud/apps refused.
        location ^~ /custom_apps/ {
            alias /data/svc/nextcloud/apps/;
            disable_symlinks on from=/data/svc/nextcloud/apps;
            location ~ (?:\.php(?:$|/)|/\.) {
                return 404;
            }
        }

        location ~ ^/(?:ocs|ocm)-provider(?:$|/) {
            try_files $uri/ =404;
            index index.php;
        }
        location ~ ^/(?:ocs|ocm)-provider/index\.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass unix:/run/svc/nextcloud/php.sock;
        }

        # Nextcloud's approved PHP entry points, and no others.
        location ~ ^/(?:index|remote|public|status|ocs/v[12]|core/ajax/update)\.php(?:$|/) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass unix:/run/svc/nextcloud/php.sock;
            fastcgi_intercept_errors off;
            fastcgi_request_buffering off;
            fastcgi_read_timeout 3600s;
        }

        location ~ \.php(?:$|/) {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
}
