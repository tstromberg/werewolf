package:
  name: n8n
  version: 1.120.0
  epoch: 0
  description: n8n workflow automation on hardened Node.js
  copyright:
    - license: LicenseRef-Sustainable-Use
  dependencies:
    runtime:
      - nodejs-hardened
      - nodejs-26>=26.12.0-r2000
      - libstdc++

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - build-base
      # isolated-vm links the shared libraries in Node's build configuration.
      - brotli-dev
      - c-ares-dev
      - icu-dev
      - libuv-dev
      - nghttp2-dev
      - openssl-4.0-dev
      - zlib-dev
      - nodejs-26
      - npm
      - node-gyp
      - python-3.15
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://codeload.github.com/n8n-io/task-runner-launcher/tar.gz/871cb76bc35c990f368eaa788f0b4ce7b145e143
      expected-sha256: f858cda1a8b30ffb91d2ed7b7c89ac2e1ac063319872e907085b976192301e05
      extract: false

  - runs: |
      # Build SQLite for the same Node major as the hardened runtime.
      # npm 12 requires explicit URL opt-in. Only the pinned root SheetJS
      # dependency may use a remote URL; its lockfile integrity is retained.
      npm ci --omit=dev --ignore-scripts --no-audit --no-fund --allow-remote=root
      node port-node.cjs
      (cd node_modules/sqlite3 && node-gyp rebuild --nodedir=/usr)
      test -s node_modules/sqlite3/build/Release/node_sqlite3.node
      # TypeORM imports Sentry without declaring it. Check actual SQLite
      # initialization as well as CLI loading, before packaging the runtime.
      node --no-node-snapshot -e '(async () => { const {DataSource} = require("@n8n/typeorm"); const db = new DataSource({type: "sqlite", database: ":memory:"}); await db.initialize(); const rows = await db.query("SELECT 42 AS answer"); if (rows[0].answer !== 42) throw new Error("SQLite query"); await db.destroy(); })().catch(error => { console.error(error); process.exit(1); });'
      # Load the real CLI and its dependency-injection registry. --version
      # exits before config initialization and misses mixed workspace packages.
      node --no-node-snapshot node_modules/n8n/bin/n8n --help >/dev/null
      node --no-node-snapshot smoke.cjs
      dest=${{targets.destdir}}/usr/lib/n8n
      mkdir -p "$dest"
      # Move the installed tree: exporting a second source copy doubles
      # builder I/O without changing the runtime package.
      mv node_modules "$dest/"
      cp package.json package-lock.json "$dest/"
      mkdir launcher
      tar -xzf 871cb76bc35c990f368eaa788f0b4ce7b145e143 -C launcher --strip-components=1
      # The launcher otherwise binds its private health endpoint on all interfaces.
      sed -i 's/fmt.Sprintf(":%s", port)/fmt.Sprintf("127.0.0.1:%s", port)/' launcher/internal/http/healthcheck_server.go
      (cd launcher && CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags='-s -w' -o "$dest/task-runner-launcher" ./cmd/launcher)
      cp task-runners.json "$dest/"
      install -Dm644 launcher/LICENSE.md "$dest/licenses/task-runner-launcher.LICENSE.md"
      install -Dm644 launcher/LICENSE_EE.md "$dest/licenses/task-runner-launcher.LICENSE_EE.md"

update:
  enabled: false
