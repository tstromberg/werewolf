# mosquitto: prod, with Mosquitto as an MQTT broker for the devices and
# automations on a network: TLS on :8883 with a certificate from the
# config, users and what each may publish and subscribe to from the
# config, nothing anonymous, and nothing plain (1883 is a line in
# etc/mosquitto/mosquitto.conf, for a LAN that must have it). Retained
# messages and queues are kept in /data/svc/mosquitto. leash starts it
# (etc/sv/mosquitto/service) as the mosquitto user. See docs/mosquitto.md.
include: prod.yaml
contents:
  packages:
    - mosquitto

accounts:
  groups:
    - groupname: mosquitto
      gid: 215
  users:
    - username: mosquitto
      uid: 215
      gid: 215
      homedir: /var/empty
      shell: /sbin/nologin
