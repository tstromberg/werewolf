# greenbone: prod, with gvmd, gsad, the scanner and the feed from
# Greenbone's images, behind Caddy. PostgreSQL and Valkey are on
# loopback. gvmd's entrypoint is a shell that drops through gosu; this
# execs the image's bash on one script. The scanner is the one service
# that keeps CAP_NET_RAW and CAP_NET_ADMIN. The feed owns the cache
# under /data/share/gvm; gvmd may read it and the scanner may write
# only the plugin directory. gsad, Caddy and PostgreSQL have neither
# the capabilities nor the cache. The administrator is not admin/admin.
# See forms/greenbone/README.md.
base: prod

with: [postgresql, caddy, valkey]

# The extension is built by ../packages/security/greenbone/pg-gvm.yaml against this PostgreSQL.
packages: [pg-gvm, postgresql-contrib~18, glib, libical~3.0]

# Taken back of werewolf's defaults (lib/allow.zig): PostgreSQL compiles
# costly queries to machine code with LLVM (jit = on, its default).
# packet and netadmin stay in this machine's bounding set so the
# scanner's leash can keep them. No other service on this machine
# names them. Another form's machine is unchanged.
allow: [jit, packet, netadmin]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  kernel-write-xor-execute: PostgreSQL compiles costly queries to machine code with LLVM (allow jit, from postgresql)
  network-fence-unbypassable: OpenVAS keeps CAP_NET_RAW and CAP_NET_ADMIN for privileged scanning, so isolate this machine from services it must not scan

# make check's (forms/README.md): gvmd, the scanner and the feed
# beside PostgreSQL.
check:
  memory: 8192

services:
  # The feed, as _oci-feed, inside its image. It writes the cache and
  # is the only writer of it, apart from the scanner's plugin cache.
  # It has no packet capability and no path to PostgreSQL. rsync stays
  # in the image. The community feed is release 25.0, which that server
  # still publishes. A failed sync keeps the cache and tries the next day.
  feed:
    image: registry.community.greenbone.net/community/greenbone-feed-sync:stable
    exec: /bin/bash /usr/lib/werewolf/feed-run
    pledge: stdio rpath wpath inet unix netlink connect proc exec
    connect: [tcp/873 public]
    lookup: "*"
    run: /usr/
    # The feed places lock files beside its data directories. These parents
    # are private writable storage; the declared cache shares stay separate.
    write: [/var/lib/gvm, /var/lib/openvas]
    memory: 1024
    nofile: 8192
    data:
      - /data/share/gvm/vt /var/lib/openvas/plugins write
      - /data/share/gvm/notus /var/lib/notus write
      - /data/share/gvm/scap /var/lib/gvm/scap-data write
      - /data/share/gvm/cert /var/lib/gvm/cert-data write
      - /data/share/gvm/data-objects /var/lib/gvm/data-objects write
    env:
      - GREENBONE_FEED_SYNC_FEED_RELEASE=25.0

  # gvmd, as _oci-gvmd, inside its image. greenbone-run migrates, sets
  # the administrator from the config, and execs gvmd on a Unix socket.
  # The socket is mode 0660. Its group is _oci-gvmd, which gvm-link
  # keeps after it drops. GMP still wants the password. share: group
  # is that directory. It reaches PostgreSQL and the scanner's shared socket, and
  # reads the feed. It has no packet capability. A missing password
  # parks it. The image's bash may run gvmd.
  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    exec: /usr/bin/bash /usr/lib/werewolf/greenbone-run
    # gvmd coordinates its database work with SysV semaphores.
    pledge: stdio rpath wpath inet unix netlink connect listen proc exec sem
    connect: [tcp/5432, /run/ospd/ospd.sock]
    write: [/var/lib/gvm, /var/log/gvm]
    # The feed owns these. gvmd is in that group and may only read
    # them: the data line is read, and Landlock follows the line.
    group: [_oci-feed, _oci-openvas]
    data:
      - /data/share/gvm/scap /var/lib/gvm/scap-data read
      - /data/share/gvm/cert /var/lib/gvm/cert-data read
      - /data/share/gvm/data-objects /var/lib/gvm/data-objects read
      - /data/share/gvm/ospd /run/ospd read
    share: group
    run:
      - /usr/bin/bash
      - /usr/bin/grep
      - /usr/bin/gpg
      - /usr/bin/gpgconf
      - /usr/bin/gpg-agent
      - /usr/bin/mkdir
      - /usr/bin/rm
      - /usr/bin/sleep
      - /usr/local/sbin/gvmd
    config: admin-password /run/config/gvmd/admin-password
    memory: 1024
    nofile: 16384
    env:
      - PGHOST=127.0.0.1
      - PGPORT=5432
      - PGUSER=gvmd
      - PGDATABASE=postgres

  # gsad, as _oci-gsad, inside its image, on loopback. It speaks to gvmd
  # through the socket gvm-link placed in its /run. Caddy is what the
  # network sees.
  gsad:
    # gsa includes gsad and the web assets; gsad alone is API-only.
    image: registry.community.greenbone.net/community/gsa:stable
    exec: /usr/local/sbin/gsad -f --http-only --listen=127.0.0.1 --port=9392
    pledge: stdio rpath wpath inet unix netlink connect listen proc
    listen: tcp/9392 loopback
    connect: /run/manager.sock
    share: group
    write: /var/log/gvm
    memory: 256
    nofile: 8192
    env:
      - GSAD_MANAGER_UNIX_SOCKET=/run/manager.sock
      - GSAD_DO_CHROOT=0
      - GSAD_HTTP_ONLY=1
      - GSAD_FOREGROUND=1

  # gvm-link, as _glink in the groups _oci-gvmd and _oci-gsad, carrying
  # gvmd's socket into gsad's /run directory.
  gvm-link:
    exec: /usr/lib/werewolf/gvm-link
    user: _glink
    group: [_oci-gvmd, _oci-gsad]
    pledge: stdio rpath wpath unix listen connect proc
    read: /etc/werewolf/gvm-link
    write: /run/svc/gsad/run
    connect: /run/svc/gvmd/run/gvmd.sock
    memory: 64
    nofile: 1024

  # The scanner, as _oci-openvas, inside its image. It is the one
  # service that keeps CAP_NET_RAW and CAP_NET_ADMIN, for alive
  # detection. It serves gvmd on a group-restricted shared Unix socket. It may write the
  # plugin cache and only read the rest of the feed. Its retained network
  # capabilities can bypass Fence; deploy the whole machine on a scanner
  # segment that cannot route to management services.
  # The image's entrypoint would set the socket mode to 666 and drop
  # through gosu; this execs python on ospd-openvas.
  openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    exec: /bin/bash /usr/lib/werewolf/openvas-run
    pledge: stdio rpath wpath inet unix netlink connect listen proc exec packet
    caps: net_raw net_admin
    connect: [tcp/6379, any]
    lookup: "*"
    group: _oci-feed
    write: [/var/log/gvm, /etc/openvas]
    run: /usr/
    memory: 2048
    nofile: 65536
    data:
      - /data/share/gvm/vt /var/lib/openvas/plugins write
      - /data/share/gvm/notus /var/lib/notus read
      - /data/share/gvm/ospd /run/ospd write
    env:
      - NMAP_PRIVILEGED=1

  # PostgreSQL, as postgresql's form runs it, but also on loopback TCP:
  # pg_hba.conf lets the role gvmd alone in that way, to the postgres
  # database. The scanner's routing prohibits its loopback except
  # Valkey, and no other leash names this port.
  postgres:
    exec: /usr/bin/postgres -D /data/svc/postgres/data -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/svc/postgres -c
      hba_file=/usr/share/werewolf-greenbone/pg_hba.conf
    before: /usr/lib/werewolf/pg-init
    user: postgres
    pledge: stdio rpath wpath inet proc shm unix listen connect
    listen: [tcp/5432 loopback]
    run:
      - /usr/bin/initdb
      - /usr/lib/werewolf/sh-shim
      - /usr/bin/locale
    read: /run/werewolf/import
    share: shared

  # Valkey, on loopback, for the scanner's knowledge base. No password:
  # the port is loopback, and only the scanner's leash connects. Fence
  # prohibits that user from every other loopback port.
  valkey:
    exec: /usr/bin/valkey-server /etc/valkey/valkey.conf
    before: /usr/lib/werewolf/valkey-init
    user: valkey
    pledge: stdio rpath wpath inet unix listen proc
    listen: tcp/6379 loopback
    read: /etc/valkey /run/werewolf/import
    share: shared
    memory: 256
    nofile: 10240

  # Caddy, as its own user, for gsad. The domain is the site.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/9392]
    lookup: "*"
    read: /etc/caddy
    config: settings /run/config/caddy/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB
