# Valkey for the greenbone form: loopback TCP, for the scanner.
# No password: the port is loopback, and only the scanner's leash
# connects. Fence prohibits that user from every other loopback port.
# leash starts it (etc/sv/valkey/service) as the valkey user.

daemonize no
supervised no
logfile ""
loglevel notice

port 6379
bind 127.0.0.1
protected-mode yes

maxmemory 192mb
maxmemory-policy noeviction

dir /data/svc/valkey
dbfilename dump.rdb
save 3600 1 300 100 60 10000
appendonly no

enable-module-command no
enable-debug-command no
enable-protected-configs no

user default on nopass ~* &* +@all -@admin
