# PostgreSQL's logins for the greenbone form (form.yaml, services:
# postgres): local clients by peer, as initdb writes for the postgresql
# form, and the role gvmd over loopback TCP. The scanner is prohibited
# from this port. No other leash names it, so the port stands in for a
# password.
local   all       all                 peer
host    postgres  gvmd    127.0.0.1/32  trust
