version: 1
packages:
  - postgresql-client
suites:
  - name: greenbone-ca
    readiness: true
    cases:
      - name: greenbone-ca
        steps:
          - file: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              type: file
            await: 60s
  - name: greenbone-ready
    readiness: true
    cases:
      - name: greenbone-login
        steps:
          - fetch:
              url: https://localhost/login
              ca: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              status: 200
              body:
                matches: id="(app|root)"
            await: 170s
  - name: test-greenbone-database
    source: driver.zig
    mode: database
    user: postgres
    cases:
      seed:
        - ordinary-database-roles
        - database-owner-role
        - database-extensions
      verify:
        - ordinary-database-roles
        - database-owner-role
        - database-extensions
    policy:
      pledge: stdio rpath unix connect proc exec
      read:
        - /run/svc/postgres
      connect:
        - /run/svc/postgres/.s.PGSQL.5432
      run:
        - /usr/bin/psql
  - name: test-greenbone-valkey
    source: driver.zig
    mode: valkey
    user: _oci-openvas
    cases:
      seed:
        - config-get-databases
        - config-set-refused
      verify:
        - config-get-databases
        - config-set-refused
    policy:
      pledge: stdio rpath inet connect proc exec
      read: []
      connect:
        - tcp/6379
      run:
        - /usr/bin/valkey-cli
  - name: test-greenbone-scanner
    source: driver.zig
    mode: scanner
    user: _oci-gvmd
    groups:
      - _oci-openvas
    cases:
      seed:
        - osp-version
        - shared-mount-modes
      verify:
        - osp-version
        - shared-mount-modes
    policy:
      pledge: stdio rpath unix connect
      read:
        - /data/share/gvm/ospd
      connect:
        - /data/share/gvm/ospd/ospd.sock
      run: []
  - name: test-greenbone-scanner-denied
    source: driver.zig
    mode: scanner-denied
    user: nobody
    groups: []
    cases:
      seed:
        - socket-refused
      verify:
        - socket-refused
    policy:
      pledge: stdio rpath unix connect
      read:
        - /data/share/gvm/ospd
      connect:
        - /data/share/gvm/ospd/ospd.sock
      run: []
  - name: test-greenbone-manager
    source: driver.zig
    mode: manager
    user: _oci-gvmd
    cases:
      seed:
        - configured-login
        - create-target
        - persisted-target
        - scanner-configured
        - scanner-verified
        - default-password-refused
        - wrong-password-refused
        - private-port-5432
        - private-port-6379
        - private-port-9391
        - private-port-9392
      verify:
        - configured-login
        - persisted-target
        - scanner-configured
        - scanner-verified
        - default-password-refused
        - wrong-password-refused
        - private-port-5432
        - private-port-6379
        - private-port-9391
        - private-port-9392
    policy:
      pledge: stdio rpath inet unix connect
      read:
        - /run/svc/gvmd/run
      connect:
        - /run/svc/gvmd/run/gvmd.sock
      run: []
    fixtures:
      password: /run/config/gvmd/admin-password
  - name: test-greenbone-bridge
    source: driver.zig
    mode: bridge
    user: _oci-gsad
    cases:
      seed:
        - configured-login
        - persisted-target
        - default-password-refused
        - wrong-password-refused
      verify:
        - configured-login
        - persisted-target
        - default-password-refused
        - wrong-password-refused
    policy:
      pledge: stdio rpath unix connect
      read:
        - /run/svc/gsad/run
      connect:
        - /run/svc/gsad/run/manager.sock
      run: []
    fixtures:
      password: /run/config/gvmd/admin-password
  - name: test-greenbone-denied
    source: driver.zig
    mode: denied
    user: nobody
    cases:
      seed:
        - socket-refused
      verify:
        - socket-refused
    policy:
      pledge: stdio rpath unix connect
      read:
        - /run/svc/gvmd/run
      connect:
        - /run/svc/gvmd/run/gvmd.sock
      run: []
  - name: greenbone-platform
    cases:
      - name: greenbone-gvmd
        steps:
          - service: gvmd
            expect:
              user: _oci-gvmd
              uid:
                min: 65536
              capabilities: []
              no_new_privileges: true
      - name: greenbone-bind
        steps:
          - listeners:
              protocol: tcp
              port: 9392
            expect:
              equals:
                - protocol: tcp
                  address: 127.0.0.1
                  port: 9392
          - file: /run/svc/gvmd/run/gvmd.sock
            expect:
              type: socket
              mode: '660'
              gid: _oci-gvmd
          - file: /run/svc/gsad/run/manager.sock
            expect:
              type: socket
              mode: '660'
      - name: greenbone-link
        steps:
          - service: gvm-link
            expect:
              user: _glink
              uid:
                min: 65536
              capabilities: []
              no_new_privileges: true
              groups:
                contains: _oci-gvmd
      - name: greenbone-published
        steps:
          - fetch:
              url: https://localhost/login
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: POST
              form:
                username: admin
                password: admin
            expect:
              status:
                one_of:
                  - 200
                  - 401
                  - 403
      - name: greenbone-scanner
        steps:
          - service: openvas
            expect:
              user: _oci-openvas
              uid:
                min: 65536
              capabilities:
                - net_raw
                - net_admin
              no_new_privileges: true
      - name: greenbone-feed
        steps:
          - service: feed
            expect:
              user: _oci-feed
              capabilities: []
      - name: greenbone-posture
        steps:
          - file: /usr/share/werewolf/weaknesses
            expect:
              body:
                matches: '(^|

                  )network-fence-unbypassable '
      - name: greenbone-alone
        steps:
          - service: gsad
            expect:
              groups:
                absent: _oci-feed
  - name: greenbone-assets
    source: web.zig
    mode: assets
    user: root
    policy:
      pledge: stdio rpath wpath inet
    cases:
      seed:
        - greenbone-assets
      verify:
        - greenbone-assets
  - name: greenbone-isolation
    source: web.zig
    mode: isolation
    user: root
    policy:
      pledge: stdio rpath wpath inet
    cases:
      seed:
        - greenbone-cache
        - greenbone-caps
        - greenbone-redis
        - greenbone-feed-command
      verify:
        - greenbone-cache
        - greenbone-caps
        - greenbone-redis
        - greenbone-feed-command
