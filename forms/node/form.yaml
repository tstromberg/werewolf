base: app

# Taken back of werewolf's defaults (lib/allow.zig): V8 compiles the
# application to machine code as it runs.
allow: [jit]

# The application serves on 8080.
net:
  - listen tcp/8080

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: node runs the application, which is what this form is for
  kernel-write-xor-execute: V8, which runs the application, compiles it to machine code as it runs (allow jit)
