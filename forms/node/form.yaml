# node: prod with Node.js, for an application a form on this one brings:
# its program in /usr/lib/app (form.yaml's app), verified and read-only
# with the rest of the root, and etc/sv/app/service, which starts it.
# node-app brings the service, for howl's --app to lay the program over;
# node-example brings both. See docs/forms.md.
base: app

packages:
  - nodejs-22

# Taken back of werewolf's defaults (lib/allow.zig): V8 compiles the
# application to machine code as it runs.
allow: [jit]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: node, for the application a form on this one brings
  kernel-write-xor-execute: V8 compiles the application to machine code as it runs (allow jit)
