# Squid as an egress proxy (forms/squid/README.md): CONNECT to port 443 of
# the domains the machine's settings name, from the networks they name and
# this machine, and nothing else. squid-setup writes the two lists from the
# settings before each start; this file is the policy.

http_port 3128
workers 1
visible_hostname squid
httpd_suppress_version_string on
pid_filename /run/svc/squid/squid.pid
coredump_dir none

# Errors to stderr (squid -d 1), which leash routes to the console. No
# access log: Squid opens its log by path, and /dev/stdout is root's pipe,
# which a service's user cannot open again (README.md, Drawbacks).
cache_log /dev/null
access_log none

# A proxy, not a cache: nothing kept in memory or on disk.
cache deny all
cache_mem 0 MB
memory_pools off

# Nothing told of the client: no Via, no X-Forwarded-For.
via off
forwarded_for delete

# No ports but 3128: no ICP, HTCP or SNMP.
icp_port 0
htcp_port 0
snmp_port 0

# -n: an address is never matched by the name its reverse DNS gives, which
# whoever holds that address writes.
acl clients src "/run/svc/squid/networks"
acl allowed dstdomain -n "/run/svc/squid/domains"
acl https port 443

# The cache manager answers no one; then sources, method, port, name.
http_access deny manager
http_access deny !localhost !clients
http_access deny !CONNECT
http_access deny !https
http_access allow allowed
http_access deny all

shutdown_lifetime 1 seconds
