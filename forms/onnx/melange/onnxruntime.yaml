package:
  name: py3.15-onnxruntime
  version: 1.31.0
  epoch: 0
  description: CPU ONNX Runtime built for hardened Python 3.15
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.15>=3.15.0_git20261010-r2000
      - libstdc++

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - build-base
      - cmake
      - clang-23
      - ninja-build
      - patch
      - zlib-dev
      - git
      - python-3.15
      - python-3.15-dev
      - uv
  environment:
    CC: clang
    CXX: clang++
    UV_PYTHON_DOWNLOADS: never
    UV_NO_CACHE: "1"
    UV_LINK_MODE: copy

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/microsoft/onnxruntime
      tag: v${{package.version}}
      expected-commit: 402979ac1bef89dcd55add41eaa7277c407599eb

  - runs: |
      # Clang preserves Wolfi hardening while avoiding GCC's constexpr
      # function-pointer comparison failure in Abseil (abseil-cpp#1634).
      # Clang 23 deprecates Abseil's still-supported lifetime annotation;
      # keep its warning without promoting that one diagnostic to an error.
      # Wolfi keeps Ninja outside PATH. Name it explicitly for CMake and
      # FetchContent sub-builds; patch is needed by the pinned date source.
      # This kernel label is unused when SVE2.1 is not selected.
      patch -p1 --fuzz=0 < arm-warning.patch
      test -x /usr/lib/ninja-build/bin/ninja
      command -v patch
      uv pip install --system --python /usr/bin/python3.15 --require-hashes -r build-requirements.txt
      python3.15 tools/ci_build/build.py --build_dir build --config Release \
        --build_wheel --skip_tests --parallel 4 --allow_running_as_root \
        --cmake_generator Ninja --skip_submodule_sync \
        --cmake_extra_defines CMAKE_MAKE_PROGRAM=/usr/lib/ninja-build/bin/ninja \
        CMAKE_CXX_FLAGS=-Wno-error=deprecated-attributes \
        onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_USE_FULL_PROTOBUF=OFF onnxruntime_USE_TELEMETRY=OFF
      uv pip install --python /usr/bin/python3.15 --no-deps \
        --target "${{targets.destdir}}/usr/lib/python3.15/site-packages" \
        build/Release/dist/onnxruntime-*.whl
      # Bundle the hashed CPU runtime dependencies, with no interpreter or pip.
      uv pip install --python /usr/bin/python3.15 --require-hashes \
        --target "${{targets.destdir}}/usr/lib/python3.15/site-packages" \
        -r runtime-requirements.txt
      # Installer locks and generated build-tool entrypoints are not runtime files.
      rm -f "${{targets.destdir}}/usr/lib/python3.15/site-packages/.lock"
      rm -rf "${{targets.destdir}}/usr/lib/python3.15/site-packages/bin"
      PYTHONPATH="${{targets.destdir}}/usr/lib/python3.15/site-packages" \
        python3.15 -P -c 'import onnxruntime; assert "CPUExecutionProvider" in onnxruntime.get_available_providers()'

update:
  enabled: true
  github:
    identifier: microsoft/onnxruntime
    strip-prefix: v
