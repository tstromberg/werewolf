version: 1
suites:
  - name: vuln-demo
    cases:
      - name: vuln-dashboard
        steps:
          - fetch:
              url: http://127.0.0.1:8080/
            await: 60s
            expect:
              status: 200
              body:
                contains: vuln-demo
      - name: vuln-solr
        steps:
          - fetch:
              url: http://127.0.0.1:8983/solr/admin/info/system?wt=json
            await: 180s
            expect:
              status: 200
              json:
                /lucene/solr-spec-version: "8.11.0"
      - name: vuln-n8n
        steps:
          - fetch:
              url: http://127.0.0.1:5678/healthz/readiness
            await: 180s
            expect:
              status: 200
              json:
                /status: ok
      - name: vuln-langflow
        steps:
          - fetch:
              url: http://127.0.0.1:7860/health_check
            await: 180s
            expect:
              status: 200
              json:
                /status: ok
      - name: vuln-request-log
        steps:
          - fetch:
              url: http://127.0.0.1:8983/solr/
              headers:
                X-Demo-Check:
                  run: true
            expect:
              status: 200
          - fetch:
              url: http://127.0.0.1:8080/events.json
            await: 30s
            expect:
              status: 200
              body:
                contains:
                  run: true
      - name: vuln-audit-enabled
        steps:
          - file: /etc/werewolf/audit-exec-all
            expect:
              type: file
          - file: /run/werewolf/vuln-kmsg
            expect:
              type: file
              size:
                min: 1
      - name: vuln-no-shell-runs
        steps:
          - file: /etc/sv/solr/service
            expect:
              body:
                absent: /bin/sh
          - file: /etc/sv/n8n/service
            expect:
              body:
                absent: /bin/sh
          - file: /etc/sv/n8n-runner/service
            expect:
              body:
                absent: /bin/sh
          - file: /etc/sv/langflow/service
            expect:
              body:
                absent: /bin/sh
          - file: /etc/sv/vuln-console/service
            expect:
              body:
                absent: /bin/sh
          - file: /etc/sv/vuln-sshd/service
            expect:
              body:
                absent: /bin/sh
