package:
  name: vuln-console
  version: 1.0.0
  epoch: 0
  description: Live containment console and exec-only demo SSH server
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - runs: |
      CGO_ENABLED=0 go test ./...
      CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags='-s -w' -o vuln-console .
      install -Dm755 vuln-console ${{targets.destdir}}/usr/lib/werewolf/vuln-console
