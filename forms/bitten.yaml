# bitten: minimal, on a machine `bite` took over. The old root filesystem
# stays, and /data is a directory on it; the config sits beside it. See
# README, Bite.
include: minimal.yaml
contents:
  packages:
    - blkid                 # find the victim's filesystem by UUID (busybox cannot read xfs or btrfs)
    - mount                 # util-linux: bind /data, and mount nosuid,nodev,noexec

paths:
  # Wolfi ships util-linux mount setuid root. Nothing here mounts as a user.
  - path: /usr/bin/mount
    type: permissions
    permissions: 0o755
