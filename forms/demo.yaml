# demo: werewolf, shown off, on the production base (prod). nginx serves
# one page about the machine it runs on: its kernel and uptime, the last 25
# patches it applied to itself with the CVEs they fixed, what grype finds in
# it, and its packages. The page comes from /usr/lib/werewolf/status
# (status/status.zig); nothing these services run starts a shell. It checks
# Wolfi and Alpine hourly, not every 20 hours (etc/werewolf/update-every).
# Boot it from a slot (bite), so that /data, which holds grype's database
# and the page's history, is on a disk. See docs/demo.md.
include: prod.yaml
contents:
  packages:
    - nginx-mainline        # shares openssl 4 with the rest of the image
    - grype

accounts:
  groups:
    - groupname: nginx
      gid: 200
    - groupname: grype
      gid: 201
  users:
    - username: nginx
      uid: 200
      gid: 200
      homedir: /var/empty
      shell: /sbin/nologin
    - username: grype
      uid: 201
      gid: 201
      homedir: /var/empty
      shell: /sbin/nologin
