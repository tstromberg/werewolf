version: 1
suites:
  # Real jobs, as root runs the shipped service: leash reads /etc/sv/cron/service
  # with only the crontab and the job's program changed (driver.zig).
  - name: cron-jobs
    source: driver.zig
    mode: jobs
    user: root
    policy:
      pledge: stdio rpath wpath proc exec
    cases:
      seed: [cron-job-runs]
      verify: [cron-job-runs]
  - name: cron-audit
    source: driver.zig
    mode: audit
    user: root
    policy:
      pledge: stdio rpath
    cases:
      seed: [cron-pledged]
      verify: [cron-pledged]
  - name: cron
    cases:
      - name: cron-leashed
        steps:
          - service: cron
            expect:
              user: supercronic
              uid:
                min: 65536
              capabilities: []
              no_new_privileges: true
              seccomp: filter
          - file: /etc/passwd
            expect:
              body:
                matches: "(^|\n)supercronic:[^\n]*:/usr/lib/werewolf/sh-shim(\n|$)"
      - name: cron-unlisted-refused
        steps:
          - file: /run/cron-check/log
            expect:
              body:
                contains: 'sh-shim: /usr/bin/zstd: permission denied'
      - name: cron-shell-refused
        steps:
          - file: /run/cron-check/log
            expect:
              body:
                matches: 'sh-shim: refused: unquoted .* is shell syntax'
          - file: /data/svc/cron-check/shell-ran
            expect:
              exists: false
