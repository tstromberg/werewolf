# cron: prod, with supercronic running jobs on a schedule, for a form that
# takes it (`with: [cron]`) or builds on it. leash starts supercronic
# (etc/sv/cron/service) as the supercronic user, and each job runs under
# the same leash, through sh-shim (cmd/sh-shim), since there is no shell for
# its `SHELL -c`. As shipped the crontab (etc/cron/crontab) holds no jobs:
# a form on this one lays its own, and its own service file naming the
# programs its jobs run. See forms/cron/README.md.
base: prod

packages:
  - supercronic

# The service's user, declared only so its login shell is sh-shim, which a
# program that asks for its shell then runs; its ids are those its name's
# hash would give it (forms/README.md). Not `cron`: wolfi-baselayout has
# that account already (uid 16).
accounts:
  groups:
    - groupname: supercronic
      gid: 658209000
  users:
    - username: supercronic
      uid: 658209000
      gid: 658209000
      homedir: /var/empty
      shell: /usr/lib/werewolf/sh-shim

# sh-shim, the crontab's SHELL, and the allowance that lets the leash run
# it: supercronic runs each job as `sh-shim -c COMMAND`.
with: [sh-shim]
