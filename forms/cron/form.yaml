# cron: prod, with supercronic running jobs on a schedule, for a form that
# takes it (`with: [cron]`) or builds on it. leash starts supercronic
# (etc/sv/cron/service) as the supercronic user, and each job runs under
# the same leash, through sh-shim (cmd/sh-shim), since there is no shell for
# its `SHELL -c`. As shipped the crontab (etc/cron/crontab) holds no jobs:
# a form on this one lays its own, and its own service file naming the
# programs its jobs run. See forms/cron/README.md.
base: prod

packages:
  - supercronic

# The service's user, declared only so its login shell is sh-shim, which a
# program that asks for its shell then runs; its ids are those its name's
# hash would give it (forms/README.md). Not `cron`: wolfi-baselayout has
# that account already (uid 16).
accounts:
  groups:
    - groupname: supercronic
      gid: 658209000
  users:
    - username: supercronic
      uid: 658209000
      gid: 658209000
      homedir: /var/empty
      shell: /usr/lib/werewolf/sh-shim

# sh-shim, the crontab's SHELL, and the allowance that lets the leash run
# it: supercronic runs each job as `sh-shim -c COMMAND`.
with: [sh-shim]

services:
  # supercronic, as its own user, starts the crontab's jobs on their
  # schedule: it reads the crontab and the image, writes only its own
  # directories, and reaches nothing on the network. Each job is its child,
  # under this same leash: the user, pledge, files, programs and ceilings
  # here are the jobs' too, and a job runs as `sh-shim -c COMMAND` (the
  # sh-shim form's `allow: [sh]` lets it), which can start only a program a
  # `run` line names. A form with jobs lays its own
  # file here: a `run` line naming each job's program, and what they need
  # beyond these (`wpath`, `connect`, `write`, more `memory`). -no-reap:
  # supercronic is not PID 1, and leash-reap kills what a job leaves.
  cron:
    exec: /usr/bin/supercronic -json -no-reap /etc/cron/crontab
    user: supercronic
    pledge: stdio rpath proc exec
    read: /etc/cron
    memory: 64
    # Jobs are background work: a quarter share of contended CPUs, so a job
    # cannot starve the services it runs beside.
    cpu: 25
