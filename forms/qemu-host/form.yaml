# qemu-host: sshd plus QEMU and KVM, to run virtual machines of its own.
# It allows kvm (form.yaml's allow): KVM starts, but its guests cannot
# run virtual machines in turn, as nested virtualization is how a guest
# reaches its host's hypervisor. A form that wants that too allows
# nested-kvm. Wolfi's qemu brings both system emulators, the firmware and
# qemu-img; the guests' images belong on /data, which QEMU reads, not runs.
base: sshd

packages:
  - qemu

# Taken back of werewolf's defaults (lib/allow.zig): KVM, for its guests,
# which cannot run virtual machines of their own (no nested-kvm).
allow: [kvm]

# QEMU's user-mode network, as root: the guests' names, through unwound,
# which audits each one, and HTTP and HTTPS, through the host's own sockets.
net:
  - lookup root * all unfiltered
  - connect root tcp/80 tcp/443

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  network-root-dns-assigned: root forwards its guests' DNS queries to unwound, which may resolve any name for them, audited
  network-root-https-arbitrary: root forwards its guests' HTTPS connections
  network-no-login: sshd, by key, is what this form is for; busybox-full brings telnetd too, which nothing starts
  programs-no-downloaders: busybox-full, the tools of those who log in, has wget, nc and telnet
  programs-no-interpreters: busybox-full, the tools of those who log in, has awk
  programs-no-shell: busybox-full's shell, for those who log in
  ?kernel-no-hypervisor: it runs virtual machines, as its form allows, wherever its host lends it the hardware (EL2 on aarch64, VMX or SVM on x86_64)
