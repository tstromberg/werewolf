# prod: the production base, and what a form with a purpose builds on. CI
# publishes it; see docs/releases.md. On minimal, it adds:
#
# - an address from the network's DHCP server when the kernel command line
#   names none: werewolf's own client (cmd/dhcp-client), and the dhcp-client
#   service that renews the lease;
# - its config from a cloud's metadata server (GCP, AWS, Hetzner Cloud,
#   Azure) when no config tar is on a disk or beside the victim
#   (cmd/cloud-metadata; docs/cloud.md);
# - /data on a disk, when werewolf.data names one, in LUKS2 when the config
#   brings data.key (docs/data.md).
#
# It listens on nothing.
base: minimal

packages:
  - e2fsprogs             # mke2fs, e2fsck, for /data
  - cryptsetup            # /data's LUKS2

# Each program's half that talks to the network, as a user of its own:
# _dhcp reads it for the DHCP client, and _cloud asks the metadata server.
accounts:
  groups:
    - groupname: _dhcp
      gid: 67
    - groupname: _cloud
      gid: 68
  users:
    - username: _dhcp
      uid: 67
      gid: 67
      homedir: /var/empty
      shell: /sbin/nologin
    - username: _cloud
      uid: 68
      gid: 68
      homedir: /var/empty
      shell: /sbin/nologin

# werewolf's programs from cmd/ this form's machines run, beside the
# ones every form has (docs/programs.md)
programs: [dhcp-client, cloud-metadata, service-config]

# The metadata server, where the user data and its secrets are, is reached
# by one user alone: _cloud, cmd/cloud-metadata's fetcher, which asks at
# boot before this policy is set, held to TCP port 80 by its own Landlock,
# and then every minute as the cloud-metadata service, so a config changed
# at the cloud (its people, its secrets) reaches the running machine. The
# machine has no service account there (howl gives it none), so the server
# holds no token for anyone.
net:
  - metadata _cloud

# GCP's disks and NIC: SCSI disks behind virtio-scsi (the boot disk on
# older machine types), and NVMe and Google's gVNIC (on newer ones, Arm's
# included). Kept out of minimal, which runs where virtio is enough.
modules:
  - virtio_scsi sd_mod nvme gve
  # AWS's NIC, the ENA; its disks are NVMe, as above.
  - ena
  # Azure's disks and synthetic NIC, on Hyper-V's VMBus, which is built in,
  # as is the NIC on x86_64. Loaded only on Hyper-V (`@hyperv`; stage0
  # tells modload where the kernel registered VMBus, before it looks for the
  # slot's disk, which may be behind it): elsewhere they find no VMBus, and
  # hv_storvsc alone cost every boot 18 ms finding none. Accelerated
  # networking's VF, a fast path beside the synthetic NIC, is left out: the
  # NIC carries everything without it.
  - "@hyperv hv_storvsc"
  - aarch64 @hyperv hv_netvsc
  # Packet sockets, for the DHCP client, which has no address to send from
  # until its lease arrives.
  - af_packet
  # /data's LUKS. XTS and generic AES are built in, but the hardware AES
  # drivers are modules, and with the loader closed nothing pulls them in on
  # demand: without them dm-crypt still works, much slower, and says nothing.
  - dm-crypt
  - aarch64 aes-ce-blk
  - x86_64 aesni-intel
