# php: nginx, handing PHP to php-fpm. leash starts php-fpm
# (etc/sv/php-fpm/service) as the php user, which may bind no port: it
# answers on a UNIX socket in its own directory, /run/svc/php-fpm, that
# only nginx's group may use, and php's group is nginx's, so nothing else
# on the machine reaches it. Scripts are in /usr/share/nginx/html with the
# rest of the site, from the image: PHP cannot change its own code. See
# docs/forms.md.
base: nginx

packages:
  - php-8.4-fpm

accounts:
  users:
    - username: php
      uid: 203
      gid: 221
      homedir: /var/empty
      shell: /sbin/nologin

# Taken back of werewolf's defaults (lib/allow.zig): PCRE2 compiles each
# pattern to machine code.
allow: [jit]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: php-fpm runs the application, which is what this form is for
  kernel-write-xor-execute: PCRE2, PHP's regular expressions, compiles each pattern to machine code (allow jit)
