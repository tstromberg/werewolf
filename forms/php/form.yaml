# php: nginx, handing PHP to php-fpm. leash starts php-fpm as the php
# user, which may bind no port: it answers on a UNIX socket in its own
# directory, /run/svc/php-fpm, mode 0660 for php's group, which nginx
# joins (its service's `group: php`), so nothing else on the machine
# reaches it. Scripts are in /usr/share/nginx/html with the
# rest of the site, from the image: PHP cannot change its own code. See
# docs/forms.md.
base: nginx

packages:
  - php-8.4-fpm

# Taken back of werewolf's defaults (lib/allow.zig): PCRE2 compiles each
# pattern to machine code.
allow: [jit]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: php-fpm runs the application, which is what this form is for
  kernel-write-xor-execute: PCRE2, PHP's regular expressions, compiles each pattern to machine code (allow jit)

services:
  # nginx, as its own user: it may bind :80 and no other port, read its
  # configuration and the image, connect to php-fpm's socket, and run only
  # itself.
  nginx:
    exec: /usr/bin/nginx -e stderr
    before: /usr/bin/nginx -e stderr -t -q
    user: nginx
    group: php
    pledge: stdio rpath wpath proc unix inet listen connect aio sendfile
    listen: [tcp/80]
    read: /etc/nginx
    connect: [/run/svc/php-fpm/php.sock]

  # php-fpm, as its own user, its socket in its own directory: it reads its
  # configuration and the image, reaches nothing on the network, and runs
  # only itself.
  php-fpm:
    exec: /usr/bin/php-fpm --nodaemonize --force-stderr --fpm-config /etc/php/php-fpm.conf
    before: /usr/bin/php-fpm --test --fpm-config /etc/php/php-fpm.conf
    user: php
    pledge: stdio rpath wpath proc unix listen
    memory: 512
    read: /etc/php
    # nginx, in php's group, reaches its socket, /run/svc/php-fpm/php.sock,
    # mode 0660.
    share: shared
