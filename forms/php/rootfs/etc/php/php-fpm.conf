; php-fpm for the php form: one pool, on a UNIX socket in its own
; directory, which nginx's group may use and no one else. leash starts it
; as the php user (etc/sv/php-fpm/service), so there is no root master to
; drop privileges from and no user to name. This file is the whole
; configuration: Wolfi's php-fpm.d is not read.

[global]
; --force-stderr sends the log to the console, like every service; the
; file is only where php-fpm insists on opening one.
error_log = /run/svc/php-fpm/error.log
daemonize = no
pid = /run/svc/php-fpm/php-fpm.pid

[app]
listen = /run/svc/php-fpm/php.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
; Only scripts nginx serves, and no way to run a file of another name.
security.limit_extensions = .php
php_admin_value[upload_tmp_dir] = /run/svc/php-fpm
php_admin_value[sys_temp_dir] = /run/svc/php-fpm
php_admin_value[session.save_path] = /run/svc/php-fpm
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_include] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
