# PostgreSQL's clients for the umami form. Local roles are their system
# users, over the socket. Umami, in an image of its own, cannot reach the
# socket, so the role umami alone comes in over loopback TCP, to the
# postgres database, without a password: leash lets no service but Umami
# connect to 5432, and fence lets nothing off the machine reach it.
# Everything else is refused.
local	all	all			peer
host	postgres	umami	127.0.0.1/32	trust
