# Kafka's log, to the console alone: no files in the root or on /data.
# Warnings, its start, failed logins (Selector) and denied requests (the
# authorizer's log), each line starting with the program's name.
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = kafka: %p %m (%c)%n
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console
logger.server.name = kafka.server.KafkaRaftServer
logger.server.level = info
logger.selector.name = org.apache.kafka.common.network.Selector
logger.selector.level = info
logger.authorizer.name = kafka.authorizer.logger
logger.authorizer.level = info
