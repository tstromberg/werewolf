# Kafka's configuration in the image: one node, broker and controller
# (KRaft). kafka-setup copies it to /run/svc/kafka/server.properties at
# each start and adds what the machine gives: the name clients reach it
# by, the admin as super user, and the controller listener's password,
# made then. See forms/kafka/README.md.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9094
controller.listener.names=CONTROLLER

# Clients on :9093, by TLS and SCRAM-SHA-512 alone. The controller on
# loopback, where only this node's broker logs in.
listeners=CLIENTS://0.0.0.0:9093,CONTROLLER://127.0.0.1:9094
listener.security.protocol.map=CLIENTS:SASL_SSL,CONTROLLER:SASL_PLAINTEXT
inter.broker.listener.name=CLIENTS
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
sasl.mechanism.controller.protocol=PLAIN
listener.name.clients.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.clients.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.controller.sasl.enabled.mechanisms=PLAIN

# The config's key and certificate, PEM, which kafka-setup puts in one
# file. The certificate trusts itself: Kafka checks at start that its
# broker could reach itself with these settings.
ssl.keystore.type=PEM
ssl.keystore.location=/run/svc/kafka/tls.pem
ssl.truststore.type=PEM
ssl.truststore.location=/run/svc/kafka/tls-cert
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.client.auth=none

# What no ACL allows is denied, to all but the super users.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
# Topics are the admin's to make, not a client's to ask for.
auto.create.topics.enable=false

log.dirs=/data/svc/kafka/log
num.partitions=1
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=168
