# webshell-example: a deliberately vulnerable web application, leashed, to
# show werewolf contains remote code execution (docs/forms.md, and
# usr/lib/app/webshell.py). It is prod and Python, as the python form is;
# the app runs arbitrary commands from HTTP and proves it gains nothing.
#
# It ships coreutils and net-tools too, so the image holds dozens of real
# programs -- cat, dd, chroot, ifconfig, route among them. The leash lets
# the application exec only three of them (hostname, id, uname; see
# etc/sv/app/service), so the demo shows both that remote execution does
# run and that the `run` allowlist, not the mere absence of tools, is what
# bounds it: cat /etc/shadow and ifconfig are right there and still refused.
base: python

packages:
  - py3.13-flask
  - py3.13-gunicorn
  - coreutils             # id, uname (and cat, dd, chroot: present, not allowed to run)
  - net-tools             # hostname (and ifconfig, route: present, not allowed to run)

# The page serves on 8080.
net:
  - listen tcp/8080

# /bin/sh as sh-shim, so the page's shell commands, as an application's
# `sh -c` would, run one allowed program or are refused (cmd/sh-shim).
with: [sh-shim]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: python3 runs the deliberately vulnerable application
  programs-no-network-tools: net-tools ships on purpose, to show the leash refuses ifconfig and route, not their absence
