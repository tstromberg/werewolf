# webshell-example: a deliberately vulnerable web application, leashed, to
# show werewolf contains remote code execution (docs/forms.md, and
# usr/lib/app/webshell.py). It is prod and Python, as the python form is;
# the app runs arbitrary commands from HTTP and proves it gains nothing.
#
# It ships coreutils and net-tools too, so the image holds dozens of real
# programs -- cat, dd, chroot, ifconfig, route among them. The leash lets
# the application exec only three of them (hostname, id, uname; see
# etc/sv/app/service), so the demo shows both that remote execution does
# run and that the `run` allowlist, not the mere absence of tools, is what
# bounds it: cat /etc/shadow and ifconfig are right there and still refused.
base: python

packages:
  - py3.13-flask
  - py3.13-gunicorn
  - coreutils             # id, uname (and cat, dd, chroot: present, not allowed to run)
  - net-tools             # hostname (and ifconfig, route: present, not allowed to run)

# /bin/sh as sh-shim, so the page's shell commands, as an application's
# `sh -c` would, run one allowed program or are refused (cmd/sh-shim).
with: [sh-shim]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: python3 runs the deliberately vulnerable application
  programs-no-network-tools: net-tools ships on purpose, to show the leash refuses ifconfig and route, not their absence

services:
  # The webshell, as the app user. It may bind :8080 and nothing more, and
  # `run` names the programs it may exec. Landlock grants exec per file, and
  # Wolfi's coreutils is one multi-call binary (cat, dd, chroot ... all
  # symlinks to /usr/bin/coreutils), so naming id or cat allows every
  # coreutils applet; they run as app and gain nothing, held by the read and
  # write floor, the dropped capabilities and the empty network. net-tools
  # ships separate files, so hostname runs and ifconfig and route, unnamed,
  # are refused at the exec. /bin/sh is sh-shim, which runs one of these or
  # nothing (the sh-shim form's `allow: [sh]`). No `connect`, so the
  # app reaches nothing on the network. One worker, so every visitor sees the
  # same history, but threaded: a sync worker blocks on a browser's idle
  # preconnect until its timeout kills it, and every other request waits.
  app:
    exec: /usr/bin/python3 -m gunicorn --bind 0.0.0.0:8080 --workers 1 --worker-class gthread --threads 8 --worker-tmp-dir /run/svc/app --no-control-socket --pythonpath /usr/lib/app webshell:app
    user: app
    # landlock and seccomp let leash, run by cat's link below, narrow it.
    pledge: stdio rpath wpath proc unix inet listen exec landlock seccomp
    # The programs this RCE may exec: who and where it runs, and read-only
    # tools. They can read only what the leash's floor grants -- /etc/passwd
    # prints, /etc/shadow is refused -- and change nothing. Everything else in
    # the image (cp, dd, chroot, ifconfig, a shell) is refused by Landlock.
    run:
      - /usr/bin/hostname /usr/bin/id /usr/bin/uname /usr/bin/whoami /usr/bin/nproc
      - /usr/bin/cat /usr/bin/ls /usr/bin/head /usr/bin/tail /usr/bin/wc /usr/bin/echo /usr/bin/date /usr/bin/env /usr/bin/pwd
    memory: 512
    listen: [tcp/8080]
    env: [PYTHONDONTWRITEBYTECODE=1, PYTHONUNBUFFERED=1]
    # cat also runs narrowed, by /etc/sv/app/narrow/cat, its link to leash
    # (docs/design/narrow.md): it reads the image, but not the account list or
    # the app's own files, as the app may; it writes nothing and has no network.
    narrow: /usr/bin/cat pledge stdio rpath
