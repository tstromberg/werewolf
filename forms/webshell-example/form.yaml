base: python

# The page serves on 8080.
net:
  - listen tcp/8080

# /bin/sh as sh-shim, so the page's shell commands, as an application's
# `sh -c` would, run one allowed program or are refused (cmd/sh-shim).
with: [sh-shim]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: python3 runs the deliberately vulnerable application
  programs-no-network-tools: net-tools ships on purpose, to show the leash refuses ifconfig and route, not their absence
