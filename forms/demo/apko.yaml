# demo: werewolf, shown off, on the production base (prod). nginx serves
# one page about the machine it runs on: its kernel and uptime, the last 25
# patches it applied to itself with the CVEs they fixed, what grype finds in
# it, and its packages. The page and the scan come from
# /usr/lib/werewolf/status-page (forms/demo/cmd/status-page/status-page.zig), run as the status and grype
# users; the image has no shell. It checks
# Wolfi and Alpine hourly, not every 20 hours (etc/werewolf/update-every).
# Boot it from a slot (bite), so that /data, which holds grype's database
# and the page's history, is on a disk. See forms/demo/README.md.
contents:
  packages:
    - nginx-mainline        # shares openssl 4 with the rest of the image
    - grype
