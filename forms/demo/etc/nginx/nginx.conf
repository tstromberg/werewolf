# nginx for the demo form: one page, written every minute by the status
# service into /data/svc/status/www, served read-only. runsv starts nginx
# through etc/sv/nginx/run, a link to the binary, with no arguments and no
# shell: this file is the whole configuration.

daemon off;                         # runsv supervises it
user nginx;                         # the master binds :80 as root; workers are nginx
worker_processes auto;
error_log stderr warn;              # the console, like every service
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Wolfi builds nginx to keep these under /var/lib/nginx/tmp, which
    # nothing creates; nginx makes only the last directory of each, and
    # /run is RAM.
    client_body_temp_path /run/nginx-client-body;
    proxy_temp_path       /run/nginx-proxy;
    fastcgi_temp_path     /run/nginx-fastcgi;
    uwsgi_temp_path       /run/nginx-uwsgi;
    scgi_temp_path        /run/nginx-scgi;

    types {
        text/html html;
        image/png png;
    }
    default_type application/octet-stream;
    charset utf-8;

    # A machine on the internet is scanned all day; its access log would
    # bury the console.
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1k;

    server {
        listen 80 default_server;
        root /data/svc/status/www;
        index index.html;

        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            limit_except GET { deny all; }
        }
        location = /index.html {
            limit_except GET { deny all; }
        }
        # The logo (media/logo-small.png), from the image, not /data.
        location = /logo.png {
            root /usr/share/werewolf-demo;
            limit_except GET { deny all; }
            add_header Cache-Control "public, max-age=86400" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header X-Content-Type-Options nosniff always;
        }
        # Nothing else is served: not the page's temporary files, nor
        # anything that might one day sit beside it.
        location / {
            return 404;
        }
    }
}
