base: postgresql

# nginx serves the status page.
net:
  - listen tcp/80
  # grype fetches its vulnerability database over HTTPS.
  - connect grype tcp/443 udp/53 tcp/53

# make check's, for this form alone (forms/README.md)
check:
  memory: 2048

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  kernel-write-xor-execute: PostgreSQL compiles costly queries to machine code with LLVM (postgresql's jit allowance)
