# python: prod, running a Python application. leash starts it
# (etc/sv/app/service) as the app user, able to bind :8080 and nothing
# else, reading the image and writing only /run/svc/app and /data/svc/app.
# The application is /usr/lib/app, verified and read-only with the rest of
# the root: a form of your own includes this one and lays its files there,
# its packages (py3.13-*) in its contents, and its own etc/sv/app/service
# if it starts differently. Until then, a server of one line. See
# docs/forms.md.
include: prod.yaml
contents:
  packages:
    - python-3.13

accounts:
  groups:
    - groupname: app
      gid: 204
  users:
    - username: app
      uid: 204
      gid: 204
      homedir: /var/empty
      shell: /sbin/nologin
