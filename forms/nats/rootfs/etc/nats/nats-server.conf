# nats-server for the nats form: clients over TLS on :4222, each a user
# the config names with the subjects it may publish and subscribe to,
# JetStream on /data. leash starts it (etc/sv/nats/service) as the nats
# user; leash copies the certificate, key and users' file from the
# config into /run/svc/nats. A form on this one lays its own file here.
server_name: werewolf
listen: 0.0.0.0:4222
# Monitoring on loopback alone: what the server knows of its clients is
# not for the network.
http: 127.0.0.1:8222

tls {
  cert_file: "/run/svc/nats/tls-cert"
  key_file: "/run/svc/nats/tls-key"
  timeout: 2
}

# Who, and what each may do: the config's users.conf, an authorization
# block of users with bcrypt passwords or nkeys and their permissions
# (docs/nats.md). Nothing anonymous. An include is relative to this
# file's directory, so /etc/nats/users is a link to leash's copy in
# /run/svc/nats.
include "users"

jetstream {
  store_dir: "/data/svc/nats"
  max_memory_store: 64MB
  max_file_store: 8GB
}

# Limits under the leash's: a client that floods is held, not the server.
max_payload: 1MB
max_connections: 1000
max_control_line: 4KB
max_pending: 32MB
write_deadline: "10s"
ping_interval: "2m"
