# nats: prod, with a NATS server as the message bus between an
# application's parts: TLS on :4222 with a certificate from the config,
# users with bcrypt passwords (or nkeys) and their permissions from the
# config, nothing anonymous, and JetStream's streams on /data/svc/nats.
# Monitoring answers on loopback alone. Clustering (tcp/6222, routes) is
# a form of your own. leash starts it (etc/sv/nats/service) as the nats
# user. See forms/nats/README.md.
base: prod

packages:
  - nats-server

# NATS serves its clients over TLS, and sends nothing: no routes, no
# leaf nodes, no gateways. Its monitor, on 127.0.0.1:8222, serves the
# machine alone.
net:
  - listen tcp/4222
  - listen tcp/8222 loopback

# The check speaks NATS with its own client.
dev:
  - nats
