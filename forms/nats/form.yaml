# nats: prod, with a NATS server as the message bus between an
# application's parts: TLS on :4222 with a certificate from the config,
# users with bcrypt passwords (or nkeys) and their permissions from the
# config, nothing anonymous, and JetStream's streams on /data/svc/nats.
# Monitoring answers on loopback alone. Clustering (tcp/6222, routes) is
# a form of your own. leash starts it (etc/sv/nats/service) as the nats
# user. See forms/nats/README.md.
base: prod

packages:
  - nats-server

# The check speaks NATS with its own client.
dev:
  - nats

services:
  # nats-server, as its own user: it may bind :4222, and :8222 on loopback
  # for monitoring (which fence lets no one outside reach), read its
  # configuration and the image, and write only its own directories. It
  # reaches nothing on the network. Its certificate, key and the users'
  # file come from the machine's config: missing, the service parks with a
  # line naming the file.
  nats:
    exec: /usr/bin/nats-server -c /etc/nats/nats-server.conf
    user: nats
    pledge: stdio rpath wpath inet unix listen proc
    listen: [tcp/4222, tcp/8222 loopback]
    read: /etc/nats
    config:
      - tls-cert /run/config/nats/tls.crt
      - tls-key /run/config/nats/tls.key
      - users /run/config/nats/users.conf
    memory: 512
    nofile: 65536
    env: [HOME=/run/svc/nats, GOMEMLIMIT=384MiB]
