PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
X11Forwarding no
AllowAgentForwarding no
# No tunnels: a session must not carry traffic past the machine's network
# policy (fence), nor reach a local socket for someone else.
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
# OpenSSH's defaults, less what is weak: SHA-1 and 64-bit MACs, and RSA
# signatures over SHA-1.
MACs -*sha1*,umac-64*
HostKeyAlgorithms -ssh-rsa*
PubkeyAcceptedAlgorithms -ssh-rsa*
LogLevel VERBOSE
# The root is read-only: the host key is made in /run at boot, and keys are
# what init wrote for each user there.
HostKey /run/sshd/ssh_host_ed25519_key
AuthorizedKeysFile /run/werewolf/keys/%u
