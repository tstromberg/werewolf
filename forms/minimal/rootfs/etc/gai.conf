# glibc's address order (gai.conf(5)): IPv4 first. Werewolf's kernel is built
# without IPv6 (cmd/fence/README.md), and glibc cannot tell: it sorts by a UDP
# connect() to each address, which fence refuses on any port not declared for
# UDP, and asks netlink, which pledges refuse. Both families then look
# unusable, IPv6 outranks IPv4 by default, and a tool that tries one address,
# as busybox's nc and wget do, fails with EAFNOSUPPORT.
precedence  ::1/128       50
precedence  ::/0          40
precedence  2002::/16     30
precedence  ::/96         20
precedence  ::ffff:0:0/96 100
