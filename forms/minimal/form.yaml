# minimal: boots, takes the address the kernel command line gives, reads
# config, supervises, and keeps itself current (cmd/slot-update;
# docs/updater.md): booted from a slot, at boot and every hour it asks Wolfi
# and Alpine whether anything in this image has a newer version, and if so
# builds the other slot on the machine, boots it once, and keeps it only if
# it commits; a form's `updates: off` leaves that out. Listens on nothing,
# and has no shell: forms that log people in add busybox-full, as does any
# form built with DEV=1. Every other form includes this one.
#
# It boots anywhere werewolf does: directly, from its own disk (make disk),
# or from a slot bite installed beside a distro, whose filesystem it finds
# by UUID. Then /data is a directory on that filesystem, and bite-cleanup
# removes the distro once the slot has committed. See docs/bite.md.

repositories:
  - https://packages.wolfi.dev/os
keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
packages:
  - wolfi-baselayout
  - runit                 # PID 1 after init: runs services, shuts down cleanly
  - blkid                 # find a filesystem by UUID or label (busybox cannot read xfs or btrfs)
  - apk-tools             # the updater: fetch and verify packages, against the keys in the image
  - erofs-utils           # mkfs.erofs, for the new slot's root
  - zstd                  # stage0's compression, as the build's

archs:
  - aarch64
  - x86_64

# _seal is seal-watch's, once it gives up root: an account no service
# shares, so none may signal it (cmd/seal-watch). _update is the updater's
# network half, which fetches the packages and CVE sources it reads.
accounts:
  groups:
    - groupname: _seal
      gid: 66
    - groupname: _update
      gid: 69
  users:
    - username: _seal
      uid: 66
      gid: 66
      homedir: /var/empty
      shell: /sbin/nologin
    - username: _update
      uid: 69
      gid: 69
      homedir: /var/empty
      shell: /sbin/nologin

# werewolf's programs from cmd/ every form's machines run beyond the ones
# every image has (docs/programs.md): the updater.
programs: [slot-update]

# The updater's network half, as _update: Wolfi and Alpine for apk, and the
# CVE sources, Wolfi's security.json and the kernel CNA's records on
# git.kernel.org, all over HTTPS, and the names to find them. Root, which
# builds and installs the slot, has no network at all.
net:
  - connect _update tcp/443 udp/53 tcp/53

# make check's, for this form alone (forms/README.md): its checks boot the
# slot as bite leaves it, with no way out, so the updater finds nothing.
check:
  offline: true

# Hypervisor devices: virtio's NIC and disks; the NoCloud ISO, as a SCSI
# CD-ROM, for Lima; and the ACPI power button. Clouds' own devices are in
# prod.modules. And the root itself: erofs, on a loop device, through
# dm-verity, which stage0 mounts read-only in every form.
modules:
  - virtio_net virtio_blk sr_mod isofs evdev button erofs loop dm-verity
  # virtio over MMIO, the bus Firecracker puts its devices on, having no
  # PCI: a module in Alpine's arm64 kernel, built into its x86_64 one.
  - aarch64 virtio_mmio
  # arm64's power button, where a device tree wires it to a PL061 GPIO line
  # (QEMU's virt, Apple's VZ): the controller, whose line power-button reads,
  # since linux-virt has no gpio-keys driver to make it a key.
  - aarch64 gpio-pl061
  # The victim's filesystem bite leaves behind: ext4 (Debian, Ubuntu, and
  # werewolf's own disk, and /data's everywhere), xfs (Rocky), btrfs
  # (Fedora). xfs and btrfs load only on a slot that is on them (`@FS`;
  # stage0 tells modload): btrfs's raid6 times itself for 0.17 s at load.
  # btrfs asks the crypto API for its checksum at mount time, after the
  # loader is closed, so crc32c (its default, and Fedora's) is loaded with
  # it; xxhash64 and blake2b checksums would need xxhash_generic and
  # blake2b_generic.
  - ext4
  - "@xfs xfs"
  - "@btrfs btrfs crc32c-cryptoapi"
  # FAT, for werewolf's own disk (docs/design/native-boot.md): the updater and
  # commit write the EFI partition. 437 and utf8 are FAT's default codepage
  # and iocharset in Alpine's kernel. Loaded only there (`@esp`; stage0
  # tells modload when the command line names the partition, werewolf.esp).
  - "@esp vfat nls_cp437 nls_utf8"
