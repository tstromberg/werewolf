# minimal: boots, takes the address the kernel command line gives, reads
# config, supervises. Listens on nothing, and has no shell: forms that log
# people in add busybox-full, as does any form built with DEV=1. Every
# other form includes this one.
#
# It boots anywhere werewolf does: directly, from its own disk (make disk),
# or from a slot bite installed beside a distro, whose filesystem it finds
# by UUID. Then /data is a directory on that filesystem, and bite-cleanup
# removes the distro once the slot has committed. See docs/bite.md.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - runit                 # PID 1 after init: runs services, shuts down cleanly
    - blkid                 # find a filesystem by UUID or label (busybox cannot read xfs or btrfs)

archs:
  - aarch64
  - x86_64

# _seal is seal-watch's, once it gives up root: an account no service
# shares, so none may signal it (cmd/seal-watch).
accounts:
  groups:
    - groupname: _seal
      gid: 66
  users:
    - username: _seal
      uid: 66
      gid: 66
      homedir: /var/empty
      shell: /sbin/nologin
