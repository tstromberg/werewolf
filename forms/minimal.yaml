# minimal: boots, takes the address the kernel command line gives, reads
# config, supervises. Listens on nothing. Every other form includes this
# one, and its folder carries /init.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox-full          # sh, tar, dd, od, adduser, getty, sysctl
    - runit                 # PID 1 after init: runs services, shuts down cleanly

archs:
  - aarch64
  - x86_64
