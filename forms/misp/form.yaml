# misp: prod, with MISP's core image, MariaDB and Valkey on loopback,
# and Caddy in front. The image starts through bash; this execs that
# bash on one script, which replaces itself with misp-serve. PHP
# listens on loopback. The published database password, Redis password
# and GPG passphrase are not used. There is no Python and no
# supervisor. The administrator's password is the config's. See
# forms/misp/README.md.
base: prod

with: [mariadb-tcp, valkey, caddy]

# make check's (forms/README.md): PHP's workers beside MariaDB.
check:
  memory: 6144

services:
  # MISP, as _oci-misp, inside its image. misp-run reads the
  # administrator's password, makes the GPG passphrase once, and execs
  # misp-serve. The image's entrypoint is not used: it would publish
  # FastCGI on every interface and start rsyslog, as root. PHP is on
  # loopback. Workers are one each, as this user. misp-serve's list is
  # the binary, so the web process cannot add a program. It reaches
  # MariaDB, Valkey, and public addresses on 80 and 443 for feeds. A
  # missing password, address or email parks it. The programs below
  # are the ones those jobs exec.
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.50
    exec: /usr/bin/bash /usr/lib/werewolf/misp-run
    pledge: stdio rpath wpath inet unix netlink connect listen proc exec
    listen: tcp/8080 loopback
    connect: [tcp/3306 tcp/6379, tcp/443 tcp/80 public]
    lookup: "*"
    write:
      - /var/www/MISP/app/Config
      - /var/www/MISP/app/files
      - /var/www/MISP/app/tmp
    run:
      - /usr/bin/bash
      - /usr/bin/php8.4
      - /usr/bin/mariadb
      - /usr/bin/mkdir
      - /usr/bin/cp
      - /usr/bin/cat
      - /usr/bin/rm
      - /usr/bin/ln
      - /usr/bin/sleep
      - /usr/bin/gpg
      - /usr/bin/gpg-agent
      - /usr/bin/gpgconf
      - /usr/lib/werewolf/misp-serve
    config:
      - admin-password /run/config/misp/admin-password
      - settings /run/config/misp/settings.json
    setting:
      - base-url url required as BASE_URL
      - admin-email string required as ADMIN_EMAIL
    render: env site
    memory: 2048
    nofile: 16384
    env:
      - MYSQL_HOST=127.0.0.1
      - MYSQL_PORT=3306
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misp
      - MYSQL_DATABASE=misp
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - ENABLE_REDIS_EMPTY_PASSWORD=true
      - MISP_MODULES_FQDN=http://127.0.0.1:9
      - ENABLE_BACKGROUND_UPDATES=false
      - OIDC_ENABLE=false
      - LDAP_ENABLE=false
      - DISABLE_CA_REFRESH=true

  # MariaDB, as mariadb-tcp runs it, on loopback. The role misp, from
  # the SQL, is the only TCP login, and only MISP's leash reaches it.
  mariadb:
    exec: /usr/bin/mariadbd --defaults-file=/etc/mariadb/werewolf.cnf --bind-address=127.0.0.1
    before: /usr/lib/werewolf/mariadb-init
    user: mariadb
    pledge: stdio rpath wpath unix inet listen proc aio
    listen: tcp/3306 loopback
    read: /etc/mariadb /run/werewolf/import
    share: shared
    memory: 1024
    nofile: 16384
    env:
      - UMASK=0640
      - UMASK_DIR=0750
      - PORT=3306

  # Valkey, on loopback TCP, no password: MISP's image cannot see the
  # socket, and nothing off this machine can open the port.
  valkey:
    exec: /usr/bin/valkey-server /etc/valkey/valkey.conf
    before: /usr/lib/werewolf/valkey-init
    user: valkey
    pledge: stdio rpath wpath inet unix listen proc
    listen: tcp/6379 loopback
    read: /etc/valkey /run/werewolf/import
    share: shared
    memory: 256
    nofile: 10240

  # Caddy, as its own user, for MISP. The domain is the site.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/8080]
    lookup: "*"
    read: /etc/caddy
    config: settings /run/config/caddy/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB
