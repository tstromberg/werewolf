# vaultwarden: prod, with Vaultwarden, a server for the Bitwarden password
# manager's apps, and its web vault, on :8080 behind caddy (whose TLS the
# apps require). Wolfi does not ship it yet: melange builds it from a
# pinned release in Wolfi's environment (forms/vaultwarden/melange/vaultwarden.yaml,
# cmd/howl/melange.zig), and the libraries it links are named below, so the
# updater keeps them current. Nobody
# signs up: the admin, whose Argon2 token the config brings, invites each
# user. It sends nothing: no icons fetched, no push, no mail, no breach
# lookups. The vault is in /data/svc/vaultwarden. leash starts it
# (etc/sv/vaultwarden/service) as the vaultwarden user. See
# forms/vaultwarden/README.md.
base: prod

packages:
  # What forms/vaultwarden/melange/vaultwarden.yaml's build links, from Wolfi; the build
  # fails if one is missing.
  - openssl-4.0-libssl
  - openssl-4.0-libcrypto
  - sqlite-libs
  - libgcc

services:
  # Vaultwarden, as its own user: it may bind :8080 and no other port, read
  # the image, and write only its own directories, where the vault is. It
  # reaches nothing on the network. The site's address comes from the
  # machine's settings; the admin's Argon2 token from the config, read by
  # Vaultwarden from leash's copy (ADMIN_TOKEN_FILE): missing, the service
  # parks with a line naming the file.
  vaultwarden:
    exec: /usr/bin/vaultwarden
    user: vaultwarden
    pledge: stdio rpath wpath inet unix listen proc
    listen: [tcp/8080]
    config:
      - admin-token /run/config/vaultwarden/admin-token
      - settings /run/config/vaultwarden/settings.json
    setting: domain url required as DOMAIN
    render: env site
    memory: 256
    nofile: 4096
    env:
      - HOME=/run/svc/vaultwarden
      - ADMIN_TOKEN_FILE=/run/svc/vaultwarden/admin-token
      - DATA_FOLDER=/data/svc/vaultwarden
      - DATABASE_URL=sqlite:///data/svc/vaultwarden/db.sqlite3
      - ENABLE_DB_WAL=true
      - WEB_VAULT_FOLDER=/usr/share/vaultwarden/web-vault
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8080
      - CONFIG_FILE=/etc/vaultwarden/config.json
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - PASSWORD_HINTS_ALLOWED=false
      - SHOW_PASSWORD_HINT=false
      - DISABLE_ICON_DOWNLOAD=true
      - ICON_SERVICE=internal
      - IP_HEADER=X-Forwarded-For
      - LOG_LEVEL=info
      - EXTENDED_LOGGING=true
      - USE_SYSLOG=false
    # The admin page's settings are written nowhere: this file in the image,
    # which does not exist, is where they would go, so the configuration is
    # the image's and the machine's settings alone.
    # No one signs up; the admin invites. No hint is kept or shown.
    # Nothing fetched: an icon download is a request to every site a user
    # saves, from the machine, on their behalf.
    # Behind caddy, which says who the client is.
