# vaultwarden: prod, with Vaultwarden, a server for the Bitwarden password
# manager's apps, and its web vault, on :8080 behind caddy (whose TLS the
# apps require). Wolfi does not ship it yet: melange builds it from a
# pinned release in Wolfi's environment (forms/vaultwarden/melange/vaultwarden.yaml,
# cmd/howl/melange.zig), and the libraries it links are named below, so the
# updater keeps them current. Nobody
# signs up: the admin, whose Argon2 token the config brings, invites each
# user. It sends nothing: no icons fetched, no push, no mail, no breach
# lookups. The vault is in /data/svc/vaultwarden. leash starts it
# (etc/sv/vaultwarden/service) as the vaultwarden user. See
# forms/vaultwarden/README.md.
base: prod

packages:
  # What forms/vaultwarden/melange/vaultwarden.yaml's build links, from Wolfi; the build
  # fails if one is missing.
  - openssl-4.0-libssl
  - openssl-4.0-libcrypto
  - sqlite-libs
  - libgcc

# Vaultwarden serves the apps and the web vault (behind caddy), and sends
# nothing.
net:
  - listen tcp/8080
