# nginx: prod, serving a site from the image. leash starts nginx
# (etc/sv/nginx/service) as the nginx user, master and workers alike, able
# to bind :80 and nothing else, reading its configuration and the image.
# The site is /usr/share/nginx/html, verified and read-only with the rest
# of the root: a form of your own includes this one and lays its files
# there, or its own etc/nginx/nginx.conf over this one's. See
# docs/forms.md.
base: prod

packages:
  - nginx-mainline

# Where it keeps its site: howl's --app DIR is laid here
# (cmd/howl/app.zig).
app: /usr/share/nginx/html

services:
  # nginx, as its own user: it may bind :80 and no other port, read its
  # configuration and the image, and run only itself.
  nginx:
    exec: /usr/bin/nginx -e stderr
    before: /usr/bin/nginx -e stderr -t -q
    user: nginx
    pledge: stdio rpath wpath proc unix inet listen aio sendfile
    listen: [tcp/80]
    read: /etc/nginx
