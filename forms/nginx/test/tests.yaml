version: 1
suites:
  - name: test-nginx
    cases:
      - name: nginx-site
        steps:
          - fetch:
              url: http://127.0.0.1:80/
            expect:
              status: 200
              body:
                contains: nginx is serving this page
            await: 60s
      - name: nginx-not-found
        steps:
          - fetch:
              url: http://127.0.0.1:80/missing.html
            expect:
              status: 404
      - name: nginx-method-refused
        steps:
          - fetch:
              url: http://127.0.0.1:80/
              method: POST
              body: changed
              headers:
                Content-Type: application/x-www-form-urlencoded
            expect:
              status: 403
      # HEAD answers with the status and headers alone: no byte of a body
      # follows them before the server closes. curl reads no body for HEAD,
      # so the conversation is raw.
      - name: nginx-head
        steps:
          - tcp:
              connect: 127.0.0.1:80
              exchange:
                - send: "HEAD / HTTP/1.0\r\nHost: localhost\r\n\r\n"
                - expect:
                    matches: "^HTTP/1\\.[01] 200 [^\r]*\r\n([^\r\n]+\r\n)*\r\n$"
                - close: eof
      - name: nginx-headers
        steps:
          - fetch:
              url: http://127.0.0.1:80/
            expect:
              headers:
                x-content-type-options:
                  matches: ^[Nn][Oo][Ss][Nn][Ii][Ff][Ff]$
                content-security-policy:
                  contains: frame-ancestors
                server:
                  absent: nginx/
      - name: nginx-traversal
        steps:
          - fetch:
              url: http://127.0.0.1:80/../../etc/passwd
            expect:
              status:
                one_of:
                  - 400
                  - 403
                  - 404
              body:
                absent: root:x:0:0
