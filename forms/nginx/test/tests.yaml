version: 1
suites:
  - name: test-nginx
    cases:
      - name: nginx-site
        steps:
          - fetch:
              url: http://127.0.0.1:80/
            expect:
              status: 200
              body:
                contains: nginx is serving this page
            await: 60s
      - name: nginx-not-found
        steps:
          - fetch:
              url: http://127.0.0.1:80/missing.html
            expect:
              status: 404
      - name: nginx-method-refused
        steps:
          - fetch:
              url: http://127.0.0.1:80/
              method: POST
              body: changed
              headers:
                Content-Type: application/x-www-form-urlencoded
            expect:
              status: 403
      - name: nginx-head
        steps:
          - fetch:
              url: http://127.0.0.1:80/
              method: HEAD
            expect:
              status: 200
              body: ''
      - name: nginx-headers
        steps:
          - fetch:
              url: http://127.0.0.1:80/
            expect:
              headers:
                x-content-type-options:
                  matches: ^[Nn][Oo][Ss][Nn][Ii][Ff][Ff]$
                content-security-policy:
                  contains: frame-ancestors
                server:
                  absent: nginx/
      - name: nginx-traversal
        steps:
          - fetch:
              url: http://127.0.0.1:80/../../etc/passwd
            expect:
              status:
                one_of:
                  - 400
                  - 403
                  - 404
              body:
                absent: root:x:0:0
