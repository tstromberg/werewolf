# nginx for the nginx form: the site in /usr/share/nginx/html, from the
# image, served read-only. leash starts nginx (etc/sv/nginx/service) as the
# nginx user, master and workers alike, able to bind :80 and nothing else.
# A form on this one lays its own file here.

daemon off;                         # runsv supervises it
worker_processes auto;
error_log stderr warn;              # the console, like every service
pid /run/svc/nginx/nginx.pid;       # its own directory, from leash

events {
    worker_connections 1024;
}

http {
    # Wolfi builds nginx to keep these under /var/lib/nginx/tmp, which
    # nothing creates and nginx may not write; nginx makes only the last
    # directory of each, in its own.
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path       /run/svc/nginx/proxy;
    fastcgi_temp_path     /run/svc/nginx/fastcgi;
    uwsgi_temp_path       /run/svc/nginx/uwsgi;
    scgi_temp_path        /run/svc/nginx/scgi;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # A machine on the internet is scanned all day; its access log would
    # bury the console.
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1m;

    server {
        listen 80 default_server;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
