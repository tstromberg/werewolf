# postgresql: prod, with PostgreSQL 18 for the machine's own services. It
# answers on a UNIX socket in /run/svc/postgres and nothing else: no TCP
# port, and the form declares none. Its data is in /data/svc/postgres.
# leash starts it as the postgres user (etc/sv/postgres/service); before
# each start pg-init makes the cluster if there is none, streams
# /run/werewolf/import/*.sql into that first cluster, and applies the
# SQL a form brings in /usr/share/werewolf-postgres. Local roles are
# their system users (peer authentication). The package is pinned to major 18.
base: prod

packages:
  - postgresql~18
  - posix-libc-utils-bin  # locale -a, without ldd or its bash dependency

dev: [postgresql-client~18]  # peer-authenticated SQL checks

# Taken back of werewolf's defaults (lib/allow.zig): PostgreSQL compiles
# costly queries to machine code with LLVM (jit = on, its default).
allow: [jit]

# werewolf's programs from cmd/ this form's machines run, beside the
# ones every form has (docs/programs.md)
programs: [sh-shim]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  kernel-write-xor-execute: PostgreSQL compiles costly queries to machine code with LLVM (jit = on, its default; allow jit)

services:
  # PostgreSQL, as its own user, for local clients over its UNIX socket
  # alone. pg-init makes the cluster on the first start, and applies the
  # image's SQL before each; initdb starts setup backends through the shim.
  postgres:
    exec: /usr/bin/postgres -D /data/svc/postgres/data -c listen_addresses= -c unix_socket_directories=/run/svc/postgres
    before: /usr/lib/werewolf/pg-init
    user: postgres
    # connect: peer authentication looks the client's uid up, and glibc first
    # tries nscd's socket, which is not there; refused, each login would leave
    # two audit records. It reaches no network: there is no inet promise.
    # shm: PostgreSQL keeps a small SysV segment even with mmap shared memory.
    # Linux uses POSIX semaphores; no SysV semaphores or message queues.
    pledge: stdio rpath wpath proc shm unix listen connect
    run:
      - /usr/bin/initdb
      - /usr/lib/werewolf/sh-shim
      - /usr/bin/locale
    # pg-init streams /run/werewolf/import/*.sql once, while it makes the cluster.
    read: /run/werewolf/import
    # Local clients reach its socket, /run/svc/postgres/.s.PGSQL.5432.
    share: shared
