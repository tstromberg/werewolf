# Loki for the loki form: one process, on loopback behind Caddy, single
# tenant, its data in /data/svc/loki, kept 31 days. No usage reports to
# Grafana Labs, no ruler API; fence lets it reach nothing anyway.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/svc/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /data/svc/loki/chunks
      rules_directory: /data/svc/loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 744h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

compactor:
  working_directory: /data/svc/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
