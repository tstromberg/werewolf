# openbao: prod, with OpenBao keeping secrets, on a machine where root
# cannot read another process's memory. Integrated storage (raft) in
# /data/svc/openbao; the API on :8200, TLS, with a certificate from the
# config; unsealed by a static key from the config, and initialized by
# itself on its first start: the stdout audit device, an admin policy and
# a userpass admin whose first password the config brings, then the root
# token revoked (etc/openbao/openbao.hcl). leash starts it (etc/sv/openbao/service) as the openbao
# user. A cloud KMS in place of the static seal is a form of your own.
# See forms/openbao/README.md.
base: prod

packages:
  - openbao

services:
  # OpenBao, as its own user: it may bind :8200, and :8201 on loopback for
  # raft's cluster listener, which fence lets no one outside reach; read
  # its configuration and the image; and write only its own directories,
  # raft's storage being /data/svc/openbao itself. It reaches nothing on
  # the network.
  openbao:
    exec: /usr/bin/bao server -config=/run/svc/openbao/config.json -config=/etc/openbao/openbao.hcl
    user: openbao
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/8200, tcp/8201 loopback]
    read: /etc/openbao
    # The unseal key (32 random bytes), the API's certificate and key, and
    # the admin's first password, from the machine's config: missing, the
    # service parks with a line naming the file.
    config:
      - unseal-key /run/config/openbao/unseal-key
      - tls-cert /run/config/openbao/tls.crt
      - tls-key /run/config/openbao/tls.key
      - admin-password /run/config/openbao/admin-password
      - settings /run/config/openbao/settings.json
    # The address clients reach it at, into the image's configuration.
    setting:
      - api-addr url required as api_addr
      - unseal-key-id string as seal.static.current_key_id
    render: json config.json from /etc/openbao/config.json
    memory: 768
    nofile: 65536
    env: [HOME=/run/svc/openbao, GOMEMLIMIT=512MiB]
