# openbao: prod, with OpenBao keeping secrets, on a machine where root
# cannot read another process's memory. Integrated storage (raft) in
# /data/svc/openbao; the API on :8200, TLS, with a certificate from the
# config; unsealed by a static key from the config, and initialized by
# itself on its first start: the stdout audit device, an admin policy and
# a userpass admin whose first password the config brings, then the root
# token revoked (etc/openbao/openbao.hcl). leash starts it (etc/sv/openbao/service) as the openbao
# user. A cloud KMS in place of the static seal is a form of your own.
# See forms/openbao/README.md.
base: prod

packages:
  - openbao

# OpenBao serves its API and UI on :8200, and sends nothing: its seal is
# a key on the machine. A form that unseals with a cloud KMS adds
# `connect openbao tcp/443 udp/53 tcp/53` and `metadata openbao`; one that
# clusters makes `listen tcp/8201` public; here raft's cluster listener
# is on loopback, for the machine alone.
net:
  - listen tcp/8200
  - listen tcp/8201 loopback
