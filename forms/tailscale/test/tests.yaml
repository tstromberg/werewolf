version: 1
suites:
  - name: tailscale
    cases:
      - name: tailscale-private
        steps:
          - file: /run/svc/tailscale/auth-key
            expect:
              type: file
              uid: tailscale
              mode: '600'
            await: 60s
      - name: tailscale-user
        steps:
          - service: tailscale
            expect:
              user: tailscale
              uid:
                min: 65536
              capabilities: []
              no_new_privileges: true
      - name: tailscale-no-tun
        steps:
          - file: /dev/net/tun
            expect:
              exists: false
          - file: /proc/sys/net/ipv4/ip_forward
            expect:
              body: "0\n"
      - name: tailscale-listeners
        steps:
          - listeners: tcp
            expect:
              equals:
                - protocol: tcp
                  address: 127.0.0.53
                  port: 53
          - listeners: udp
            expect:
              equals:
                - protocol: udp
                  address: 127.0.0.53
                  port: 53
                - protocol: udp
                  address: 0.0.0.0
                  port: 41641
            await: 60s
      - name: tailscale-config
        steps:
          - file: /run/svc/tailscale/config.json
            expect:
              type: file
              uid: tailscale
              mode: '600'
              json:
                /advertiseRoutes: [10.20.0.0/24]
                /locked: true
  - name: tailscale-policy
    source: driver.zig
    mode: policy
    user: nobody
    policy:
      pledge: stdio rpath
      read: [/usr/share/werewolf/net]
    cases:
      seed: [tailscale-no-ingress]
      verify: [tailscale-no-ingress]
