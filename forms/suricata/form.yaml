# suricata: prod, with Suricata capturing eth0 and writing its alerts
# to /data. The service keeps CAP_NET_RAW and CAP_NET_ADMIN for the
# AF_PACKET socket and promiscuous mode. Its pledge has packet and the
# bind() that socket needs, and no inet, so it cannot fetch. The engine
# is rebuilt without -march=native (forms/suricata/melange) and reads
# /usr/share/suricata/suricata.yaml. rules-fetch, as _rules, caches
# Emerging Threats Open on the data partition and refreshes it.
# Suricata does not own that cache. The unix control socket is off,
# and nothing listens. See forms/suricata/README.md.
base: prod

packages:
  - suricata

# Taken back of werewolf's defaults (lib/allow.zig): Suricata opens a
# packet socket and sets promiscuous mode.
allow: [packet, netadmin]

# The posture checks this form fails, and why (forms/README.md).
weaknesses:
  network-fence-unbypassable: Suricata captures the interface and sets promiscuous mode; the bounding set keeps CAP_NET_RAW and CAP_NET_ADMIN for that service

programs: [crash-log.so]

# python and suricata-update, which the package depends on and nothing
# runs. rules-fetch downloads the signature cache.
prune:
  - usr/bin/python3.13
  - usr/bin/python3
  - usr/bin/python
  - usr/bin/suricata-update

# make check's (forms/README.md): Suricata's own beside the machine's.
# The signature cache is large enough that the engine wants 2 GiB.
check:
  memory: 4096

services:
  # rules-fetch, as _rules. It copies the image's rules and caches
  # Emerging Threats Open under /data. share: shared lets Suricata open
  # a file there. The files are mode 0644, owned by _rules, so the
  # engine cannot replace them. TCP 443 is public; DNS is the resolver.
  rules-fetch:
    exec: /usr/lib/werewolf/rules-fetch
    user: _rules
    pledge: stdio rpath wpath inet unix netlink connect proc
    connect: [tcp/443 public, udp/53 tcp/53]
    read: [/usr/share/suricata, /etc/suricata]
    share: shared
    memory: 128

  # Suricata, as its own user, captures eth0 with the AF_PACKET ring
  # and reads the cache rules-fetch wrote. It writes logs under
  # /data/svc/suricata. packet is the capture socket; listen is bind()
  # for that socket, and no TCP port is declared, so Landlock refuses a
  # TCP bind. No inet, so it cannot fetch. The unix command socket is
  # off. runit supervises it, so it writes no pid file. before waits
  # briefly for the signature cache, then starts on whatever rules are
  # already there.
  suricata:
    exec: /usr/bin/suricata -c /usr/share/suricata/suricata.yaml --af-packet -l /data/svc/suricata --set default-log-dir=/data/svc/suricata --set
      unix-command.enabled=no --set default-rule-path=/data/svc/rules-fetch/rules --set
      classification-file=/data/svc/rules-fetch/rules/classification.config --set reference-config-file=/usr/share/suricata/reference.config --set
      rule-files.0=werewolf.rules --set rule-files.1=app-layer-events.rules --set rule-files.2=decoder-events.rules --set
      rule-files.3=dhcp-events.rules --set rule-files.4=dnp3-events.rules --set rule-files.5=dns-events.rules --set rule-files.6=enip-events.rules
      --set rule-files.7=files.rules --set rule-files.8=ftp-events.rules --set rule-files.9=http-events.rules --set rule-files.10=http2-events.rules
      --set rule-files.11=ipsec-events.rules --set rule-files.12=kerberos-events.rules --set rule-files.13=ldap-events.rules --set
      rule-files.14=mdns-events.rules --set rule-files.15=modbus-events.rules --set rule-files.16=mqtt-events.rules --set
      rule-files.17=nfs-events.rules --set rule-files.18=ntp-events.rules --set rule-files.19=pgsql-events.rules --set rule-files.20=pop3-events.rules
      --set rule-files.21=quic-events.rules --set rule-files.22=rfb-events.rules --set rule-files.23=smb-events.rules --set
      rule-files.24=smtp-events.rules --set rule-files.25=ssh-events.rules --set rule-files.26=stream-events.rules --set
      rule-files.27=tls-events.rules --set rule-files.28=websocket-events.rules --set rule-files.29=emerging.rules --init-errors-fatal
    before: /usr/lib/werewolf/rules-fetch wait
    user: suricata
    caps: net_raw net_admin
    pledge: stdio rpath wpath unix proc packet listen
    # A fatal signal writes its pc here. Suricata dies in silence otherwise.
    env: [LD_PRELOAD=/usr/lib/werewolf/crash-log.so, CRASH_LOG=/data/svc/suricata/crash.log]
    read: [/etc/suricata, /usr/share/suricata, /data/svc/rules-fetch]
    memory: 2048
