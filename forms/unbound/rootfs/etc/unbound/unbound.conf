# Unbound, the unbound form's resolver (forms/unbound/README.md): recursive
# and validating, for private networks alone. unbound-setup writes the
# include at the end before each start: the addresses Unbound listens on,
# and the forward zones the machine's settings name.
server:
	# leash starts it as its own user, in its own directories: no chroot,
	# no user to change to, no pid file, the console for its log.
	chroot: ""
	username: ""
	directory: "/data/svc/unbound"
	pidfile: ""
	do-daemonize: no
	use-syslog: no
	logfile: ""
	verbosity: 1
	log-servfail: yes

	port: 53
	do-udp: yes
	do-tcp: yes

	# Every address answers the private networks alone: loopback,
	# RFC 1918, carrier-grade NAT (100.64/10), link-local, and IPv6's
	# unique local and link-local. The rest are refused, so it is no open
	# resolver for anyone to amplify through. No private-address: internal
	# names in public DNS still resolve.
	access-control: 0.0.0.0/0 refuse
	access-control: ::/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: ::1/128 allow
	access-control: 10.0.0.0/8 allow
	access-control: 172.16.0.0/12 allow
	access-control: 192.168.0.0/16 allow
	access-control: 100.64.0.0/10 allow
	access-control: 169.254.0.0/16 allow
	access-control: fc00::/7 allow
	access-control: fe80::/10 allow

	# Validating, from the root's keys: unbound-setup seeds the file from
	# the image (dnssec-root) on the first start, and Unbound follows the
	# root's key rollovers in it from then on (RFC 5011).
	module-config: "validator iterator"
	auto-trust-anchor-file: "/data/svc/unbound/root.key"
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	harden-algo-downgrade: yes
	harden-large-queries: yes
	harden-short-bufsize: yes
	qname-minimisation: yes
	aggressive-nsec: yes
	val-clean-additional: yes
	# A flood of unwanted replies, a spoofing attempt, clears the cache.
	unwanted-reply-threshold: 10000000

	# Says nothing about itself, and answers no ANY in full.
	hide-identity: yes
	hide-version: yes
	hide-trustanchor: yes
	deny-any: yes
	minimal-responses: yes
	# 1232 bytes, so no answer is fragmented (fence drops fragments).
	edns-buffer-size: 1232

	# One thread, caches of 96 MiB in all, under leash's 256 MiB.
	num-threads: 1
	msg-cache-size: 32m
	rrset-cache-size: 64m
	key-cache-size: 8m
	neg-cache-size: 4m
	outgoing-range: 4096
	num-queries-per-thread: 2048
	prefetch: yes
	prefetch-key: yes

# Nothing controls it but this file: no control socket, on the network or
# off it. A new configuration is a restart.
remote-control:
	control-enable: no

include: "/run/svc/unbound/unbound-setup.conf"
