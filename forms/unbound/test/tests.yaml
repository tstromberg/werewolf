version: 1
packages:
  - drill
suites:
  - name: unbound
    policy:
      run:
        - /usr/bin/drill
    cases:
      - name: unbound-answers
        steps:
          - exec:
              argv:
                - /usr/bin/drill
                - localhost
                - '@127.0.0.1'
              readonly: true
            expect:
              exit: 0
              stdout:
                matches: "(^|\n)localhost\\.[[:space:]]+[^\n]*IN[[:space:]]+A[[:space:]]+127\\.0\\.0\\.1(\n|$)"
            await: 60s
          - exec:
              argv:
                - /usr/bin/drill
                - -t
                - localhost
                - '@127.0.0.1'
              readonly: true
            expect:
              exit: 0
              stdout:
                matches: "(^|\n)localhost\\.[[:space:]]+[^\n]*IN[[:space:]]+A[[:space:]]+127\\.0\\.0\\.1(\n|$)"
            await: 60s
          - exec:
              argv:
                - /usr/bin/drill
                - localhost
                - '@10.0.2.15'
              readonly: true
            expect:
              exit: 0
              stdout:
                matches: "(^|\n)localhost\\.[[:space:]]+[^\n]*IN[[:space:]]+A[[:space:]]+127\\.0\\.0\\.1(\n|$)"
            await: 60s
          - exec:
              argv:
                - /usr/bin/drill
                - -t
                - localhost
                - '@10.0.2.15'
              readonly: true
            expect:
              exit: 0
              stdout:
                matches: "(^|\n)localhost\\.[[:space:]]+[^\n]*IN[[:space:]]+A[[:space:]]+127\\.0\\.0\\.1(\n|$)"
            await: 60s
      - name: unbound-forwards
        steps:
          - file: /run/svc/unbound/unbound-setup.conf
            expect:
              type: file
              uid: unbound
              mode: '600'
              body:
                matches: "(^|\n)[ \t]name: \"corp[.]example[.]\"(\n|$)"
                occurrences:
                  "forward-addr: 10.0.2.3\n": 2
                  'domain-insecure: "10.in-addr.arpa."': 1
                  'local-zone: "10.in-addr.arpa." nodefault': 1
          # Each a whole line of the forward zone, as unbound reads it.
          - file: /run/svc/unbound/unbound-setup.conf
            expect:
              body:
                matches: "(^|\n)[ \t]forward-addr: 10[.]0[.]2[.]3\n([^\n]*\n)*[ \t]forward-addr: 10[.]0[.]2[.]3(\n|$)"
          - file: /run/svc/unbound/unbound-setup.conf
            expect:
              body:
                matches: "(^|\n)[ \t]domain-insecure: \"10[.]in-addr[.]arpa[.]\"(\n|$)"
          - file: /run/svc/unbound/unbound-setup.conf
            expect:
              body:
                matches: "(^|\n)[ \t]local-zone: \"10[.]in-addr[.]arpa[.]\" nodefault(\n|$)"
      - name: unbound-anchor
        steps:
          - file: /data/svc/unbound/root.key
            expect:
              type: file
              uid: unbound
              mode: '600'
              body:
                matches: "(^|\n)\\. [^\n]*DNSKEY[^\n]*257 3 8 [^\n]*\n([^\n]*\n)*\\. [^\n]*DNSKEY[^\n]*257 3 8 "
          - file: /etc/unbound/unbound.conf
            expect:
              body:
                matches: "(^|\n)[ \t]module-config: \"validator iterator\"(\n|$)"
                occurrences:
                  'module-config: "validator iterator"': 1
                  'auto-trust-anchor-file: "/data/svc/unbound/root.key"': 1
          - file: /etc/unbound/unbound.conf
            expect:
              body:
                matches: "(^|\n)[ \t]auto-trust-anchor-file: \"/data/svc/unbound/root[.]key\"(\n|$)"
      - name: unbound-no-ctl
        steps:
          - file: /etc/unbound/unbound.conf
            expect:
              body:
                matches: "(^|\n)[ \t]control-enable: no(\n|$)"
                occurrences:
                  'control-enable: no': 1
          - file: /usr/bin/unbound-control
            expect:
              exists: false
          - file: /usr/bin/unbound-control-setup
            expect:
              exists: false
          - file: /usr/bin/sh
            expect:
              exists: false
          - file: /usr/bin/bash
            expect:
              exists: false
      - name: unbound-refuses
        steps:
          - file: /etc/unbound/unbound.conf
            expect:
              body:
                # Preserve the exact tabs and newlines; quoted plan scalars cannot wrap.
                # yamllint disable-line rule:line-length
                contains: "\taccess-control: 0.0.0.0/0 refuse\n\taccess-control: ::/0 refuse\n\taccess-control: 127.0.0.0/8 allow\n\taccess-control: ::1/128 allow\n\taccess-control: 10.0.0.0/8 allow\n\taccess-control: 172.16.0.0/12 allow\n\taccess-control: 192.168.0.0/16 allow\n\taccess-control: 100.64.0.0/10 allow\n\taccess-control: 169.254.0.0/16 allow\n\taccess-control: fc00::/7 allow\n\taccess-control: fe80::/10 allow\n"
                occurrences:
                  'access-control:': 11
                  'include:': 1
  - name: unbound-policy
    cases:
      - name: unbound-no-sockets
        steps:
          - tree:
              roots:
                - /run/svc/unbound
                - /data/svc/unbound
            expect:
              type:
                not_equals: socket
      # No line, however indented, may widen who unbound answers.
      - name: unbound-no-policy-override
        steps:
          - file: /etc/unbound/unbound.conf
            expect:
              body:
                not_matches: "(^|\n)[ \t\r]*private-address:"
          - file: /run/svc/unbound/unbound-setup.conf
            expect:
              body:
                not_matches: "(^|\n)[ \t\r]*(private-address|access-control)"
