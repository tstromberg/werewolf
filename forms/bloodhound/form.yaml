# bloodhound: prod, with BloodHound CE behind Caddy, Neo4j 4.4 on
# loopback Bolt, and PostgreSQL on loopback. Neo4j's HTTP is off. Its
# password and the administrator's come from the config; Neo4j's is set
# once, before the first start, and the administrator's is applied at
# every start. Cypher mutations are off and the complexity limit stays
# on. BloodHound's image calls procedures Neo4j 5 removed, so Neo4j is
# this form's package, on Java 11. See forms/bloodhound/README.md.
base: prod

with: [postgresql, caddy]

packages:
  - neo4j-4.4
  # pg_trgm, which BloodHound's first migration creates. The postgresql
  # form ships the server alone.
  - postgresql-contrib~18
  # Java 11. Neo4j 4.4 is the form's own package
  # (../packages/databases/bloodhound/neo4j.yaml), not a Wolfi package.
  - openjdk-11-default-jvm

# Taken back of werewolf's defaults (lib/allow.zig): the JVM compiles
# Neo4j to machine code as it runs.
allow: [jit]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: java runs Neo4j, which is what holds the graph
  kernel-write-xor-execute: the JVM compiles Neo4j to machine code as it runs (allow jit)

# make check's (forms/README.md): Neo4j, PostgreSQL and BloodHound together.
check:
  memory: 6144

services:
  # Neo4j, as its own user, Bolt on loopback and no HTTP. neo4j-setup sets
  # the initial password from the config once. A missing password parks it.
  neo4j:
    exec: /usr/lib/werewolf/neo4j-boot
    before: /usr/lib/werewolf/neo4j-setup
    user: neo4j
    pledge: stdio rpath wpath inet unix netlink listen proc exec
    listen: tcp/7687 loopback
    # Neo4j starts its server as a child process. That spawn runs the
    # JDK's helper, which is not the java binary itself.
    run: /usr/bin/java /usr/lib/jvm/java-11-openjdk/lib/jspawnhelper /usr/lib/jna/aarch64/libjnidispatch.so /usr/lib/jna/x86_64/libjnidispatch.so
    # Bolt threads read the data disk's rotational flag. The /sys/block
    # entry is a symlink, and the target is what has to be readable:
    # each refusal is audited until the kernel log wraps.
    read: /var/lib/neo4j /sys/block /sys/devices/virtual/block
    config: neo4j-password /run/config/neo4j/neo4j-password
    memory: 2048
    nofile: 65536

  # BloodHound, as _oci-bloodhound, inside its image, on loopback behind
  # Caddy. bloodhound-setup writes its config, including both passwords,
  # before each start. It reaches PostgreSQL and Neo4j on loopback and
  # nothing else. Metrics stay on loopback.
  bloodhound:
    image: docker.io/specterops/bloodhound:latest
    exec: /bloodhound -configfile /data/bloodhound.config.json
    before: /usr/lib/werewolf/bloodhound-setup
    pledge: stdio rpath wpath inet unix netlink connect listen proc
    listen:
      - tcp/8080 loopback
      - tcp/2112 loopback
    connect: [tcp/5432 tcp/7687]
    config:
      - admin-password /run/config/bloodhound/admin-password
      - graph-password /run/config/bloodhound/graph-password
      - settings /run/config/bloodhound/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    # BloodHound's password hash allocates a gibibyte beside the process.
    memory: 3584
    env:
      - HOME=/data

  # PostgreSQL, on loopback, for BloodHound's application database. The
  # role bloodhound is the only TCP login, and only BloodHound may connect.
  postgres:
    exec: /usr/bin/postgres -D /data/svc/postgres/data -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/svc/postgres -c
      hba_file=/usr/share/werewolf-bloodhound/pg_hba.conf
    before: /usr/lib/werewolf/pg-init
    user: postgres
    pledge: stdio rpath wpath inet proc shm unix listen connect
    listen: [tcp/5432 loopback]
    run:
      - /usr/bin/initdb
      - /usr/lib/werewolf/sh-shim
      - /usr/bin/locale
    read: /run/werewolf/import
    share: shared

  # Caddy, as its own user, for BloodHound's UI and API.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/8080]
    lookup: "*"
    read: /etc/caddy
    config: settings /run/config/caddy/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB
