# Neo4j for the bloodhound form. Bolt on loopback, no HTTP, auth on, and
# nothing sent home. The password is set by neo4j-setup, from the config,
# before the first start. The data is on /data.
server.bolt.enabled=true
server.bolt.listen_address=127.0.0.1:7687
server.http.enabled=false
server.https.enabled=false
dbms.security.auth_enabled=true
dbms.usage_report.enabled=false
server.directories.data=/data/svc/neo4j/data
server.directories.logs=/data/svc/neo4j/logs
server.directories.transaction.logs.root=/data/svc/neo4j/transactions
server.directories.import=/data/svc/neo4j/import
# JNA's library is on the root. neo4j-setup links this arch's copy into
# /run/svc/neo4j. A temporary directory is noexec, so it cannot be unpacked.
server.jvm.additional=-Djna.nosys=true
server.jvm.additional=-Djna.boot.library.path=/run/svc/neo4j
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1g
server.memory.pagecache.size=256m
