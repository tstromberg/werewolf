# Neo4j 4.4 for the bloodhound form. Bolt on loopback, no HTTP, auth
# on, and nothing sent home. The password is set by neo4j-setup, from
# the config, before the first start. The data is on /data. The pid
# file is under /run: /var/lib/neo4j is on the read-only root.
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=127.0.0.1:7687
dbms.connector.http.enabled=false
dbms.connector.https.enabled=false
dbms.security.auth_enabled=true
dbms.usage_report.enabled=false
dbms.directories.data=/data/svc/neo4j/data
dbms.directories.logs=/data/svc/neo4j/logs
dbms.directories.transaction.logs.root=/data/svc/neo4j/transactions
dbms.directories.import=/data/svc/neo4j/import
dbms.directories.run=/run/svc/neo4j
dbms.memory.heap.initial_size=512m
dbms.memory.heap.max_size=1g
dbms.memory.pagecache.size=256m
