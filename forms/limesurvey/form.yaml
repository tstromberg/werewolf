# limesurvey: php, with LimeSurvey, surveys and research data collection,
# its tables in MariaDB beside it (with), which its role php, php-fpm's
# system user, reaches by MariaDB's socket with no password (unix_socket).
# Wolfi does not ship LimeSurvey: melange lays the project's release,
# pinned by sha256, in /usr/share/limesurvey, read-only, with its tmp/ and
# upload/ links to /data (forms/limesurvey/melange/limesurvey.yaml). The
# form brings its config.php, which turns the web installer off, and the
# installer that sets the site up from the machine's settings before
# php-fpm serves it (usr/share/werewolf-limesurvey/install.php). Plugins
# come with the image alone. TLS is in front of it: a caddy machine or the
# cloud's load balancer. See forms/limesurvey/README.md.
base: php

with: [mariadb]

packages:
  - php-8.4               # the php command, for the installer
  - php-8.4-pdo
  - php-8.4-pdo_mysql     # the database
  - php-8.4-mysqlnd
  - php-8.4-mbstring
  - php-8.4-gd            # charts, captchas, image questions
  - php-8.4-zip           # survey and theme archives
  - php-8.4-sodium        # encrypted answers and participant fields
  - php-8.4-ldap          # sign-in against the institution's directory
  - php-8.4-dom
  - php-8.4-xml
  - php-8.4-simplexml
  - php-8.4-xmlreader
  - php-8.4-xmlwriter
  - php-8.4-fileinfo      # uploads' types
  - php-8.4-iconv
  - php-8.4-ctype
  - php-8.4-openssl
  - php-8.4-intl
  - php-8.4-opcache

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: php-fpm runs LimeSurvey
  kernel-write-xor-execute: PCRE2 compiles PHP's patterns to machine code (allow jit, from php)

check:
  memory: 2048

services:
  # nginx, as its own user: it may bind :80 and no other port, read its
  # configuration, the image, and LimeSurvey's published assets and
  # uploads on /data, connect to php-fpm's socket, and run only itself.
  nginx:
    exec: /usr/bin/nginx -e stderr
    before: /usr/bin/nginx -e stderr -t -q
    user: nginx
    group: php
    pledge: stdio rpath wpath proc unix inet listen connect aio sendfile
    listen: [tcp/80]
    read: /etc/nginx /data/svc/php-fpm/tmp/assets /data/svc/php-fpm/upload
    connect: [/run/svc/php-fpm/php.sock]

  # php-fpm running LimeSurvey, as the php user: it reads its
  # configuration and the image, writes only its own directories (assets,
  # cache and uploads in /data/svc/php-fpm), and reaches MariaDB's socket,
  # the mail relay's submission port and a directory's LDAPS port, and
  # nothing else. Before it serves, install.php sets the site up from the
  # settings, so no first visitor claims it; a missing admin password hash
  # parks the service.
  # The opcode cache is set up as php-fpm starts, before any pool's values
  # apply, so its settings go on the line: its lock file in php's own
  # directory (not /tmp, which the leash does not grant), and no looking
  # for changed files, since the image cannot change.
  php-fpm:
    exec: /usr/bin/php-fpm --nodaemonize --force-stderr --fpm-config /etc/php/php-fpm.conf -d opcache.lockfile_path=/run/svc/php-fpm -d opcache.validate_timestamps=0 -d opcache.memory_consumption=192 -d opcache.interned_strings_buffer=16 -d opcache.max_accelerated_files=20000
    before:
      - /usr/bin/php -d memory_limit=512M /usr/share/werewolf-limesurvey/install.php
      - /usr/bin/php-fpm --test --fpm-config /etc/php/php-fpm.conf -d opcache.lockfile_path=/run/svc/php-fpm
    user: php
    pledge: stdio rpath wpath proc unix inet connect listen
    connect: [tcp/587 tcp/636 udp/53 tcp/53, /run/svc/mariadb/mariadb.sock]
    memory: 768
    read: /etc/php
    # nginx reaches its socket, /run/svc/php-fpm/php.sock, mode 0660 for
    # nginx's group, and serves the assets and uploads.
    share: shared
    env: [TMPDIR=/run/svc/php-fpm]
    # The admin's bcrypt password hash: required, since a LimeSurvey
    # without an admin belongs to whoever finds it first. The relay's
    # password only if the machine brings one: mail is otherwise off.
    config:
      - admin-password-hash /run/config/limesurvey/admin-password-hash
      - smtp-password /run/config/limesurvey/smtp-password optional
      - settings /run/config/limesurvey/settings.json
    # The site: its address, name and admin; its mail relay.
    setting:
      - url url required
      - title string
      - admin-user string
      - admin-name string
      - admin-email string required
      - smtp hostport
      - smtp-user string
      - mail-from string
    render: json site.json
