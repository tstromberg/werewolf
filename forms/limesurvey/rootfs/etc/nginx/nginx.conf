# nginx for the limesurvey form: LimeSurvey in /usr/share/limesurvey, from
# the image, its front controller and the HTML editor's file browser run
# by php-fpm over its UNIX socket, and no other .php file. Its tmp/ and
# upload/ are links to php-fpm's directory on /data, of which nginx serves
# the published assets and the uploads alone. leash starts nginx
# (etc/sv/nginx/service) as the nginx user, able to bind :80 and nothing
# else. TLS is in front of it: a caddy machine or the cloud's load
# balancer.

daemon off;                         # runsv supervises it
worker_processes auto;
error_log stderr warn;              # the console, like every service
pid /run/svc/nginx/nginx.pid;       # its own directory, from leash

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path       /run/svc/nginx/proxy;
    fastcgi_temp_path     /run/svc/nginx/fastcgi;
    uwsgi_temp_path       /run/svc/nginx/uwsgi;
    scgi_temp_path        /run/svc/nginx/scgi;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 64m;       # php-fpm.conf's upload limit

    # Logins are guessed at all day: ten a minute from one address, a few
    # more in a burst, then 503. LimeSurvey locks an account out besides.
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

    # Behind the TLS in front (caddy, the cloud's load balancer), which
    # says so in X-Forwarded-Proto. A client that reaches :80 directly can
    # only claim the same, which gains it nothing.
    map $http_x_forwarded_proto $forwarded_https {
        https on;
        default "";
    }

    server {
        listen 80 default_server;
        root /usr/share/limesurvey;
        index index.php;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        # What LimeSurvey's own .htaccess files refuse: dotfiles, its code
        # and libraries, translations, the web installer (off besides, as
        # config.php exists), and the cache. The grid's two scripts in
        # application/extensions are the exception they make.
        location ~ /\. {
            return 404;
        }
        location ~ ^/application/extensions/.+/assets/[^/]+\.(js|css)$ {
            try_files $uri =404;
        }
        location ~ ^/(application|vendor|docs|installer|locale|modules)/ {
            return 404;
        }
        location ~ ^/index\.php/installer {
            return 404;
        }

        # tmp/ holds the published assets, served, and the cache and
        # participants' files in flight, never.
        location ^~ /tmp/ {
            location ^~ /tmp/assets/ {
                location ~ \.php$ {
                    return 404;
                }
                try_files $uri =404;
            }
            return 404;
        }

        # Uploads are data, never code: no .php under them, an SVG, HTML or
        # XML someone uploaded is sandboxed so a script in it runs for no
        # one, and the files participants upload with their answers
        # (surveys/ID/files, fu_ names) are LimeSurvey's to hand out, to
        # those allowed them.
        location ^~ /upload/ {
            location ~ ^/upload/surveys/[^/]+/files/ {
                return 404;
            }
            location ~ /fu_[a-z0-9_]*$ {
                return 404;
            }
            location ~ \.php$ {
                return 404;
            }
            location ~* \.(svgz?|html?|xml)$ {
                add_header X-Content-Type-Options nosniff always;
                add_header Content-Security-Policy sandbox always;
            }
            try_files $uri =404;
        }

        location ~ ^/index\.php/admin/authentication {
            limit_req zone=login burst=5 nodelay;
            fastcgi_split_path_info ^(/index\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
        location ~ ^/index\.php(/|$) {
            fastcgi_split_path_info ^(/index\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
        # The HTML editor's file browser, KCFinder, which LimeSurvey turns
        # on for a signed-in admin's session alone.
        location ~ ^/assets/packages/kcfinder/((browse|upload|js_localize|index)|(css|js)/index)\.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
        location ~ \.php$ {
            return 404;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }
    }
}
