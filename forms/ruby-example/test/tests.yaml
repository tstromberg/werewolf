version: 1
suites:
  - name: ruby-ready
    readiness: true
    cases:
      - name: ruby-ready
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/'
            expect:
              status: 200
              body: "Hello from Ruby on werewolf!\n"
            await: 60s
  # The contract every runtime's hello-world answers (test/scenarios/app-*).
  - name: ruby
    cases:
      - name: ruby-greeting
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/'
            expect:
              status: 200
              body: "Hello from Ruby on werewolf!\n"
      - name: ruby-health
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/health?probe=integration'
            expect:
              status: 200
              body: "ok\n"
      - name: ruby-not-found
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/werewolf-missing'
            expect:
              status: 404
      # A body it never wanted is read, so closing does not reset the reply.
      - name: ruby-method-refused
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/'
              method: POST
              body: changed
              headers:
                Content-Type: application/x-www-form-urlencoded
            expect:
              status: 405
              headers:
                allow: GET
      - name: ruby-content-type
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/'
            expect:
              status: 200
              headers:
                content-type:
                  matches: ^[Tt][Ee][Xx][Tt]/[Pp][Ll][Aa][Ii][Nn]; [Cc][Hh][Aa][Rr][Ss][Ee][Tt]=[Uu][Tt][Ff]-8$
      # Each connection is its own thread, closed after one reply.
      - name: ruby-reconnect
        steps:
          - fetch:
              url: 'http://127.0.0.1:8080/health'
            expect:
              body: "ok\n"
          - fetch:
              url: 'http://127.0.0.1:8080/health'
            expect:
              body: "ok\n"
          - fetch:
              url: 'http://127.0.0.1:8080/health'
            expect:
              body: "ok\n"
  # It speaks HTTP itself: raw HTTP/1.0, and a request split by a pause, get
  # one framed reply and then the end of the stream.
  - name: ruby-wire
    cases:
      - name: ruby-framing
        steps:
          - tcp:
              connect: 127.0.0.1:8080
              exchange:
                - send: "GET / HTTP/1.0\r\n\r\n"
                - expect:
                    matches: "^HTTP/1\\.1 200 OK\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: 29\r\nConnection: close\r\n\r\nHello from Ruby on werewolf!\n$"
                - close: eof
      - name: ruby-fragmented
        steps:
          - tcp:
              connect: 127.0.0.1:8080
              exchange:
                - send: "GET / HTTP/1.1\r\nHost: localhost\r\n"
                - pause: 1s
                - send: "\r\n"
                - expect:
                    matches: "^HTTP/1\\.1 200 OK\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: 29\r\nConnection: close\r\n\r\nHello from Ruby on werewolf!\n$"
                - close: eof
