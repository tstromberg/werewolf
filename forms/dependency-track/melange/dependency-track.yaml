# Version 5 distributes the API and frontend separately. Serve the frontend
# through the API's /static classpath resource, with all code and assets on
# the read-only image. Start with java @/usr/share/java/dependency-track/java.args.
# PostgreSQL is configured with DT_DATASOURCE_URL, USERNAME and PASSWORD.
package:
  name: dependency-track
  version: 5.2.1
  epoch: 0
  description: OWASP Dependency-Track API and frontend on hardened OpenJDK 27
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-27-jre>=27.0.0-r2002
vars:
  frontend-version: 5.2.1
environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/DependencyTrack/dependency-track/releases/download/${{package.version}}/dependency-track-apiserver-dist.tar.gz
      expected-sha256: a39242248034f4e372fcb11092b69752070cd342a57bd00ef2936fe8b76f8ff9
      strip-components: 0
  - uses: fetch
    with:
      uri: https://github.com/DependencyTrack/frontend/releases/download/${{vars.frontend-version}}/frontend-dist.zip
      expected-sha256: d9f1a919cc55f32f61d48efafb16ec841bb04aa465946324362dd28165b06163
      extract: false
  - runs: |
      dest=${{targets.destdir}}/usr/share/java/dependency-track
      mkdir -p "$dest/webapp/static"
      cp -a dependency-track-apiserver.jar lib "$dest/"
      unzip -q frontend-dist.zip
      cp -a dist/. "$dest/webapp/static/"
      # Preserve the API server's published SBOM alongside the frontend.
      unzip -q -d "$dest/webapp" dependency-track-apiserver.jar 'static/.well-known/*'
      # zstd-jni, which compresses stored files, would otherwise unpack its
      # JNI library into the writable temporary directory at every start.
      case ${{build.arch}} in
        aarch64) jni=aarch64 ;;
        x86_64) jni=amd64 ;;
        *) echo "zstd-jni: no library for ${{build.arch}}" >&2; exit 1 ;;
      esac
      jar=$(echo lib/zstd-jni-*.jar)
      version=${jar#lib/zstd-jni-}
      version=${version%.jar}
      mkdir -p ${{targets.destdir}}/usr/lib/dependency-track
      unzip -p "$jar" "linux/$jni/libzstd-jni-$version.so" >${{targets.destdir}}/usr/lib/dependency-track/libzstd-jni.so
      cat >"$dest/java.args" <<'EOF'
      -DZstdNativePath=/usr/lib/dependency-track/libzstd-jni.so
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      -cp
      /usr/share/java/dependency-track/webapp:/usr/share/java/dependency-track/dependency-track-apiserver.jar:/usr/share/java/dependency-track/lib/*
      org.dependencytrack.Application
      EOF
test:
  environment:
    contents:
      packages:
        - openjdk-27-default-jvm
  pipeline:
    - name: API entrypoint and bundled frontend load from the image
      runs: |
        set -eu
        root=/usr/share/java/dependency-track
        java --dry-run @"$root/java.args"
        test -s "$root/webapp/static/index.html"
        test -s "$root/webapp/static/static/config.json"
        test -s "$root/webapp/static/.well-known/sbom"
        test "$(head -c 4 /usr/lib/dependency-track/libzstd-jni.so | tail -c 3)" = ELF
        test "$(ls "$root"/lib/*.jar | wc -l)" -gt 100
