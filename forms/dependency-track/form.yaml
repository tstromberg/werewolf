# dependency-track: jre, with Dependency-Track 5's API server and frontend behind
# Caddy, and PostgreSQL on loopback. The first start replaces the
# published admin/admin password with the config's, before Caddy opens.
# The API listens on loopback. Java runs it. See
# forms/dependency-track/README.md.
base: jre

with: [postgresql, caddy]

# LOCAL-PACKAGE-REVERT: use the published package once its version 5 build is available.
# Until then, melange/dependency-track.yaml supplies the complete local recipe.

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: java runs Dependency-Track, which is what this form is for
  kernel-write-xor-execute: the JVM compiles Dependency-Track to machine code as it runs (allow jit, from jre)

# make check's (forms/README.md): the JVM's heap beside PostgreSQL.
check:
  memory: 3072

services:
  # Dependency-Track, as its own user, on loopback. It reaches PostgreSQL
  # and nothing else. dtrack-setup, before Caddy opens, replaces
  # admin/admin. A missing password parks Caddy, so this never faces the
  # network with the published password.
  dtrack:
    # DataNucleus keeps some columns, such as a license's seeAlso list, as
    # Java-serialized String arrays in PostgreSQL, and reads them back at the
    # next start. The filter admits strings and nothing else.
    # Stored files use the package's zstd JNI library from the read-only image.
    allow: [java:deserialize, java:native]
    # The API server, from the package's argument file. -host and -port are
    # its own flags; the default address is every one. Its management
    # server (health and metrics, :9000) is on loopback too.
    exec: /usr/bin/java -Xms256m -Xmx768m --enable-native-access=ALL-UNNAMED -Djdk.serialFilter=java.lang.String;!* -Djava.io.tmpdir=/run/svc/dtrack -Duser.home=/data/svc/dtrack
      @/usr/share/java/dependency-track/java.args -host 127.0.0.1 -port 8080
    user: dtrack
    # netlink: the JVM lists the host's addresses.
    pledge: stdio rpath wpath inet unix netlink connect listen proc
    listen: [tcp/8080 loopback, tcp/9000 loopback]
    connect: [tcp/5432]
    memory: 1280
    nofile: 16384
    env:
      - DT_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/postgres
      - DT_DATASOURCE_USERNAME=dtrack
      - DT_DATASOURCE_PASSWORD=dtrack
      - DT_MANAGEMENT_HOST=127.0.0.1

  # PostgreSQL, as postgresql's form runs it, but also on loopback TCP:
  # pg_hba.conf lets the role dtrack alone in that way, to the postgres
  # database, and only services whose leash lets them connect to :5432
  # reach it at all.
  postgres:
    exec: /usr/bin/postgres -D /data/svc/postgres/data -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/svc/postgres -c
      hba_file=/usr/share/werewolf-dtrack/pg_hba.conf
    before: /usr/lib/werewolf/pg-init
    user: postgres
    pledge: stdio rpath wpath inet proc shm unix listen connect
    listen: [tcp/5432 loopback]
    run:
      - /usr/bin/initdb
      - /usr/lib/werewolf/sh-shim
      - /usr/bin/locale
    read: /run/werewolf/import
    share: shared

  # Caddy, as its own user. Before it opens, dtrack-setup replaces the
  # published administrator password. The domain is the site.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before:
      - /usr/lib/werewolf/dtrack-setup
      - /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/8080]
    lookup: "*"
    read: /etc/caddy
    config:
      - admin-password /run/config/caddy/admin-password
      - settings /run/config/caddy/settings.json
    setting: domain hostname required as DOMAIN
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB
