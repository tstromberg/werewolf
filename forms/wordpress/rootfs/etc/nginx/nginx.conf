# nginx for the wordpress form: WordPress in /usr/src/wordpress, from the
# image, with its .php files run by php-fpm over its UNIX socket. leash
# starts nginx (etc/sv/nginx/service) as the nginx user, able to bind :80
# and nothing else. TLS is in front of it: a caddy machine or the cloud's
# load balancer. A form on this one lays its own file here.

daemon off;                         # runsv supervises it
worker_processes auto;
error_log stderr warn;              # the console, like every service
pid /run/svc/nginx/nginx.pid;       # its own directory, from leash

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path       /run/svc/nginx/proxy;
    fastcgi_temp_path     /run/svc/nginx/fastcgi;
    uwsgi_temp_path       /run/svc/nginx/uwsgi;
    scgi_temp_path        /run/svc/nginx/scgi;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 64m;       # php-fpm.conf's upload limit

    # Logins and XML-RPC are guessed at all day: ten a minute from one
    # address, a few more in a burst, then 503.
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

    # Behind the TLS in front (caddy, the cloud's load balancer), which
    # says so in X-Forwarded-Proto: WordPress then knows it is on HTTPS
    # (FORCE_SSL_ADMIN, secure cookies). A client that reaches :80
    # directly can only claim the same, which gains it nothing.
    map $http_x_forwarded_proto $forwarded_https {
        https on;
        default "";
    }

    server {
        listen 80 default_server;
        root /usr/src/wordpress;
        index index.php;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # The installer, the configuration and what describes the version:
        # never served. The site is installed before it answers
        # (usr/share/werewolf-wordpress/install.php).
        location ~ ^/(wp-admin/(install|setup-config)\.php|wp-config(-sample|-docker)?\.php|readme\.html|license\.txt)$ {
            return 404;
        }
        # No dotfiles: Wolfi's package carries the site's .git.
        location ~ /\. {
            return 404;
        }

        # Uploads are data, never code: no .php under them, and an SVG,
        # HTML or XML someone uploaded is sandboxed so a script in it runs
        # for no one. Images and PDFs are served as they are.
        location ^~ /wp-content/uploads/ {
            location ~ \.php$ {
                return 404;
            }
            location ~* \.(svgz?|html?|xml)$ {
                add_header X-Content-Type-Options nosniff always;
                add_header Referrer-Policy strict-origin-when-cross-origin always;
                add_header Content-Security-Policy sandbox always;
            }
        }

        location = /wp-login.php {
            limit_req zone=login burst=5 nodelay;
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
        # XML-RPC stays, for the mobile apps and Jetpack, with pingbacks
        # off (wp-content/mu-plugins/werewolf.php), and rate limited.
        location = /xmlrpc.php {
            limit_req zone=login burst=5 nodelay;
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }
        # Only a .php file that is there: never a path that merely ends in
        # .php, which would hand php-fpm a file of another kind.
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass unix:/run/svc/php-fpm/php.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
        }
    }
}
