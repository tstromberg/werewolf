# nginx for the overleaf form's clsi service: it serves the PDFs and logs
# clsi makes, on loopback alone, to Caddy and Overleaf's web, as the
# image's clsi-nginx.conf does (keep the two in step). It runs as
# _oci-clsi, never root, so it has no user to switch to, and keeps its
# temporary files in the service's own directory.
daemon off;
worker_processes 2;
pid /run/nginx.pid;
error_log stderr warn;

events {
	worker_connections 768;
}

http {
	include /etc/nginx/mime.types;
	sendfile on;
	server_tokens off;
	access_log off;
	client_body_temp_path /var/lib/overleaf/tmp/nginx/body;
	proxy_temp_path /var/lib/overleaf/tmp/nginx/proxy;
	fastcgi_temp_path /var/lib/overleaf/tmp/nginx/fastcgi;
	uwsgi_temp_path /var/lib/overleaf/tmp/nginx/uwsgi;
	scgi_temp_path /var/lib/overleaf/tmp/nginx/scgi;

	server {
		listen 127.0.0.1:8080;
		server_name clsi-nginx;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Download-Options noopen always;
		add_header X-Frame-Options SAMEORIGIN always;
		# A project may hold links: never follow one.
		disable_symlinks on;
		gzip on;
		gzip_types text/plain;
		gzip_proxied any;
		types {
			text/plain log blg aux stdout stderr;
			application/pdf pdf;
		}
		# A user's output files.
		location ~ ^/project/([0-9a-f]+)/user/([0-9a-f]+)/build/([0-9a-f-]+)/output/(.+)$ {
			rewrite ^/project/([0-9a-f]+)/user/([0-9a-f]+)/build/([0-9a-f-]+)/output/(.+)$ /$4 break;
			root /var/lib/overleaf/data/output/$1-$2/generated-files/$3/;
		}
		# A project's, compiled for anyone with its link.
		location ~ ^/project/([0-9a-f]+)/build/([0-9a-f-]+)/output/(.+)$ {
			rewrite ^/project/([0-9a-f]+)/build/([0-9a-f-]+)/output/(.+)$ /$3 break;
			root /var/lib/overleaf/data/output/$1/generated-files/$2/;
		}
		# Ranges of a PDF, for its viewer, a user's and a project's.
		location ~ ^/project/([0-9a-f]+)/user/([0-9a-f]+)/content/([0-9a-f-]+/[0-9a-f]+)$ {
			expires 1d;
			alias /var/lib/overleaf/data/output/$1-$2/content/$3;
		}
		location ~ ^/project/([0-9a-f]+)/content/([0-9a-f-]+/[0-9a-f]+)$ {
			expires 1d;
			alias /var/lib/overleaf/data/output/$1/content/$2;
		}
		location / {
			return 404;
		}
	}
}
