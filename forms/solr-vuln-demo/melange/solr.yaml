package:
  name: solr
  version: 8.11.0
  epoch: 0
  description: Deliberately vulnerable Solr, on hardened OpenJDK 27
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-27-jre>=27.0.0-r2002

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27

pipeline:
  - uses: fetch
    with:
      uri: https://archive.apache.org/dist/lucene/solr/${{package.version}}/solr-${{package.version}}.tgz
      expected-sha256: ba69bffc624e5c1e35b3b2e0929d82f2ba7871d7ba5941f202c2b97945eb730c
      strip-components: 1

  - runs: |
      dest=${{targets.destdir}}/usr/lib/solr
      mkdir -p "$dest"
      cp -a server licenses LICENSE.txt NOTICE.txt "$dest/"
      CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$dest/setup" setup.go
      install -m644 log4j2.xml "$dest/log4j2.xml"

# Deliberate pin: automatic dependency updates must not silently remove the target.
update:
  enabled: false
