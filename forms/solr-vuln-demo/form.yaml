# The real Log4Shell-era application on the same hardened JVM as current Solr.
base: jre

updates: off

weaknesses:
  updates-enabled: this deliberately vulnerable demonstration is pinned to Solr 8.11.0
  programs-no-interpreters: hardened OpenJDK 27 runs deliberately vulnerable Solr
  kernel-write-xor-execute: the JVM compiles Solr as it runs

check:
  memory: 2048
  web: 8983

services:
  solr:
    exec: /usr/bin/java -XX:-UsePerfData -XX:+ExitOnOutOfMemoryError -Xms256m -Xmx768m
      -Djava.io.tmpdir=/run/svc/solr -Djetty.home=/usr/lib/solr/server -Djetty.base=/usr/lib/solr/server
      -Dsolr.install.dir=/usr/lib/solr -Dsolr.solr.home=/data/svc/solr/home -Dsolr.log.dir=/run/svc/solr
      -Dlog4j.configurationFile=/usr/lib/solr/log4j2.xml -Djetty.host=0.0.0.0 -Djetty.port=8983
      -Dsolr.directoryFactory=solr.NIOFSDirectoryFactory -Dsolr.jetty.threads.max=128 -jar /usr/lib/solr/server/start.jar --module=http
    before: /usr/lib/solr/setup
    user: solr
    pledge: stdio rpath wpath inet unix netlink listen proc exec
    run: [/usr/bin/id, /usr/bin/uname, /usr/bin/cat]
    listen: tcp/8983
    memory: 1536
    nofile: 8192
    env: [HOME=/data/svc/solr, LANG=C.UTF-8]

packages:
  - solr-vuln-demo
  - coreutils
