# ruby-app: ruby, starting an application of yours from /usr/lib/app
# (form.yaml's app) as `ruby main.rb`, on :8080 (etc/sv/app/service), its
# gems vendored into it (bundle install --deployment, at build). It ships
# none: the service stays down, saying why, until howl's --app or a form on
# this one lays main.rb there, as ruby-example does. See docs/forms.md.
base: ruby

# make check's, for this form alone (forms/README.md): it ships no
# application, so its service stays down: nothing listens on 8080, and
# nothing is in its cgroup to count or reap.
check:
  skip: [answering, http-answering, cgrouped, reaped]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: ruby runs the application laid in /usr/lib/app

services:
  # The application, as its own user: it may bind :8080 and no other port,
  # read the image, and run only ruby. Gems come with the image; nothing is
  # installed at runtime, and the image is read-only, so Bundler is frozen.
  # Down until main.rb is there: this form ships none.
  app:
    exec: /usr/bin/ruby /usr/lib/app/main.rb
    user: app
    requires: /usr/lib/app/main.rb
    pledge: stdio rpath proc inet listen
    memory: 512
    listen: [tcp/8080]
    env: [BUNDLE_FROZEN=true, BUNDLE_DEPLOYMENT=true, HOME=/run/svc/app]
