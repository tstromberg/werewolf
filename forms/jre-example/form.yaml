base: jre

# The example serves on 8080.
net:
  - listen tcp/8080

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: java runs the example
  kernel-write-xor-execute: the JVM compiles the example to machine code as it runs (allow jit, from jre)
