# jre: prod, running a Java application. leash starts it
# (etc/sv/app/service) as the app user, able to bind :8080 and nothing
# else, reading the image and writing only /run/svc/app and /data/svc/app.
# The application is /usr/lib/app, verified and read-only with the rest of
# the root: a form of your own includes this one, lays its jar there, and
# its own etc/sv/app/service (exec /usr/bin/java -jar /usr/lib/app/app.jar).
# Until then, the JDK's own simple web server, serving one page. See
# docs/forms.md.
include: prod.yaml
contents:
  packages:
    - openjdk-21-jre

accounts:
  groups:
    - groupname: app
      gid: 204
  users:
    - username: app
      uid: 204
      gid: 204
      homedir: /var/empty
      shell: /sbin/nologin
