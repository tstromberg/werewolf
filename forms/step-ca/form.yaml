# step-ca: prod, with step-ca as an internal certificate authority, named
# for what runs, as postgresql is. The intermediate's key and certificate,
# the root's certificate and the intermediate key's password come from
# the config; the root's key never comes to the machine. One provisioner,
# ACME, bound by an x509 policy to the names the config allows (--domains);
# remote administration is off, so ca.json in the image is the only way
# to change provisioners, and a form of your own adds a JWK one for its
# operators. Its database (badger) is in /data/svc/step-ca. leash starts
# it (etc/sv/step-ca/service) as the step user, on :443. See
# forms/step-ca/README.md.
base: prod

packages:
  - step-ca

services:
  # step-ca, as its own user: it may bind :443 and no other port, reach a
  # requester's :80 for ACME's http-01 and a resolver to find it, read its
  # configuration and the image, and write only its own directories. The
  # CA's names and the names ACME may issue for come from the machine's
  # settings, into the image's ca.json.
  step-ca:
    exec: /usr/bin/step-ca --password-file /run/svc/step-ca/password /run/svc/step-ca/ca.json
    user: step
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/443]
    connect: [tcp/80 tcp/53 udp/53]
    read: /etc/step-ca
    # The root's certificate, the intermediate's certificate and key, and the
    # key's password, from the machine's config: missing, the service parks
    # with a line naming the file.
    config:
      - root-cert /run/config/step-ca/root.crt
      - intermediate-cert /run/config/step-ca/intermediate.crt
      - intermediate-key /run/config/step-ca/intermediate.key
      - password /run/config/step-ca/password
      - settings /run/config/step-ca/settings.json
    setting:
      - names hostname... required as dnsNames
      - domains hostname... required as authority.policy.x509.allow.dns
    render: json ca.json from /etc/step-ca/ca.json
    memory: 512
    nofile: 65536
    env:
      - HOME=/run/svc/step-ca
      - STEPPATH=/run/svc/step-ca
      - GOMEMLIMIT=384MiB
