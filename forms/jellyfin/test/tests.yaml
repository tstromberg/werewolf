version: 1
suites:
  - name: jellyfin
    cases:
      - name: jf-set-up
        steps:
          - file: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              type: file
            await: 60s
          - fetch:
              url: https://localhost/System/Info/Public
              ca: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              status: 200
              json:
                /StartupWizardCompleted: true
            await: 240s
      - name: jf-admin
        steps:
          - fetch:
              url: https://localhost/Users/AuthenticateByName
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: POST
              json:
                Username: admin
                Pw: werewolf-check-pass-1
              headers:
                Authorization: MediaBrowser Client="check", Device="check", DeviceId="check",
                  Version="1"
            expect:
              status: 200
              json:
                /AccessToken:
                  matches: .+
                /User/Name: admin
                /User/Policy/IsAdministrator: true
            name: login
      - name: jf-wizard-shut
        steps:
          - fetch:
              url: https://localhost/Startup/User
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: POST
              json:
                Name: x
                Password: y
            expect:
              status:
                one_of:
                  - 401
                  - 403
      - name: jf-alone
        steps:
          - service: jellyfin
            expect:
              user: jellyfin
              connect_rules: []
          - file: /data/svc/jellyfin/config/network.xml
            expect:
              body:
                contains: <string>127.0.0.1</string>
          - file: /etc/sv/jellyfin/narrow/ffmpeg
            expect:
              exists: true
          - file: /run/svc/caddy/jellyfin-password
            expect:
              exists: false
  - name: jellyfin-library
    source: driver.zig
    mode: library
    user: root
    fixtures:
      password: /run/config/caddy/jellyfin-password
    policy:
      pledge: stdio rpath inet unix connect
      read:
        - /
      connect:
        - tcp/443
      run: []
    cases:
      seed:
        - jf-library
      verify:
        - jf-library
host:
  # From the host, as an operator, with the run's keys (docs/testing-host.md):
  # root logs in with its security key and runs commands; the session
  # forwards nothing; a key file is refused, sshd taking security keys
  # alone. That one failed login is last: sshd holds it against its source.
  - name: jellyfin-ssh
    cases:
      - name: ssh-login
        steps:
          - ssh:
              user: root
              key: security
              command: echo $USER_ID
            await: 60s
            expect:
              status: 0
              stdout:
                matches: "(^|\n)0\n?$"
      - name: ssh-command-output
        steps:
          - ssh:
              user: root
              key: security
              command: echo werewolf-ssh-command
            expect:
              status: 0
              stdout:
                matches: "(^|\n)werewolf-ssh-command\n?$"
      - name: ssh-command-status
        steps:
          - ssh:
              user: root
              key: security
              command: exit 23
            expect:
              status: 23
      - name: ssh-no-forwarding
        steps:
          - ssh:
              user: root
              key: security
              remote_forward: true
            expect:
              status:
                not_equals: 0
              stderr:
                contains: forwarding failed
      - name: ssh-security-keys-only
        steps:
          - ssh:
              user: root
              key: file
              command: echo werewolf-ssh-file-key
            expect:
              status:
                not_equals: 0
              stderr:
                contains: Permission denied (publickey)
