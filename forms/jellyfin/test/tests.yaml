version: 1
# Keep inherited SSH host attacks until they have a native replacement.
legacy: true
suites:
  - name: jellyfin
    cases:
      - name: jf-set-up
        steps:
          - file: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              type: file
            await: 60s
          - fetch:
              url: https://localhost/System/Info/Public
              ca: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              status: 200
              json:
                /StartupWizardCompleted: true
            await: 240s
      - name: jf-admin
        steps:
          - fetch:
              url: https://localhost/Users/AuthenticateByName
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: POST
              json:
                Username: admin
                Pw: werewolf-check-pass-1
              headers:
                Authorization: MediaBrowser Client="check", Device="check", DeviceId="check",
                  Version="1"
            expect:
              status: 200
              json:
                /AccessToken:
                  matches: .+
                /User/Name: admin
                /User/Policy/IsAdministrator: true
            name: login
      - name: jf-wizard-shut
        steps:
          - fetch:
              url: https://localhost/Startup/User
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: POST
              json:
                Name: x
                Password: y
            expect:
              status:
                one_of:
                  - 401
                  - 403
      - name: jf-alone
        steps:
          - service: jellyfin
            expect:
              user: jellyfin
              connect_rules: []
          - file: /data/svc/jellyfin/config/network.xml
            expect:
              body:
                contains: <string>127.0.0.1</string>
          - file: /etc/sv/jellyfin/narrow/ffmpeg
            expect:
              exists: true
          - file: /run/svc/caddy/jellyfin-password
            expect:
              exists: false
  - name: jellyfin-library
    source: driver.zig
    mode: library
    user: root
    fixtures:
      password: /run/config/caddy/jellyfin-password
    policy:
      pledge: stdio rpath inet unix connect
      read:
        - /
      connect:
        - tcp/443
      run: []
    cases:
      seed:
        - jf-library
      verify:
        - jf-library
