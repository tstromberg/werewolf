# A forwarding-only OpenSSH service, with no login shell.
base: prod

packages:
  - openssh-server
  - coreutils             # /usr/bin/false is the account's login shell
accounts:
  groups:
    - groupname: bastion
      gid: 205
  users:
    - username: bastion
      uid: 205
      gid: 205
      homedir: /var/empty
      shell: /usr/bin/false
paths:
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  network-no-login: sshd, by security key, which forwards to the destinations form.yaml names and opens no session
  network-ssh-config: sshd forwards ports, which is what a bastion is for

services:
  sshd:
    exec: /usr/bin/sshd -D -e -f /etc/ssh/sshd_config
    user: bastion
    pledge: stdio rpath wpath inet unix listen connect proc exec seccomp
    listen: [tcp/22]
    # The build puts its connect line where the form's net lets the bastion
    # connect (lib/form.zig's bastionService); this one is the shipped form's.
    connect: [tcp/22]
    # Its users, their keys and destinations, are the image's, from form.yaml's
    # bastion: (etc/ssh/bastion, written by the build).
    read: /etc/ssh
    run: /usr/lib/ssh/sshd-auth /usr/lib/ssh/sshd-session /usr/bin/ssh-keygen
    # Its host key, made on the first boot and kept in /data; without /data
    # it stays down rather than change identity each boot.
    before: /usr/lib/werewolf/ssh-host-key /data/svc/sshd/host-key
    memory: 256
    nofile: 1024
