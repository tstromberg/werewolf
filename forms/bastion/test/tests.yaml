version: 1
# test/bastion-form adds a normal user and one allowed destination.
suites:
  - name: bastion
    cases:
      - name: bastion-private
        steps:
          - file: /data/svc/sshd/host-key
            await: 60s
            expect:
              type: file
              uid: 0
              mode: '600'
      - name: bastion-user
        steps:
          - file: /etc/passwd
            expect:
              body:
                contains_all:
                  - 'check:x:'
                  - '/data/home/check:/bin/mksh'
      - name: bastion-users
        steps:
          - file: /run/werewolf/keys/check
            expect:
              uid: 0
              mode: '640'
              body:
                contains: sk-ssh-ed25519@openssh.com
      - name: bastion-shared-policy
        steps:
          - file: /etc/ssh/sshd_config.d/form.conf
            expect:
              body:
                contains_all:
                  - AllowTcpForwarding local
                  - PermitOpen 127.0.0.1:22
          - file: /etc/ssh/operator.conf
            expect:
              body:
                contains: AuthorizedKeysCommand /usr/lib/werewolf/ssh-root-keys
host:
  - name: bastion-ssh
    cases:
      - name: bastion-permitted-destination
        steps:
          - ssh:
              user: check
              key: security
              forward: 127.0.0.1:22
            await: 60s
            expect:
              status: 0
              stdout:
                contains: SSH-2.0-OpenSSH
      - name: bastion-host-key-kept
        steps:
          - ssh:
              user: check
              key: security
              forward: 127.0.0.1:22
              same_host_key: true
            expect:
              status: 0
              stdout:
                contains: SSH-2.0-OpenSSH
      - name: bastion-ordinary-login
        steps:
          - ssh:
              user: check
              key: security
              command: echo bastion-login
            expect:
              status: 0
              stdout:
                contains: bastion-login
      - name: bastion-no-remote-root
        steps:
          - ssh:
              user: root
              key: security
              command: echo unauthorized
            expect:
              status:
                not_equals: 0
              stderr:
                contains: Permission denied (publickey)
      - name: bastion-denied-destination
        steps:
          - ssh:
              user: check
              key: security
              forward: 127.0.0.2:22
            expect:
              status:
                not_equals: 0
              stderr:
                contains: administratively prohibited
      - name: bastion-shell-permitted-destination
        steps:
          - ssh:
              user: check
              key: security
              command: ssh -F /dev/null -oBatchMode=yes -oConnectTimeout=3 -oStrictHostKeyChecking=no root@127.0.0.1 true
            expect:
              status:
                not_equals: 0
              stderr:
                contains: Permission denied (publickey)
      - name: bastion-shell-denied-destination
        steps:
          - ssh:
              user: check
              key: security
              command: ssh -F /dev/null -oBatchMode=yes -oConnectTimeout=3 -oStrictHostKeyChecking=no root@127.0.0.2 true
            expect:
              status:
                not_equals: 0
              stderr:
                contains: 'connect to host 127.0.0.2 port 22: Permission denied'
      - name: bastion-no-remote-forwarding
        steps:
          - ssh:
              user: check
              key: security
              remote_forward: true
            expect:
              status:
                not_equals: 0
              stderr:
                contains: forwarding failed
      - name: bastion-pq-required
        steps:
          - ssh:
              user: check
              key: security
              kex: curve25519-sha256
            expect:
              status:
                not_equals: 0
              stderr:
                contains: no matching key exchange method
      - name: bastion-security-keys-only
        steps:
          - ssh:
              user: check
              key: file
              command: echo unauthorized
            expect:
              status:
                not_equals: 0
              stderr:
                contains: Permission denied (publickey)
