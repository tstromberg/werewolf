# A forwarding-only OpenSSH service, with no login shell.
contents:
  packages:
    - openssh-server
    - coreutils             # /usr/bin/false is the account's login shell
accounts:
  groups:
    - groupname: bastion
      gid: 205
  users:
    - username: bastion
      uid: 205
      gid: 205
      homedir: /var/empty
      shell: /usr/bin/false
paths:
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755
