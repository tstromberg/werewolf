# Valkey for the immich form: valkey's own file, with loopback TCP for
# Immich's job queue, as Immich's image cannot reach the socket. leash
# starts it (etc/sv/valkey/service) as the valkey user, with nothing but
# its own directories to write.

daemonize no
supervised no
# The console, like every service.
logfile ""
loglevel notice

# A UNIX socket in its own directory, for the valkey group, as the valkey
# form has it, and :6379 on loopback alone, which only services whose
# leash lets them connect to it (Immich's) reach. protected-mode refuses
# any other address.
port 6379
bind 127.0.0.1
unixsocket /run/svc/valkey/valkey.sock
unixsocketperm 660
protected-mode yes

# Below the leash's memory ceiling (256 MiB), so a full store refuses
# writes (noeviction, as shipped) rather than being killed.
maxmemory 192mb
maxmemory-policy noeviction

# Snapshots in /data, and the append-only log, so a power cut loses no
# queued job (a thumbnail, a face, a backup).
dir /data/svc/valkey
dbfilename dump.rdb
save 3600 1 300 100 60 10000
appendonly yes

# As they ship, and said so here: no loading modules (code into the
# server), no DEBUG, and no changing the protected configs (dir,
# dbfilename, ...) at runtime, which the old attack rewrote to write a
# key file where it wanted it.
enable-module-command no
enable-debug-command no
enable-protected-configs no

# The default user may do all but administer the server: no CONFIG,
# DEBUG, MODULE, REPLICAOF, SHUTDOWN, MONITOR, ACL and the rest of @admin.
# Lua stays: Sidekiq and BullMQ are built on it, and a sandbox escape
# lands in a leashed process that can start nothing.
user default on nopass ~* &* +@all -@admin
