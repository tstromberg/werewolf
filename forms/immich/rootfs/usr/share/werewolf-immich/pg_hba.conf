# PostgreSQL's logins for the immich form (form.yaml, services: postgres):
# local clients by peer, as initdb writes for the postgresql form, and the
# role immich over loopback TCP, which Immich's image needs, as it cannot
# reach the socket. Only services whose leash lets them connect to :5432
# (Immich's alone) reach that port, so the port, held by Landlock, stands
# in for the password a socket's peer check makes needless.
local   all       all                   peer
host    postgres  immich  127.0.0.1/32  trust
