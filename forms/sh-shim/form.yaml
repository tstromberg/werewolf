# sh-shim: no packages of its own. See forms/sh-shim/form.yaml.
base: minimal

# sh-shim, /bin/sh for programs that run `sh -c COMMAND`: one program and
# its words, nothing else (cmd/sh-shim). /bin/sh is the shim only where
# no package or later form gives one: a form with busybox gets busybox's.
programs: [sh-shim]

# Taken back of werewolf's defaults (lib/allow.zig): every leashed service
# may run the shim, which starts only what the service's `run` lines name.
allow: [sh]
