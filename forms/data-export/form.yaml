# Owner-authorized native transfers; no shell or general SSH session.
base: minimal

programs: [data-export, data-transfer, data-transfer-tool]
packages: [openssh-server, zstd]

accounts:
  groups:
    - groupname: sshd
      gid: 22
  users:
    - username: sshd
      uid: 22
      gid: 22
      homedir: /var/empty
      shell: /sbin/nologin

weaknesses:
  network-no-login: owner security keys authorize fixed native transfer operations

services:
  sshd:
    exec: /usr/bin/sshd -D -e
    before: /usr/lib/werewolf/ssh-host-key /data/svc/sshd/host-key /run/svc/sshd/host-key
    user: root
    caps: login
    listen: [tcp/22]
    nofile: 1024
    memory: 512
    # These setup calls let the native endpoint narrow its inherited login
    # context. Readers/decoders drop uid; the publisher keeps only file authority.
    pledge: stdio rpath wpath inet unix connect listen proc exec setuid setgid setgroups chroot caps seccomp landlock
