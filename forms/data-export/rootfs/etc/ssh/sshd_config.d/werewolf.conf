PermitRootLogin prohibit-password
# form.conf may require additional authentication, such as two distinct keys.
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
# No tunnels: a session must not carry traffic past the machine's network
# policy (fence), nor reach a local socket for someone else.
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserRC no
# No compression: its bugs (CVE-2016-10012, 10.6's cross-channel plaintext
# recovery) need it, and werewolf's openssh is built without zlib.
Compression no
# Post-quantum key exchange alone, as OpenSSH 8.5 and later offer it. AES-GCM
# alone: Terrapin (CVE-2023-48795) needs ChaCha20-Poly1305 or an EtM MAC
# with a client older than strict key exchange (9.6). GCM uses no MAC; the
# MACs line holds should a form add a cipher that needs one.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
# ssh-host-key makes an ed25519 host key, and no other.
HostKeyAlgorithms ssh-ed25519
# A login takes a security key, touched: a key file copied off a laptop
# signs nothing here. sshd takes a keyword's first value, so form.conf,
# which sorts before this file, changes it: what a form.yaml's sshd: says
# (forms/README.md), as lima's does, or howl's --sshd.KEYWORD=VALUE.
PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ecdsa-sha2-nistp256@openssh.com
PubkeyAuthOptions touch-required
LogLevel VERBOSE
# A guesser gets three tries and thirty seconds, ten at a time and three
# from one address; a session that stops answering is cut after three
# minutes, and a connection that opens nothing after one.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30
PerSourceMaxStartups 3
ClientAliveInterval 60
ClientAliveCountMax 3
TCPKeepAlive no
UnusedConnectionTimeout 60
# The root is read-only: the host key is copied into /run/svc/sshd at boot
# by ssh-host-key, and keys are what init wrote for each user in /run.
# runsv supervises sshd, so it writes no pid file.
HostKey /run/svc/sshd/host-key
AuthorizedKeysFile /run/werewolf/keys/%u
PidFile none
# One address each: glibc sorts a lookup with two results by asking netlink,
# which the pledge refuses (forms/sshd/form.yaml), at every connection.
ListenAddress 0.0.0.0
ListenAddress ::
