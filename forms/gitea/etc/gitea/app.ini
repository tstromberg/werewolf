; Gitea for the gitea form (docs/gitea.md). The site's address, domain
; and administrator come from the machine's settings as GITEA__server__*
; and GITEA_ADMIN* in its environment, which win over this file. leash
; starts Gitea (etc/sv/gitea/service) as the gitea user. A form on this
; one lays its own file here.
APP_NAME = werewolf
RUN_MODE = prod
RUN_USER = gitea
WORK_PATH = /data/svc/gitea

[server]
PROTOCOL = http
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
DOMAIN = localhost
ROOT_URL = http://localhost:3000/
APP_DATA_PATH = /data/svc/gitea
OFFLINE_MODE = true
ENABLE_PPROF = false
LANDING_PAGE = explore
; Git over SSH, by Gitea's own server, keys only, as the bastion and
; sftpgo have it: post-quantum exchange, Ed25519 host key made once on
; /data. A session gets a line saying there is no shell, and nothing else.
START_SSH_SERVER = true
SSH_DOMAIN = %(DOMAIN)s
SSH_PORT = 22
SSH_LISTEN_HOST = 0.0.0.0
SSH_LISTEN_PORT = 22
BUILTIN_SSH_SERVER_USER = git
SSH_SERVER_HOST_KEYS = ssh/gitea.ed25519
SSH_SERVER_KEY_EXCHANGES = mlkem768x25519-sha256
SSH_SERVER_CIPHERS = chacha20-poly1305@openssh.com, aes256-gcm@openssh.com
SSH_SERVER_MACS = hmac-sha2-256-etm@openssh.com
SSH_CREATE_AUTHORIZED_KEYS_FILE = false
LFS_START_SERVER = true
LFS_JWT_SECRET_URI = file:/data/svc/gitea/secrets/lfs_jwt_secret

[database]
DB_TYPE = sqlite3
PATH = /data/svc/gitea/gitea.db
SQLITE_JOURNAL_MODE = WAL

[repository]
ROOT = /data/svc/gitea/repos
DEFAULT_PRIVATE = private
DEFAULT_PUSH_CREATE_PRIVATE = true
ENABLE_PUSH_CREATE_USER = true
DISABLE_HTTP_GIT = false

[lfs]
PATH = /data/svc/gitea/lfs

[git.config]
; Gitea writes each repository's hooks as bash scripts; there is no bash.
; git runs these instead: gitea-hook, which becomes `gitea hook NAME`.
core.hooksPath = /usr/lib/werewolf/gitea-hooks

[security]
; No web installer: this file is the installation.
INSTALL_LOCK = true
SECRET_KEY_URI = file:/data/svc/gitea/secrets/secret_key
INTERNAL_TOKEN_URI = file:/data/svc/gitea/secrets/internal_token
; A git hook a repository admin writes is a script run on the server:
; none. Gitea's own hooks are gitea-hook (above).
DISABLE_GIT_HOOKS = true
PASSWORD_HASH_ALGO = argon2
MIN_PASSWORD_LENGTH = 12
LOGIN_REMEMBER_DAYS = 7

[oauth2]
JWT_SECRET_URI = file:/data/svc/gitea/secrets/oauth2_jwt_secret

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
ENABLE_NOTIFY_MAIL = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
ENABLE_BASIC_AUTHENTICATION = true

[webhook]
; Webhooks reach the machine's own network alone until a form adds
; `connect gitea tcp/443`.
ALLOWED_HOST_LIST = external
DELIVER_TIMEOUT = 5

[actions]
; A runner executes a repository's code.
ENABLED = false

[packages]
ENABLED = false

[mirror]
; A mirror fetches from anywhere.
ENABLED = false
DISABLE_NEW_PULL = true
DISABLE_NEW_PUSH = true

[migrations]
ALLOW_LOCALNETWORKS = false

[session]
PROVIDER = db
COOKIE_SECURE = true
SAME_SITE = lax

[cache]
ADAPTER = memory

[queue]
TYPE = level
DATADIR = /data/svc/gitea/queues

[indexer]
ISSUE_INDEXER_TYPE = bleve
ISSUE_INDEXER_PATH = /data/svc/gitea/indexers/issues.bleve
REPO_INDEXER_ENABLED = false

[log]
MODE = console
LEVEL = Info
ROOT_PATH = /run/svc/gitea/log
ENABLE_ACCESS_LOG = false

[log.console]
STDERR = true

[other]
SHOW_FOOTER_VERSION = false
SHOW_FOOTER_TEMPLATE_LOAD_TIME = false
