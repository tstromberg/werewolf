base: prod

# Gitea serves the web (behind caddy) and git over its own SSH, and
# sends nothing: no mirrors, migrations or webhooks leave this machine
# until a form of your own adds `connect gitea tcp/443 public` and
# `connect gitea udp/53 tcp/53`, public so a webhook cannot reach the
# machine's own network.
net:
  - listen tcp/3000
  - listen tcp/22

# make check's, for this form alone (forms/README.md)
check:
  web: 3000
