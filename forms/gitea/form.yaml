# gitea: prod, with Gitea hosting git repositories: the web on :3000
# (behind caddy for TLS) and its own SSH server on :22, keys only,
# post-quantum exchange only, no shell. The first administrator is made
# from the config before it serves (gitea-init); registration is closed;
# git hooks, Actions, packages and mirrors are off, since each runs or
# fetches code. Repositories, LFS and the database (SQLite) are in
# /data/svc/gitea. leash starts it (etc/sv/gitea/service) as the gitea
# user, which may run git and nothing else. See forms/gitea/README.md.
base: prod

packages:
  - gitea
  - git
  - openssh-keygen        # the SSH host key, Ed25519, once (forms/gitea/cmd/gitea-init)

# Gitea serves the web (behind caddy) and git over its own SSH, and
# sends nothing: no mirrors, migrations or webhooks leave this machine
# until a form of your own adds `connect gitea tcp/443 public` and
# `connect gitea udp/53 tcp/53`, public so a webhook cannot reach the
# machine's own network.
net:
  - listen tcp/3000
  - listen tcp/22

# make check's, for this form alone (forms/README.md)
check:
  web: 3000
