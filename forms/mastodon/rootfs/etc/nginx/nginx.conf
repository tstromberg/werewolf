# nginx for the mastodon form: Mastodon's media in /data/svc/mastodon/system,
# served on loopback behind Caddy with symlink traversal disabled. leash
# starts nginx as the nginx user, holding neither TLS keys nor Mastodon's
# group.

daemon off;
worker_processes auto;
error_log stderr warn;
pid /run/svc/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /run/svc/nginx/client-body;
    proxy_temp_path       /run/svc/nginx/proxy;
    fastcgi_temp_path     /run/svc/nginx/fastcgi;
    uwsgi_temp_path       /run/svc/nginx/uwsgi;
    scgi_temp_path        /run/svc/nginx/scgi;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1m;

    server {
        listen 127.0.0.1:8080 default_server;
        root /data/svc/mastodon/system;
        disable_symlinks on from=$document_root;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=2419200, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; form-action 'none'" always;

        location ~ /\. {
            return 404;
        }

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri =404;
        }
    }
}
