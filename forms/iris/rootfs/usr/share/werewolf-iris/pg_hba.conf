# PostgreSQL's logins for the iris form (form.yaml, services: postgres):
# local clients by peer, as initdb writes for the postgresql form, and
# the role iris over loopback TCP. Only services whose leash lets them
# connect to :5432 (IRIS's alone) reach that port, so the port, held by
# Landlock, stands in for a password.
local   all       all                 peer
host    postgres  iris    127.0.0.1/32  trust
host    iris_tasks iris   127.0.0.1/32  trust
