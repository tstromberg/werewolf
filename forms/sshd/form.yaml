# sshd: minimal plus operator access by security key: OpenSSH, its service
# (sshd-start) and its policy (etc/ssh/sshd_config.d/werewolf.conf).
base: minimal

packages:
  - openssh-server
  - openssh-sftp-server   # scp and `limactl copy`
  - busybox-full          # a shell for those who log in, and its tools

paths:
  # PAM's password helper, setgid shadow, arrives through openssh-server.
  # Nothing here authenticates with a password.
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755

# sshd-start, the service: the host key, then sshd. The forms that log
# people in take this form (prod-ssh, lima), so minimal carries no sshd.
programs: [sshd-start]

# Taken back of werewolf's defaults (lib/allow.zig): pseudo-terminals,
# for ssh logins; prod-ssh and playground take them with this form.
allow: [pty]

# sshd, for operators by security key.
net:
  - listen tcp/22

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  network-no-login: sshd, by key, is what this form is for; busybox-full brings telnetd too, which nothing starts
  programs-no-downloaders: busybox-full, the tools of those who log in, has wget, nc and telnet
  programs-no-interpreters: busybox-full, the tools of those who log in, has awk
  programs-no-shell: busybox-full's shell, for those who log in
