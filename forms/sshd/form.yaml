# sshd: minimal plus operator access by security key: OpenSSH, its service
# and its policy (etc/ssh/sshd_config.d/werewolf.conf).
base: minimal

packages:
  - openssh-server
  - openssh-sftp-server   # scp and `limactl copy`
  - busybox-full          # a shell for those who log in, and its tools

# OpenSSH requires its privilege-separation account even though the service
# itself starts as root. Other forms do not need it.
accounts:
  groups:
    - groupname: sshd
      gid: 22
  users:
    - username: sshd
      uid: 22
      gid: 22
      homedir: /var/empty
      shell: /sbin/nologin

paths:
  # PAM's password helper, setgid shadow, arrives through openssh-server.
  # Nothing here authenticates with a password.
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755

# Taken back of werewolf's defaults (lib/allow.zig): pseudo-terminals,
# for ssh logins; prod-ssh and playground take them with this form.
allow: [pty]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  network-no-login: sshd, by key, is what this form is for; busybox-full brings telnetd too, which nothing starts
  programs-no-downloaders: busybox-full, the tools of those who log in, has wget, nc and telnet
  programs-no-interpreters: busybox-full, the tools of those who log in, has awk
  programs-no-shell: busybox-full's shell, for those who log in

services:
  sshd:
    exec: /usr/bin/sshd -D -e
    before: /usr/lib/werewolf/ssh-host-key /data/svc/sshd/host-key /run/svc/sshd/host-key
    user: root
    caps: login
    listen: [tcp/22]
    nofile: 1024
    # Its sessions share it: a pre-auth flood (CVE-2025-26466) stops here.
    memory: 512
    # Every session inherits this (docs/design/ssh-hardening.md). sshd's own
    # sandbox installs its filter with prctl, so no seccomp; nothing logged
    # in sets capabilities or Landlock rules; AF_PACKET needs NET_RAW, which
    # login lacks; no netlink, so no ip or ss. reboot and syslog are an
    # operator's: reboot and dmesg.
    pledge: stdio rpath wpath inet unix connect listen proc exec setuid setgid setgroups chroot reboot syslog sendfile
