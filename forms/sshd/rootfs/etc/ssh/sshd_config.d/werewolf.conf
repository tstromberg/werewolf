PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
X11Forwarding no
AllowAgentForwarding no
# No tunnels: a session must not carry traffic past the machine's network
# policy (fence), nor reach a local socket for someone else.
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
# OpenSSH's defaults, less what is weak: SHA-1 and 64-bit MACs, and RSA
# signatures over SHA-1.
MACs -*sha1*,umac-64*
HostKeyAlgorithms -ssh-rsa*
# A login takes a security key, touched: a key file copied off a laptop
# signs nothing here. sshd takes a keyword's first value, so form.conf,
# which sorts before this file, changes it: what a form.yaml's sshd: says
# (forms/README.md), as lima's does, or howl's --sshd.KEYWORD=VALUE.
PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ecdsa-sha2-nistp256@openssh.com
PubkeyAuthOptions touch-required
LogLevel VERBOSE
# A guesser gets three tries and thirty seconds, ten at a time; a session
# that stops answering is cut after three minutes.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30
ClientAliveInterval 60
ClientAliveCountMax 3
# The root is read-only: the host key is made in /run at boot, and keys are
# what init wrote for each user there.
HostKey /run/sshd/ssh_host_ed25519_key
AuthorizedKeysFile /run/werewolf/keys/%u
