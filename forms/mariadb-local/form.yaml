# mariadb-local: prod, with MariaDB's newest stable release, for the
# machine's own services. It answers on a UNIX socket in /run/svc/mariadb
# and nothing else: no TCP port, and the form declares none. mariadb-tcp
# is this server with port 3306 open. Its data is in /data/svc/mariadb.
# leash starts it as the mariadb user (etc/sv/mariadb/service); before
# each start mariadb-init makes the data if there is none, as
# mariadb-install-db would, and applies the SQL a form brings in
# /usr/share/werewolf-mariadb. Local users log in as their system users
# (unix_socket). The mariadb package follows MariaDB's stable releases;
# mariadb-init upgrades the data to each new series with mariadb-upgrade.
# See forms/mariadb-local/README.md.
base: prod

packages:
  - mariadb
  # mariadb-upgrade runs MariaDB's client to upgrade the system tables.
  - mariadb-client

# The interpreters its scripts name, which nothing here runs: mariadb-init
# does mariadb-install-db's work, and mariadbd-safe, mytop and the
# cluster's tools are not for a leashed server.
prune:
  - usr/bin/bash
  - usr/bin/perl
  - usr/bin/perl5.44.0
  - usr/bin/unix_chkpwd  # No UNIX password authentication.

services:
    # MariaDB, as its own user, for local clients over its UNIX socket
    # alone. mariadb-init makes the data on the first start, streams
    # /run/werewolf/import/*.sql into that first database, upgrades the data
    # when the server is of a newer series, and applies the image's SQL
    # before each start, through the server in bootstrap mode.
  mariadb:
    exec: /usr/bin/mariadbd --defaults-file=/etc/mariadb/werewolf.cnf
    before: /usr/lib/werewolf/mariadb-init
    # mariadb-init's upgrade, and the client and checker it runs. Without the
    # exec promise, mariadbd itself can run none of them.
    run: /usr/bin/mariadb-upgrade /usr/bin/mariadb /usr/bin/mariadb-check
    user: mariadb
    # aio: InnoDB's reads and writes, by Linux native AIO. It reaches no
    # network: there is no inet promise.
    pledge: stdio rpath wpath unix listen proc aio
    read: /etc/mariadb /run/werewolf/import
    # Local clients reach its socket, /run/svc/mariadb/mariadb.sock.
    share: shared
    memory: 1024
    nofile: 16384
    # mariadbd sets its umask from these, files 0640 and directories 0750,
    # where its default would let the group write.
    env:
      - UMASK=0640
      - UMASK_DIR=0750
