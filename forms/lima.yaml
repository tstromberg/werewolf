# lima: the test vehicle. Everything a form can be, so one Lima VM can try
# bite, slots and autoupdate: autoupdate's chain, sshd (its service is in
# minimal), bash for Lima's readiness probes, and a disk for /data when
# Lima boots it directly.
include: autoupdate.yaml
contents:
  packages:
    - openssh-server
    - openssh-sftp-server
    - bash
    - e2fsprogs

paths:
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755
