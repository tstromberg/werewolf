version: 1
# The registry's own API, as any client speaks it: blobs and a manifest go
# up by POST and PUT and come back by GET (test/config holds the image).
suites:
  - name: zot-ca
    readiness: true
    cases:
      - name: zot-ca
        steps:
          - file: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              type: file
            await: 60s
  - name: zot-ready
    readiness: true
    cases:
      - name: zot-ready
        steps:
          - fetch:
              url: https://localhost/v2/
              ca: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              status: 401
            await: 60s
  - name: zot-startup
    cases:
      - name: zot-stranger
        steps:
          - fetch:
              url: https://localhost/v2/
              ca: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              status: 401
            await: 60s
  - name: zot
    fixtures:
      alice-auth: /run/config/tests/zot-alice-auth
      bob-auth: /run/config/tests/zot-bob-auth
      layer: /run/config/tests/zot-layer
      evil: /run/config/tests/zot-evil
      config: /run/config/tests/zot-config
      manifest: /run/config/tests/zot-manifest
    cases:
      - name: zot-user
        steps:
          - service: zot
            expect:
              user: zot
              capabilities: []
              no_new_privileges: true
      - name: zot-wrong-password
        steps:
          - fetch:
              url: https://localhost/v2/
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              authorization:
                scheme: Basic
                credentials: YWxpY2U6d3Jvbmc=
            expect:
              status: 401
            timeout: 15s
      - name: zot-only-v2
        steps:
          - fetch:
              url: https://localhost/metrics
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              authorization:
                scheme: Basic
                credentials:
                  fixture: alice-auth
            expect:
              status: 404
      # alice pushes app/hello:1: its layer and config, each in one POST,
      # then its manifest.
      - name: zot-push
        steps:
          - fetch:
              url: https://localhost/v2/app/hello/blobs/uploads/?digest=sha256:7ca39bea2d880a3b1395e3ea542111553f8e046eef601177013fb7c18d6aa901
              method: POST
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Content-Type: application/octet-stream
              authorization:
                scheme: Basic
                credentials:
                  fixture: alice-auth
              body:
                fixture: layer
                raw: true
            expect:
              status: 201
            timeout: 30s
          - fetch:
              url: https://localhost/v2/app/hello/blobs/uploads/?digest=sha256:54f50b1bad2a431eaa5d58e755c177a99a3dd4d5d832d11e83da424fde011bef
              method: POST
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Content-Type: application/octet-stream
              authorization:
                scheme: Basic
                credentials:
                  fixture: alice-auth
              body:
                fixture: config
                raw: true
            expect:
              status: 201
            timeout: 30s
          - fetch:
              url: https://localhost/v2/app/hello/manifests/1
              method: PUT
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Content-Type: application/vnd.docker.distribution.manifest.v2+json
              authorization:
                scheme: Basic
                credentials:
                  fixture: alice-auth
              body:
                fixture: manifest
                raw: true
            expect:
              status: 201
              headers:
                docker-content-digest: sha256:5e6f08e0ab47233594b3894ca531ab20cf9a5afe6986007f460ebabfd9597385
            timeout: 30s
          - file: /data/svc/zot/app/hello/index.json
            expect:
              type: file
              uid: zot
        phases:
          - seed
      - name: zot-pull
        steps:
          - fetch:
              url: https://localhost/v2/app/hello/manifests/1
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Accept: application/vnd.docker.distribution.manifest.v2+json
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
            expect:
              status: 200
              headers:
                docker-content-digest:
                  matches: ^sha256:[0-9a-f]{64}$
              json:
                /schemaVersion: 2
                /layers:
                  count: 1
                /layers/0/digest: sha256:7ca39bea2d880a3b1395e3ea542111553f8e046eef601177013fb7c18d6aa901
            name: manifest
          - fetch:
              url: https://localhost
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: GET
              path:
                - v2
                - app
                - hello
                - manifests
                - step: manifest
                  header: docker-content-digest
              headers:
                Accept: application/vnd.docker.distribution.manifest.v2+json
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
            expect:
              status: 200
              body:
                step: manifest
                body: true
          - fetch:
              url: https://localhost/v2/app/hello/blobs/sha256:7ca39bea2d880a3b1395e3ea542111553f8e046eef601177013fb7c18d6aa901
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
            expect:
              status: 200
              body:
                fixture: layer
                raw: true
            timeout: 30s
          - file: /data/svc/zot/app/hello/index.json
            expect:
              type: file
              uid: zot
      - name: zot-alone
        steps:
          - service: zot
            expect:
              connect_rules: []
      - name: zot-stranger-pull
        steps:
          - fetch:
              url: https://localhost/v2/app/hello/manifests/1
              ca: /data/svc/caddy/pki/authorities/local/root.crt
            expect:
              status: 401
              body:
                contains: UNAUTHORIZED
            timeout: 30s
      - name: zot-stranger-push
        steps:
          - fetch:
              url: https://localhost/v2/app/evil/blobs/uploads/?digest=sha256:7ca39bea2d880a3b1395e3ea542111553f8e046eef601177013fb7c18d6aa901
              method: POST
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Content-Type: application/octet-stream
              body:
                fixture: layer
                raw: true
            expect:
              status: 401
            timeout: 30s
          - file: /data/svc/zot/app/evil
            expect:
              exists: false
      - name: zot-reader-push
        steps:
          - fetch:
              url: https://localhost/v2/app/hello/manifests/1
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Accept: application/vnd.docker.distribution.manifest.v2+json
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
            expect:
              status: 200
              headers:
                docker-content-digest:
                  matches: ^sha256:[0-9a-f]{64}$
              json:
                /schemaVersion: 2
                /layers:
                  count: 1
                /layers/0/digest: sha256:7ca39bea2d880a3b1395e3ea542111553f8e046eef601177013fb7c18d6aa901
            name: manifest
          # bob only pulls: his first upload to app/hello is refused.
          - fetch:
              url: https://localhost/v2/app/hello/blobs/uploads/?digest=sha256:9d95cea2d7ebcb77ebea797c61fe775c903388ba5c3ad3626aeb61f0165a5c69
              method: POST
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Content-Type: application/octet-stream
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
              body:
                fixture: evil
                raw: true
            expect:
              status: 403
              json:
                /errors/0/code: DENIED
            timeout: 30s
          - fetch:
              url: https://localhost
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              method: DELETE
              path:
                - v2
                - app
                - hello
                - manifests
                - step: manifest
                  header: docker-content-digest
              headers:
                Accept: application/vnd.docker.distribution.manifest.v2+json
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
            expect:
              status: 403
              json:
                /errors/0/code: DENIED
          - fetch:
              url: https://localhost/v2/app/hello/manifests/1
              ca: /data/svc/caddy/pki/authorities/local/root.crt
              headers:
                Accept: application/vnd.docker.distribution.manifest.v2+json
              authorization:
                scheme: Basic
                credentials:
                  fixture: bob-auth
            expect:
              status: 200
              body:
                step: manifest
                body: true
