; php-fpm for the moodle form: one pool, on a UNIX socket in its own
; directory, which Caddy, of moodle's group, may use. leash starts it as
; the moodle user (etc/sv/moodle/service), so there is no root master to
; drop privileges from and no user to name. This file is the whole
; configuration: Wolfi's php-fpm.d is not read.

[global]
; --force-stderr sends the log to the console, like every service; the
; file is only where php-fpm insists on opening one.
error_log = /run/svc/moodle/error.log
daemonize = no
pid = /run/svc/moodle/php-fpm.pid

[moodle]
listen = /run/svc/moodle/php.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[PATH] = /usr/bin
env[TMPDIR] = /run/svc/moodle
; Only scripts Caddy hands it, and no way to run a file of another name.
security.limit_extensions = .php
; What PHP may read: the code, its own directory and its data. Nothing
; else of the machine, whatever a plugin tries.
php_admin_value[open_basedir] = /usr/share/moodle:/run/svc/moodle:/data/svc/moodle
php_admin_value[upload_tmp_dir] = /run/svc/moodle
php_admin_value[sys_temp_dir] = /run/svc/moodle
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_include] = off
; No program run from PHP: the paths to programs Moodle's settings name
; are refused too ($CFG->preventexecpath, config.php).
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
; Moodle's advice: memory, uploads and long requests (a course's backup
; or restore), and its exceptions without their arguments.
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_vars] = 5000
php_admin_flag[zend.exception_ignore_args] = on
; Cookies PHP itself sets; Moodle sets its own the same from config.php.
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on
; The opcode cache's settings are on php-fpm's command line
; (etc/sv/moodle/service): it starts before any pool's values apply. The
; code is the image's, which cannot change, so it never looks again.
