# moodle: Moodle 5.3, the long-term release, courses for a school or a
# university, with PostgreSQL, Caddy and cron beside it (with): Caddy
# serves it over HTTPS at the machine's base URL, with a certificate from
# Let's Encrypt, and hands its PHP to php-fpm; Moodle's cron runs every
# minute. Wolfi does not ship Moodle: melange lays the release in
# /usr/share/moodle (forms/moodle/melange/moodle.yaml), which no one on
# the machine can change, with the form's config.php beside it. Course
# files, sessions and caches are in /data/svc/moodle, its tables in the
# schema moodle. It is installed, with its administrator from the config,
# before it serves, and upgraded by the image, never the web. See
# forms/moodle/README.md.
base: prod

with: [postgresql, caddy, cron, sh-shim]

packages:
  - php-8.4
  - php-8.4-fpm
  - php-8.4-ctype
  - php-8.4-curl
  - php-8.4-dom
  - php-8.4-exif          # photos' orientation
  - php-8.4-fileinfo
  - php-8.4-gd            # images, badges, PDF annotation
  - php-8.4-iconv
  - php-8.4-intl
  - php-8.4-mbstring
  - php-8.4-opcache
  - php-8.4-openssl
  - php-8.4-pgsql         # the database
  - php-8.4-simplexml
  - php-8.4-soap
  - php-8.4-sodium
  - php-8.4-xml
  - php-8.4-xmlreader
  - php-8.4-zip           # backups, imports, plugins' packages

# The web's user and cron's share a group, as their files do: Moodle's
# cron writes course files, caches and locks in the web's directory.
# Their ids are those their names' hashes would give them
# (forms/README.md).
accounts:
  groups:
    - groupname: moodle
      gid: 1877876169
  users:
    - username: moodle
      uid: 1877876169
      gid: 1877876169
      homedir: /var/empty
      shell: /sbin/nologin
    - username: moodle-cron
      uid: 1655450216
      gid: 1877876169
      homedir: /var/empty
      shell: /sbin/nologin

# make check's (forms/README.md): Moodle's install makes some 500 tables.
check:
  memory: 3072

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: php-fpm runs Moodle, which is what this form is for
  kernel-write-xor-execute: PostgreSQL compiles costly queries, and PCRE2 PHP's patterns, to machine code (allow jit, from postgresql)

services:
  # Caddy, as its own user, for Moodle: it may bind :80 and :443 and no
  # other port, reach the ACME CA over HTTPS and a resolver, and php-fpm's
  # socket, which it reaches as a member of moodle's group. It reads its
  # configuration and the image, and writes only its own directories. Its
  # site is the base URL Moodle takes too, from the machine's settings, as
  # BASE_URL, which the Caddyfile reads.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    group: moodle
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/53 udp/53, /run/svc/moodle/php.sock]
    read: /etc/caddy
    config: settings /run/config/caddy/settings.json
    setting: base-url url as BASE_URL
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB

  # Moodle, php-fpm, as moodle: it answers Caddy on a socket in its own
  # directory, reaches its database by its socket, and public addresses
  # alone, for mail and what a course links to (Moodle refuses private
  # ones itself, and fence beneath it). Before it serves, under this
  # leash: setup.php writes the site's settings to /data and, the first
  # time, installs Moodle with the administrator the config names; Moodle's
  # own upgrade.php upgrades it when the image brought a newer release.
  moodle:
    exec: /usr/bin/php-fpm --nodaemonize --force-stderr --fpm-config /etc/php/php-fpm.conf -d opcache.lockfile_path=/run/svc/moodle -d opcache.validate_timestamps=0 -d opcache.memory_consumption=256 -d opcache.interned_strings_buffer=32 -d opcache.max_accelerated_files=20000
    before:
      - /usr/bin/php -d memory_limit=1G -d max_input_vars=5000 /usr/share/werewolf-moodle/setup.php
      - /usr/bin/php -d memory_limit=1G -d max_input_vars=5000 /usr/share/moodle/admin/cli/upgrade.php --non-interactive
      - /usr/bin/php-fpm --test --fpm-config /etc/php/php-fpm.conf -d opcache.lockfile_path=/run/svc/moodle
    user: moodle
    # Its directories are its group's: cron, whose user shares it, writes
    # in them, and Caddy reaches the socket.
    share: group
    # netlink: glibc's resolver lists the host's addresses before a lookup.
    pledge: stdio rpath wpath inet unix netlink connect listen proc
    connect:
      - tcp/443 tcp/80 tcp/465 tcp/587 public
      - udp/53 tcp/53
      - /run/svc/postgres/.s.PGSQL.5432
    read: /etc/php
    # The administrator's password, the mail relay's, and the site's
    # settings, from the machine's config: without the administrator's
    # password the service parks, since an uninstalled Moodle belongs to
    # whoever finds it first.
    config:
      - admin-password /run/config/moodle/admin-password
      - smtp-password /run/config/moodle/smtp-password optional
      - settings /run/config/moodle/settings.json
    setting:
      - base-url url required
      - site-name string
      - admin string
      - admin-email string required
      - smtp hostport
      - smtp-user string
      - mail-from string
    render: json site.json
    memory: 1536
    nofile: 65536
    env:
      - HOME=/run/svc/moodle
      - TMPDIR=/run/svc/moodle

  # Moodle's cron: supercronic, as moodle-cron, of the web's group, runs
  # etc/cron/crontab's one job every minute, Moodle's admin/cli/cron.php,
  # through sh-shim, under this leash. It reads the settings the web wrote
  # on /data, logs in to the database as its own role, which acts as
  # Moodle's, and sends the mail the web queued.
  cron:
    exec: /usr/bin/supercronic -json -no-reap /etc/cron/crontab
    user: moodle-cron
    pledge: stdio rpath wpath inet unix netlink connect proc exec
    connect:
      - tcp/443 tcp/80 tcp/465 tcp/587 public
      - udp/53 tcp/53
      - /run/svc/postgres/.s.PGSQL.5432
    run: /usr/bin/php
    read: /etc/cron /etc/php
    write: /data/svc/moodle
    memory: 1024
    # Background work: a quarter share of contended CPUs, so a course
    # backup cannot starve the web.
    cpu: 25
    env:
      - MOODLE_DBUSER=moodle-cron
      - HOME=/run/svc/cron
      - TMPDIR=/run/svc/cron
