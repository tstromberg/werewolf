# app: prod for an application, laid where form.yaml's app says. No
# runtime, service, listening port or account: descendants declare those
# for their workload, and their service's `user app` gets an account of
# its own from the build (forms/README.md).
base: prod

# Where it keeps its application: howl's --app DIR is laid here
# (cmd/howl/app.zig).
app: /usr/lib/app
