# ruby: prod with Ruby and Bundler, for an application a form on this one
# brings: its program in /usr/lib/app (form.yaml's app), verified and
# read-only with the rest of the root, its gems vendored into it (bundle
# install --deployment, at build); and etc/sv/app/service, which starts it.
# ruby-app brings the service, for howl's --app to lay the program over;
# ruby-example brings both. See docs/forms.md.
base: app

packages:
  - ruby-4.0
  - ruby4.0-bundler

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: ruby, for the application a form on this one brings
