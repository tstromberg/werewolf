# oauth2-proxy for the oauth2-proxy form: a login in front of the
# upstream, which a form on this one names in place of the wall below.
# The provider, client, redirect URL and who may enter come from the
# machine's settings (howl pack --provider-url ...), as
# OAUTH2_PROXY_* in its environment, which wins over this file; the
# client and cookie secrets from the config. leash starts it
# (etc/sv/oauth2-proxy/service) as the oauth2-proxy user.
provider = "oidc"
http_address = "0.0.0.0:4180"
# Behind caddy or the cloud's balancer, which says so in
# X-Forwarded-Proto; cookies are secure, so TLS in front is required.
reverse_proxy = true
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_refresh = "1h"
cookie_expire = "8h"
cookie_name = "_oauth2_proxy"
skip_provider_button = true
# What the upstream learns of the visitor: the headers, never the token.
set_xauthrequest = true
pass_access_token = false
pass_authorization_header = false
# The upstream: a wall that answers 200 to whoever got in. A form of your
# own puts its application here, http://127.0.0.1:8080 or a machine on
# the network.
upstreams = ["static://200"]
# One line a request on the console, but not the balancer's pings.
request_logging = true
silence_ping_logging = true
