# oauth2-proxy: prod, with a login in front of anything: it asks an OIDC
# provider (Google, Entra, Keycloak, Authentik, GitHub) who the visitor
# is, and lets those the settings allow through to the upstream, which
# is a form of your own's (static://200 here, a wall with nothing behind
# it). TLS is in front of it, caddy or the cloud's balancer, which its
# cookies require. leash starts it (etc/sv/oauth2-proxy/service) as the
# oauth2-proxy user. See forms/oauth2-proxy/README.md.
base: prod

packages:
  - oauth2-proxy

services:
  # oauth2-proxy, as its own user: it may bind :4180 and no other port,
  # reach the provider over HTTPS and the upstream over HTTP, read its
  # configuration and the image, and write only its own directory. The
  # provider, client and who may enter come from the machine's settings as
  # its own environment variables; its two secrets from the config.
  oauth2-proxy:
    exec: /usr/bin/oauth2-proxy --config /etc/oauth2-proxy/oauth2-proxy.cfg
    user: oauth2-proxy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/4180]
    connect: [tcp/443 tcp/80 udp/53 tcp/53]
    read: /etc/oauth2-proxy
    secret:
      - OAUTH2_PROXY_CLIENT_SECRET /run/config/oauth2-proxy/client_secret
      - OAUTH2_PROXY_COOKIE_SECRET /run/config/oauth2-proxy/cookie_secret
    config: settings /run/config/oauth2-proxy/settings.json
    setting:
      - provider-url url required as OAUTH2_PROXY_OIDC_ISSUER_URL
      - client-id string required as OAUTH2_PROXY_CLIENT_ID
      - redirect-url url required as OAUTH2_PROXY_REDIRECT_URL
      - email-domains hostname... as OAUTH2_PROXY_EMAIL_DOMAINS
      - allowed-groups hostname... as OAUTH2_PROXY_ALLOWED_GROUPS
      - skip-discovery bool as OAUTH2_PROXY_SKIP_OIDC_DISCOVERY
      - login-url url as OAUTH2_PROXY_LOGIN_URL
      - redeem-url url as OAUTH2_PROXY_REDEEM_URL
      - jwks-url url as OAUTH2_PROXY_OIDC_JWKS_URL
    # For a provider without discovery, or one the machine cannot reach at
    # start: its endpoints by hand.
    render: env provider
    memory: 256
    nofile: 4096
    env: [HOME=/run/svc/oauth2-proxy, GOMEMLIMIT=192MiB]
