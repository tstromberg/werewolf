# valkey: prod, with Valkey 9.1 as a cache or queue for the application on
# the same machine. It answers on a UNIX socket in /run/svc/valkey and
# nothing else: no TCP port, and the form declares none. Its snapshots
# are in /data/svc/valkey. leash starts it as the valkey user
# (etc/sv/valkey/service). valkey-init copies dump.rdb from
# /run/werewolf/import once, before the first start. The default user
# may do all but administer it
# (etc/valkey/valkey.conf). Its memory cap is 192 MiB under a 256 MiB
# leash, so a full cache refuses writes. valkey-tcp is the same server
# on port 6379, and --maxmemory replaces that cap. The application's
# form includes this one and
# puts its user in the valkey group, which the socket is shared with. The
# major version is in the package's name: a new one is a new form. See
# forms/valkey/README.md. Wolfi's valkey depends on posix-libc-utils, whose ldd is
# a bash script: the image is made without the shell (valkey.prune).
base: prod

packages:
  - valkey-9.1
  - valkey-9.1-cli        # the operator's client, and make check's

# Wolfi's valkey-9.1 depends on posix-libc-utils, whose ldd is a bash
# script, so bash comes with it. Nothing on this machine runs either: the
# leash holds Valkey to its own program, and there is no login. The image
# is made without the shell, and posture finds none.
prune:
  - usr/bin/bash

services:
  # Valkey, as its own user, for local clients over its UNIX socket alone:
  # it reads its configuration and the image, writes only its own
  # directories, and reaches nothing on the network. Its own ceiling
  # (maxmemory, in valkey.conf) sits below the leash's, so it refuses writes
  # rather than being killed for them.
  valkey:
    exec: /usr/bin/valkey-server /etc/valkey/valkey.conf
    before: /usr/lib/werewolf/valkey-init
    user: valkey
    pledge: stdio rpath wpath unix listen proc
    read: /etc/valkey /run/werewolf/import
    # Its clients, members of its group (`group valkey`), reach the socket in
    # its directory, which they may enter but not list.
    share: shared
    memory: 256
    nofile: 10240
