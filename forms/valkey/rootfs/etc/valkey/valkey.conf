# Valkey for the valkey form. leash starts it (etc/sv/valkey/service) as
# the valkey user, with nothing but its own directories to write. A form
# on this one lays its own file here: a cache sets `maxmemory-policy
# allkeys-lru`, a queue that must not lose a job `appendonly yes`.

daemonize no
supervised no
# The console, like every service.
logfile ""
loglevel notice

# A UNIX socket in its own directory, for the valkey group, which a
# service joins with `group valkey` in its service file; its directory is
# shared, so a member reaches the socket by name. No TCP port. A form
# that serves the network
# adds `port 6379` and `listen tcp/6379` to its service and .net files,
# and then a password (an ACL file from the config) is required.
port 0
unixsocket /run/svc/valkey/valkey.sock
unixsocketperm 660
protected-mode yes

# Below the leash's memory ceiling (256 MiB), so a full store refuses
# writes (noeviction, as shipped) rather than being killed.
maxmemory 192mb
maxmemory-policy noeviction

# Snapshots in /data; the append-only log is a line away.
dir /data/svc/valkey
dbfilename dump.rdb
save 3600 1 300 100 60 10000
appendonly no

# As they ship, and said so here: no loading modules (code into the
# server), no DEBUG, and no changing the protected configs (dir,
# dbfilename, ...) at runtime, which the old attack rewrote to write a
# key file where it wanted it.
enable-module-command no
enable-debug-command no
enable-protected-configs no

# The default user may do all but administer the server: no CONFIG,
# DEBUG, MODULE, REPLICAOF, SHUTDOWN, MONITOR, ACL and the rest of @admin.
# Lua stays: Sidekiq and BullMQ are built on it, and a sandbox escape
# lands in a leashed process that can start nothing.
user default on nopass ~* &* +@all -@admin
