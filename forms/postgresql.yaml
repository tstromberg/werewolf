# postgresql: prod, with PostgreSQL 17 for the machine's own services. It
# answers on a UNIX socket in /run/svc/postgres and nothing else: no TCP
# port, and the form declares none. Its data is in /data/svc/postgres.
# leash starts it as the postgres user (etc/sv/postgres/service); before
# each start pg-init makes the cluster if there is none, and applies the
# SQL a form brings in /usr/share/werewolf-postgres. Local roles are
# their system users (peer authentication). The major version is the
# package's name: a new one is a new form, since its data needs
# pg_upgrade. See docs/postgresql.md.
include: prod.yaml
contents:
  packages:
    - postgresql-17

accounts:
  groups:
    - groupname: postgres
      gid: 70
  users:
    - username: postgres
      uid: 70
      gid: 70
      homedir: /var/empty
      shell: /sbin/nologin

paths:
  # PAM's password helper, setgid shadow, arrives through PostgreSQL's
  # libraries. Nothing here authenticates with a password.
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755
