# prod-ssh: prod, reached by key. sshd is as the sshd form has it. CI
# publishes it; see docs/releases.md.
include: prod.yaml
contents:
  packages:
    - openssh-server
    - openssh-sftp-server   # scp
    - busybox-full          # a shell for those who log in, and its tools

paths:
  # PAM's password helper, setgid shadow, arrives through openssh-server.
  # Nothing here authenticates with a password.
  - path: /usr/bin/unix_chkpwd
    type: permissions
    permissions: 0o755
