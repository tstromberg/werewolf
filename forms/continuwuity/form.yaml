# continuwuity: a Matrix homeserver, with Caddy in front. Continuwuity
# listens on loopback. Caddy serves it at the server's name over HTTPS.
# Nobody registers: the administrator is created from the config the first
# time the database is made, and registration stays closed. Federation is
# on, so other servers can reach this one at port 443. URL previews are
# compiled in and allowlisted to nothing. Wolfi does not ship it:
# werewolf's application feed builds a pinned release
# (../packages/continuwuity/continuwuity.yaml). The database is
# RocksDB in /data/svc/continuwuity. See forms/continuwuity/README.md.
base: prod

with: [caddy]

packages:
  - continuwuity
  # What it links, from Wolfi. libc and libm come with the base.
  - libgcc
  - libstdc++

services:
  # Caddy, as its own user, for Continuwuity: ports 80 and 443, the ACME
  # CA, a resolver, and Continuwuity on loopback. The site is the server
  # name, from the machine's settings.
  caddy:
    exec: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    before: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    user: caddy
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/80 tcp/443]
    connect: [tcp/443 tcp/8008]
    lookup: "*"
    read: /etc/caddy
    config: settings /run/config/caddy/settings.json
    setting: domain hostname required as SERVER_NAME
    render: env site
    memory: 512
    nofile: 65536
    env:
      - XDG_DATA_HOME=/data/svc/caddy
      - XDG_CONFIG_HOME=/run/svc/caddy
      - HOME=/run/svc/caddy
      - GOMEMLIMIT=384MiB

  # Continuwuity, as its own user: loopback only, federation to public
  # 443 and 8448, its database on /data. The configuration is written by
  # continuwuity-init from the server name and the admin password.
  continuwuity:
    exec: /usr/bin/conduwuit --config /run/svc/continuwuity/continuwuity.toml
    before: /usr/lib/werewolf/continuwuity-init
    user: continuwuity
    pledge: stdio rpath wpath inet unix netlink connect listen proc
    listen: [tcp/8008 loopback]
    connect:
      - tcp/443 tcp/8448 public
    lookup: "*"
    config:
      - admin-password /run/config/continuwuity/admin-password
      - settings /run/config/continuwuity/settings.json
    setting:
      - domain hostname required as SERVER_NAME
      - admin string required as ADMIN
    render: env site
    memory: 1024
    nofile: 8192
    env:
      - HOME=/run/svc/continuwuity
