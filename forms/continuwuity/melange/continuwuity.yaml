# Continuwuity for werewolf's continuwuity form, as Wolfi would package it:
# built by melange in Wolfi's environment with Wolfi's Rust, from the
# release tag's commit. The binary is conduwuit, the name the project
# still builds. io_uring is off: no pledge allows it. Sentry and
# OpenTelemetry are off. URL previews are built and allowlisted to
# nothing. Offered to wolfi-dev/os as it is; when Wolfi
# ships it, the form names the package and this file goes.
package:
  name: continuwuity
  version: 26.7.3
  epoch: 0
  description: A Matrix homeserver, the continuation of conduwuit
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang
      - cmake
      - pkgconf
      - rust-1.98

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/continuwuity/continuwuity
      tag: v${{package.version}}
      expected-commit: 6957ff7689a3184903a717159287acdcd6a79d23

  - runs: |
      cargo auditable build --release --locked --no-default-features \
        -p conduwuit \
        --features 'brotli_compression,gzip_compression,zstd_compression,element_hacks,jemalloc,jemalloc_conf,console,ring,
        bindgen-runtime,release_max_log_level,url_preview'
      install -Dm755 target/release/conduwuit ${{targets.destdir}}/usr/bin/conduwuit

  - uses: strip

update:
  enabled: true
  github:
    identifier: continuwuity/continuwuity
