# gatus: prod, with Gatus watching a service and showing a status page
# on :8080. The page is read-only and has no login: put it behind caddy
# or oauth2-proxy, or on a tailnet, to show it beyond the machine. What
# it watches is a setting (--target); a form of your own lays its
# config.yaml over etc/gatus/config.yaml for more endpoints and alerts.
# Its history is in /data/svc/gatus. leash starts it
# (etc/sv/gatus/service) as the gatus user. See forms/gatus/README.md.
base: prod

packages:
  - gatus

services:
  # Gatus, as its own user: it may bind :8080 and no other port, reach
  # what it watches over HTTPS and HTTP and a resolver, read its
  # configuration and the image, and write only its own directories. The
  # target comes from the machine's settings as TARGET, which config.yaml
  # reads.
  gatus:
    exec: /usr/bin/gatus
    user: gatus
    pledge: stdio rpath wpath inet unix connect listen proc
    listen: [tcp/8080]
    connect: [tcp/443 tcp/80 udp/53 tcp/53 icmp]
    read: /etc/gatus
    config: settings /run/config/gatus/settings.json
    setting: target url required as TARGET
    render: env target
    memory: 256
    nofile: 4096
    env: [GATUS_CONFIG_PATH=/etc/gatus/config.yaml, GOMEMLIMIT=192MiB]
