# dhcp: minimal, taking its address from the network's DHCP server when
# the kernel command line names none: werewolf's own client, cmd/dhcp-client/dhcp-client.zig,
# and the dhcp service that renews the lease. bitten builds on it, and so
# autoupdate and prod do.
include: minimal.yaml

# _dhcp: the client's half that reads the network.
accounts:
  groups:
    - groupname: _dhcp
      gid: 67
  users:
    - username: _dhcp
      uid: 67
      gid: 67
      homedir: /var/empty
      shell: /sbin/nologin
