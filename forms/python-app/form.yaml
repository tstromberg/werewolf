# python-app: python, starting an application of yours from /usr/lib/app
# (form.yaml's app) as `python3 main.py`, on :8080 (etc/sv/app/service).
# It ships none: the service stays down, saying why, until howl's --app or
# a form on this one lays main.py there, as python-example does. See
# docs/forms.md.
base: python

# make check's, for this form alone (forms/README.md): it ships no
# application, so its service stays down: nothing listens on 8080, and
# nothing is in its cgroup to count or reap.
check:
  skip: [answering, http-answering, cgrouped, reaped]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: python3 runs the application laid in /usr/lib/app

services:
  # The application, as its own user: it may bind :8080 and no other port,
  # read the image, and run only python. The image is read-only, so Python
  # writes no bytecode beside it. Down until main.py is there: this form
  # ships none.
  app:
    exec: /usr/bin/python3 /usr/lib/app/main.py
    user: app
    requires: /usr/lib/app/main.py
    pledge: stdio rpath proc inet listen
    memory: 512
    listen: [tcp/8080]
    env: [PYTHONDONTWRITEBYTECODE=1, PYTHONUNBUFFERED=1]
