# ollama: prod, with Ollama serving models on :11434 to the network. Its
# API has no login of its own: oauth2-proxy, caddy or a tailnet in front
# is how it is served beyond the machine, and the form says so. Models
# are pulled from Ollama's registry into /data/svc/ollama and run on the
# CPU (a GPU is a device no form carries yet). leash starts it
# (etc/sv/ollama/service) as the ollama user. See forms/ollama/README.md.
base: prod

packages:
  - ollama

services:
  # Ollama, as its own user: it may bind :11434 and no other port, reach
  # the registry over HTTPS and a resolver, read the image, and write only
  # its own directories, where the models are. It starts its own runner
  # (itself) for a loaded model, so it pledges exec and may run only its
  # own program.
  ollama:
    exec: /usr/bin/ollama serve
    user: ollama
    pledge: stdio rpath wpath inet unix connect listen proc exec
    listen: [tcp/11434]
    connect: [tcp/443 public, udp/53 tcp/53]
    run: /usr/bin/ollama
    memory: 8192
    nofile: 65536
    env:
      - HOME=/run/svc/ollama
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/data/svc/ollama
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NOPRUNE=1
      - OLLAMA_ORIGINS=http://localhost,http://127.0.0.1
    # Browsers on other origins may not drive it: the API is for the clients
    # that reach the port, and a form in front decides who those are.
