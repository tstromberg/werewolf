# jre21: prod with Java 21, for a form whose packages require that
# runtime. The jre form is Java 27, and /usr/bin/java there is that one.
# This form's /usr/bin/java is Java 21. See docs/forms.md.
base: app

packages:
  - openjdk-21-jre

# Taken back of werewolf's defaults (lib/allow.zig): the JVM compiles
# the application to machine code as it runs.
allow: [jit]

# The posture checks this form fails, and why: its own, never inherited
# (forms/README.md). A ? before one: the host decides.
weaknesses:
  programs-no-interpreters: java, for the application a form on this one brings
  kernel-write-xor-execute: the JVM compiles the application to machine code as it runs (allow jit)
