name: promote package sources
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promote-package-sources
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'werewolf-linux/werewolf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.pin.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: werewolf
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: werewolf-linux/packages
          ref: main
          path: packages
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test promotion and source checkout
        working-directory: werewolf
        run: |
          python3 test/package-sources
          go -C tools/package-pins test ./...
      - name: Verify publication and prepare immutable pins
        id: pin
        working-directory: werewolf
        run: |
          go -C tools/package-pins run . --root ../.. --packages ../../../packages --write
          if ! git diff --quiet -- release/package-sources.json; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.pin.outputs.changed == 'true'
        with:
          name: package-source-lock
          path: werewolf/release/package-sources.json
          retention-days: 1
  propose:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && vars.PACKAGE_UPDATE_APP_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-source-lock
          path: candidate
      - name: Mint repository-scoped update credentials
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PACKAGE_UPDATE_APP_ID }}
          private-key: ${{ secrets.PACKAGE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open one update PR; existing PRs keep their CI results
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -n "$(gh pr list --head auto/package-pins --base main --state open --json number --jq '.[].number')" ]; then
            exit 0
          fi
          cp candidate/package-sources.json release/package-sources.json
          git diff --exit-code --quiet -- release/package-sources.json && exit 0
          git switch -c auto/package-pins
          git add -- release/package-sources.json
          git -c user.name='package-update[bot]' -c user.email='package-update@users.noreply.github.com' \
            commit -m 'packages: promote published application sources'
          previous=$(git ls-remote origin refs/heads/auto/package-pins | cut -f1)
          git -c 'credential.helper=!gh auth git-credential' push \
            --force-with-lease="refs/heads/auto/package-pins:$previous" origin HEAD:auto/package-pins
          gh pr create --head auto/package-pins --base main \
            --title 'packages: promote published application sources' \
            --body 'Both native architectures are published in the signed application feed. This PR updates the immutable source commit and context digest. The check workflow merges this PR only after its tests and form boots pass.'
