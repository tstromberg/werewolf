# Build every form, boot each under QEMU, and check its protections as root
# on its console (docs/testing.md), on both architectures. The suite is split
# into jobs so a failure names its area at a glance and the groups run in
# parallel; `make ci` still runs the whole of it locally, in an Ubuntu VM
# under Lima, and `make check-<group>` runs one group.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo test/ci-setup
      - name: Unit tests
        run: make -j"$(nproc)" test
      - name: DNS permissions, DHCP renewal and HTTPS by hostname
        run: make check-dns DNS_TEST_RUNNER=sudo

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        # The groups of make check (Makefile): forms is every form booted;
        # shellfree every form rebuilt and booted as it ships; integrity the
        # slot, its unsigned refusal and verity; cloud the metadata, no-data
        # and lease boots, and on x86_64 the ad-hoc form, whose OCI image is
        # pulled; persist the UEFI-firmware power-cut run (skipped
        # on emulated arm). x86_64 runs them all under KVM. arm64 has no
        # KVM, so rather than emulate every form it runs them natively under
        # systemd-nspawn (native, test/cage); integrity and cloud still
        # emulate minimal and prod there, asserting the kernel, boot-chain
        # and attack checks a container cannot carry. forms, shellfree and
        # native each split over runners (SHARD=K/N): 19 jobs in all, under
        # the account's 20 at once, so none waits for another to end.
        group: [integrity, cloud, persist]
        include:
          - { runner: ubuntu-26.04-arm, group: native, shard: 1, shards: 3 }
          - { runner: ubuntu-26.04-arm, group: native, shard: 2, shards: 3 }
          - { runner: ubuntu-26.04-arm, group: native, shard: 3, shards: 3 }
          - { runner: ubuntu-26.04, group: forms, shard: 1, shards: 4 }
          - { runner: ubuntu-26.04, group: forms, shard: 2, shards: 4 }
          - { runner: ubuntu-26.04, group: forms, shard: 3, shards: 4 }
          - { runner: ubuntu-26.04, group: forms, shard: 4, shards: 4 }
          - { runner: ubuntu-26.04, group: shellfree, shard: 1, shards: 3 }
          - { runner: ubuntu-26.04, group: shellfree, shard: 2, shards: 3 }
          - { runner: ubuntu-26.04, group: shellfree, shard: 3, shards: 3 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo test/ci-setup
      - name: Tool versions
        id: versions
        run: |
          { echo "zig=$(sed -n 's/^ZIG_VERSION = //p' Makefile)"
            echo "week=$(date -u +%G-%V)"
            echo "melange=$(sed -n 's/^melange_version=//p' tools/install-deps)"; } >>"$GITHUB_OUTPUT"
      # Zig's global cache, keyed by the week, so a program whose inputs are
      # unchanged since the last run that week is not compiled again. Zig
      # checks it by content, so a stale entry only costs a compile.
      - name: Restore the Zig cache
        id: zig
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.arch }}-${{ steps.versions.outputs.zig }}-${{ steps.versions.outputs.week }}-${{ hashFiles('**/*.zig') }}
          restore-keys: zig-${{ runner.arch }}-${{ steps.versions.outputs.zig }}-${{ steps.versions.outputs.week }}-
      # apko's package cache, so a job's forms take their packages from its
      # last run that week, not from Wolfi's server; apko checks them by
      # hash. Each job keeps its own, as each builds its own forms.
      - name: Restore the apko cache
        id: apko
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/dev.chainguard.go-apk
          key: >-
            apko-${{ runner.arch }}-${{ matrix.group }}${{ matrix.shard }}-${{ steps.versions.outputs.week
            }}-${{ hashFiles('forms/*/form.yaml', 'boot/*.yaml') }}
          restore-keys: apko-${{ runner.arch }}-${{ matrix.group }}${{ matrix.shard }}-${{ steps.versions.outputs.week }}-
      - name: Install example compilers
        # The groups that build every form build the compiled tutorial
        # applications, which compile on the host (cmd/howl/app.zig) for an
        # image with no toolchain.
        if: matrix.group == 'forms' || matrix.group == 'shellfree' || matrix.group == 'native'
        run: |
          command -v javac || sudo apt-get install -y default-jdk-headless
          test/ci-compilers
      # The packages melange builds from forms' recipes (cmd/howl/melange.zig),
      # kept between runs by the recipes' contents and melange's version:
      # vaultwarden's is a Rust build of twenty minutes. Saved even when a
      # check fails, as the packages are sound.
      # Checkout leaves the recipes newer than any stamp restored, so the
      # stamps are touched to say the packages are current.
      - name: Restore melange packages
        id: melange
        if: matrix.group == 'forms' || matrix.group == 'shellfree' || matrix.group == 'native'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            build/vendor/packages
            build/vendor/stamps
          key: melange-${{ runner.arch }}-${{ steps.versions.outputs.melange }}-${{ hashFiles('forms/*/melange/*.yaml') }}
      - name: Mark restored melange packages current
        if: steps.melange.outputs.cache-hit == 'true'
        run: find build/vendor/stamps -type f -exec touch {} +
      - name: Boot and check (${{ matrix.group }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
        # A boot a CPU: a guest has two (CHECK_QEMU's -smp 2) but spends
        # most of its seconds waiting on its services, so four at once on
        # four CPUs keep them busy. The forms jobs check demo, so persist
        # need not first (PERSIST_AFTER). The runner is thrown away after,
        # so test/cage may raise its link and memfd sysctls to werewolf's
        # own, and the native attacks on them run for real.
        env:
          CAGE_HARDEN_HOST: 1
        run: make -k -j"$(nproc)" PERSIST_AFTER= ${{ matrix.shard && format('SHARD={0}/{1}', matrix.shard, matrix.shards) || '' }} check-${{ matrix.group }}
      # x86 form checks already include these suites. ARM's ordinary form
      # checks use nspawn, so also boot the native clients once under QEMU.
      - name: Shell-free integration clients and persistent data
        if: matrix.group == 'native' && matrix.shard == 1
        run: make check-native-tests
      # One job an architecture saves the Zig cache, when this week's has
      # no entry for these sources yet: every check job compiles the same
      # programs, and integrity is off the critical path.
      - name: Save the Zig cache
        if: always() && matrix.group == 'integrity' && steps.zig.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/zig
          key: ${{ steps.zig.outputs.cache-primary-key }}
      - name: Save the apko cache
        if: always() && steps.apko.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/dev.chainguard.go-apk
          key: ${{ steps.apko.outputs.cache-primary-key }}
      - name: Save melange packages
        if: >-
          always() && steps.melange.outcome == 'success' && steps.melange.outputs.cache-hit != 'true'
          && hashFiles('build/vendor/stamps/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            build/vendor/packages
            build/vendor/stamps
          key: ${{ steps.melange.outputs.cache-primary-key }}
      - name: Keep native results and their console transcripts
        if: always() && hashFiles('build/*/check/*-native/results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: native-results-${{ runner.arch }}-${{ matrix.group }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            build/*/check/*-native/results.json
            build/*/check/*-native/seed.log
            build/*/check/*-native/verify.log
      - name: Keep the build and console logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: check-${{ runner.arch }}-${{ matrix.group }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            build/*/check/**/*.log
            build/*/check/*-native/results.json

  # arm64 forms as VMs, as x86_64 boots them. Hosted arm runners have no KVM,
  # so the check job runs arm64 forms in containers on the runner's own
  # kernel; this job boots werewolf's kernel and every form under KVM on the
  # self-hosted runner vars.WEREWOLF_ARM64_CHECK_RUNNER names (a JSON list of
  # labels). It is never form-images' runner, which holds the protected image
  # key: a pull request can rewrite this file, so the condition below is not
  # what keeps others' code off the machine; GitHub's approval of outside
  # contributors' runs is. The runner's account has no sudo and reaches
  # /dev/kvm through its group; an administrator installs the tools once
  # (sudo test/ci-setup, a JDK and rustup), and the job checks they are there.
  vm-arm64:
    if: >-
      vars.WEREWOLF_ARM64_CHECK_RUNNER != '' && (github.event_name == 'push' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
    # The fallback is never used (the if needs the variable); it keeps an unset
    # variable from failing the workflow should runs-on be evaluated anyway.
    runs-on: ${{ fromJSON(vars.WEREWOLF_ARM64_CHECK_RUNNER || '["ubuntu-26.04-arm"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check tools and install example compilers
        # install-deps with no answer installs nothing: it fails, listing what
        # is missing or at the wrong version, unless all is in place.
        run: |
          tools/install-deps </dev/null
          for tool in javac rustup; do
            command -v "$tool" >/dev/null || { echo "vm-arm64: no $tool on the runner" >&2; exit 1; }
          done
          test -r /dev/kvm && test -w /dev/kvm || { echo "vm-arm64: /dev/kvm is not usable" >&2; exit 1; }
          test/ci-compilers
      - name: Tool versions
        id: versions
        run: echo "melange=$(sed -n 's/^melange_version=//p' tools/install-deps)" >>"$GITHUB_OUTPUT"
      # Zig's and apko's caches stay in the runner's home between runs; the
      # melange packages live in the checkout, which checkout cleans.
      - name: Restore melange packages
        id: melange
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            build/vendor/packages
            build/vendor/stamps
          key: melange-${{ runner.arch }}-${{ steps.versions.outputs.melange }}-${{ hashFiles('forms/*/melange/*.yaml') }}
      - name: Mark restored melange packages current
        if: steps.melange.outputs.cache-hit == 'true'
        run: find build/vendor/stamps -type f -exec touch {} +
      - name: Boot and check every form, and every form as it ships
        # A boot a CPU, as the hosted jobs run them, but no more than memory
        # holds: a guest takes 1 GiB, or its form's check memory, up to 4.
        run: |
          jobs=$(awk -v cpus="$(nproc)" '/^MemAvailable:/ { n = int($2 / 4194304); if (n < 1) n = 1; print (n < cpus ? n : cpus) }' /proc/meminfo)
          echo "vm-arm64: $jobs boots at once"
          make -k -j"$jobs" check-forms check-shellfree
      - name: Keep the build and console logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: check-vm-arm64
          path: build/*/check/**/*.log
