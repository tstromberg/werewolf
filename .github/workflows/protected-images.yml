# Publication requires exact-artifact lifecycle evidence; legacy signed releases
# cannot satisfy these gates. Lima is the first production download target.
name: protected-images

on:
  pull_request:
    paths:
      - 'cmd/howl/**'
      - 'lib/prebuilt.zig'
      - 'lib/cmdline.zig'
      - 'files.zig'
      - 'tools/boot-download'
      - 'release/*protected*'
      - 'release/protected/**'
      - 'test/boot-*'
      - 'test/protected-release'
      - '.github/workflows/protected-images.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/howl/**'
      - 'lib/prebuilt.zig'
      - 'lib/cmdline.zig'
      - 'files.zig'
      - 'tools/boot-download'
      - 'release/*protected*'
      - 'release/protected/**'
      - 'test/boot-*'
      - 'test/protected-release'
      - '.github/workflows/protected-images.yml'
  workflow_dispatch:
    inputs:
      build:
        description: Build signed candidates using dedicated production secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: protected-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      serial: ${{ steps.serial.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: sudo test/ci-setup
      - name: Native admission, downloads, production trust and publication gates
        run: |
          make howl
          python3 test/boot-images build/host/howl
          python3 test/boot-download build/host/howl
          python3 test/protected-release
          python3 test/protected-publication
      - name: One serial for both independent copies
        id: serial
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >>"$GITHUB_OUTPUT"

  build:
    needs: admission
    if: github.event_name == 'workflow_dispatch' && inputs.build && github.ref == 'refs/heads/main'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
        target:
          - {runner: ubuntu-26.04, arch: x86_64, provider: qemu}
          - {runner: ubuntu-26.04-arm, arch: aarch64, provider: qemu}
          - {runner: ubuntu-26.04-arm, arch: aarch64, provider: lima}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    env:
      SOURCE_DATE_EPOCH: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: sudo test/ci-setup
      - name: Build the signing host tool
        run: make howl
      # Deliberately no compiled-kernel cache restore: these two candidate copies
      # must have independent source/object trees. Forms within each job share
      # the verified prerequisite cache, with host-only policy/module signing.
      - name: Build protected forms with dedicated host keys
        env:
          WEREWOLF_PROTECTED_BOOT_KEY: ${{ secrets.WEREWOLF_PROTECTED_BOOT_KEY }}
          WEREWOLF_PROTECTED_IMAGE_KEY: ${{ secrets.WEREWOLF_PROTECTED_IMAGE_KEY }}
          TARGET_ARCH: ${{ matrix.target.arch }}
          TARGET_PROVIDER: ${{ matrix.target.provider }}
          IMAGE_SERIAL: ${{ needs.admission.outputs.serial }}
        run: |
          set -eu
          for form in playground prod prod-ssh; do
            python3 release/with-protected-keys python3 release/build-protected \
              "$form" "$TARGET_PROVIDER" "$TARGET_ARCH" "$IMAGE_SERIAL" "dist/protected/$form"
          done
          if [ "$TARGET_PROVIDER" = lima ]; then
            for offset in 1 2; do
              serial=$(python3 -c 'import datetime,os,sys; print((datetime.datetime.strptime(os.environ["IMAGE_SERIAL"], "%Y%m%dT%H%M%SZ") + datetime.timedelta(seconds=int(sys.argv[1]))).strftime("%Y%m%dT%H%M%SZ"))' "$offset")
              python3 release/with-protected-keys python3 release/build-protected \
                playground lima aarch64 "$serial" "dist/protected/playground-update-$offset"
            done
          fi
      - name: Keep public candidates without deployment authorization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protected-${{ matrix.target.arch }}-${{ matrix.target.provider }}-${{ matrix.copy }}
          path: |
            dist/protected/
            !dist/protected/**/boot.json.sig
      - name: Keep public build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protected-logs-${{ matrix.target.arch }}-${{ matrix.target.provider }}-${{ matrix.copy }}
          path: build/protected-cache/**/build.log

  compare:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: protected-*
          path: candidates
      - name: Complete signed disks, slots and descriptors match
        run: |
          set -eu
          for target in x86_64-qemu aarch64-qemu aarch64-lima; do
            diff -r "candidates/protected-$target-1" "candidates/protected-$target-2"
          done

  lima-lifecycle:
    needs: compare
    # Use a dedicated runner provisioned with QEMU/HVF, Lima and persistent TPM
    # tooling. Its explicit label keeps the lifecycle gate off unrelated Macs.
    runs-on: [self-hosted, macOS, ARM64, werewolf-lima]
    environment: release
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: protected-aarch64-lima-1
          path: candidates
      - name: Build native host admission tool
        run: make howl
      - name: Privately authorize exact candidates for lifecycle tests
        env:
          WEREWOLF_PROTECTED_BOOT_KEY: ${{ secrets.WEREWOLF_PROTECTED_BOOT_KEY }}
          WEREWOLF_PROTECTED_IMAGE_KEY: ${{ secrets.WEREWOLF_PROTECTED_IMAGE_KEY }}
        run: |
          python3 release/with-protected-keys python3 release/authorize-protected \
            build/host/howl lima candidates/playground candidates/playground-update-1 candidates/playground-update-2
      - name: Default downloads, owner isolation and complete A/B recovery
        run: |
          python3 test/check-published-lifecycle build/host/howl candidates/playground \
            candidates/playground-update-1 candidates/playground-update-2 build/protected-lifecycle
      - name: Retain the exact verified release and artifact-bound gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protected-verified-lima
          path: |
            candidates/playground/
            build/protected-lifecycle/gates.json
      - name: Retain public lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protected-lima-evidence
          path: |
            build/protected-lifecycle/*.log
            build/protected-lifecycle/evidence.jsonl
            build/protected-lifecycle/result.json

  publish-lima:
    needs: lima-lifecycle
    runs-on: ubuntu-26.04
    environment: release
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: protected-verified-lima
          path: verified
      - name: Install pinned host admission tools
        run: sudo test/ci-setup
      - name: Build native host admission tool
        run: make howl
      - name: Re-admit and publish immutable objects before authenticated heads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 release/publish-protected build/host/howl verified/candidates/playground \
            verified/build/protected-lifecycle/gates.json lima
