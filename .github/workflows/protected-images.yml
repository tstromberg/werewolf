# Pull requests prove the protected QEMU lifecycle with disposable trust before
# merge. form-images.yml builds, gates and publishes the real images.
name: protected-images

on:
  pull_request:
    paths:
      - 'boot/**'
      - 'forms/**'
      - 'lib/**'
      - 'tools/local-prerequisites'
      - 'tools/test-kernel'
      - 'test/local-prerequisites'
      - 'test/ci-setup'
      - 'cmd/howl/**'
      - 'cmd/slot-update/**'
      - 'tools/owner-control'
      - 'test/owner*'
      - 'lib/prebuilt.zig'
      - 'lib/cmdline.zig'
      - 'files.zig'
      - 'tools/boot-download'
      - 'release/*protected*'
      - 'release/prepare-protected'
      - 'release/protected/**'
      - 'test/boot-*'
      - 'test/protected-*'
      - 'test/check-published-*'
      - 'test/check-protected-*'
      - '.github/workflows/protected-images.yml'
      - '!**/*.md'
      - 'forms/**/rootfs/**/*.md'
      - '!**/__pycache__/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: sudo test/ci-setup
      - name: Native admission, downloads, production trust and publication gates
        run: |
          make -j"$(nproc)" test
          make howl
      - name: Resolve one package snapshot
        run: python3 release/protected-inputs build/host/howl x86_64 build/protected-inputs
      - name: Keep the resolved public package locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protected-inputs
          path: build/protected-inputs/

  qemu-validation:
    needs: admission
    runs-on: ubuntu-26.04
    # The test kernel builds from source, half an hour or more.
    timeout-minutes: 210
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WEREWOLF_PROTECTED_INPUTS: ${{ github.workspace }}/build/protected-inputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned build and runtime tools
        run: sudo test/ci-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: protected-inputs
          path: build/protected-inputs
      - name: Use the shared image package locks
        run: mkdir -p build/lock && cp build/protected-inputs/*.lock.json build/lock/
      - name: Complete QEMU lifecycle and qcow2 export with disposable test authority
        run: python3 test/check-protected-qemu
      - name: Keep public runtime evidence and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protected-qemu-validation-evidence
          path: |
            build/protected-qemu-validation/**/*.log
            build/protected-qemu-validation/**/evidence.jsonl
            build/protected-qemu-validation/**/result.json
            build/protected-qemu-validation/**/gates.json
            build/protected-qemu-validation/**/storage-fault.json
            build/protected-cache/**/build.log
