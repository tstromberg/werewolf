# Exercise the opt-in IPE path with disposable keys, on both architectures.
name: ipe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    # The test kernel builds from source, half an hour or more.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gnupg xz-utils libssl-dev \
            python3-virt-firmware ovmf qemu-efi-aarch64 swtpm swtpm-tools tpm2-tools systemd-boot-efi \
            meson ninja-build gperf libcap-dev libmount-dev python3-jinja2 python3-pyelftools
          # Package installation can recreate /dev/kvm with root-only access.
          # Apply runner permissions after every runtime package is installed.
          sudo test/ci-setup
      - name: Disposable signing identity
        run: |
          mkdir -p build/ipe-check
          openssl req -newkey rsa:4096 -nodes -x509 -sha256 -days 2 \
            -subj /CN=werewolf-ipe-check -keyout build/ipe-check/policy.key -out build/ipe-check/policy.crt
          chmod 600 build/ipe-check/policy.key
      - name: Use the tested ARM firmware and immutable variable-store profile
        if: matrix.runner == 'ubuntu-26.04-arm'
        run: |
          make howl
          # One path a line: virt-fw-vars, the code, the variable template.
          firmware=$(build/host/howl _native-firmware aarch64)
          mkdir build/ipe-check/firmware
          cp "$(printf '%s\n' "$firmware" | sed -n 2p)" build/ipe-check/firmware/code.fd
          cp "$(printf '%s\n' "$firmware" | sed -n 3p)" build/ipe-check/firmware/vars.fd
          echo "SECUREBOOT_DIR=$PWD/build/ipe-check/firmware" >>"$GITHUB_ENV"
      - name: Stock Alpine Secure Boot release
        run: make check-secureboot
      - name: Build the test kernel and test enforcement
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: |
          make ipe-kernel
          # This probe boots its kernel directly; firmware and TPM gates run below.
          make IPE=1 DISABLE=secureboot,tpm check-ipe
          make IPE=1 check-image-updater
          make IPE=1 check-image-updater-uki
          make IPE=1 check-ab-qemu
      - name: TPM release floor against swtpm
        run: make check-tpm-floor
      - name: Build pinned stub
        run: |
          sh tools/build-tpm-stub build/tpm-stub
          echo "UKI_STUB=$PWD/build/tpm-stub/linux.efi.stub" >> "$GITHUB_ENV"
      - name: Independent updates, rollback, power cuts and a restored disk
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: |
          kernel_arch=$(uname -m)
          export WEREWOLF_IPE_KERNEL="$PWD/build/ipe-kernel/$kernel_arch/rootfs.tar"
          make IPE=1 PROVIDER=qemu check-independent-updates
      - name: Quiesced data export, import and isolation
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: |
          kernel_arch=$(uname -m)
          export WEREWOLF_IPE_KERNEL="$PWD/build/ipe-kernel/$kernel_arch/rootfs.tar"
          make check-data-transfer check-plex-data
      - name: Keep console logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ipe-${{ runner.arch }}
          path: |
            build/check/data-transfer/*/*.log
            build/check/plex-data/*/*.log
            build/*/ipe/check/ipe/*.log
            build/*/ipe/check/image-updater/*.log
            build/*/check/secureboot/*.log
            build/*/ipe/check/provider-ab-qemu/*.log
            build/*/ipe/check/provider-ab-qemu/fixture-*/*.log
            build/*/ipe/check/provider-ab-qemu/phases.json
            build/*/ipe/check/independent-updates/*.log
            build/*/ipe/check/independent-updates/evidence.jsonl
