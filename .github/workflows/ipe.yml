# Exercise the opt-in IPE path with disposable keys, on both architectures.
name: ipe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    # The test kernel builds from source, half an hour or more.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gnupg xz-utils libssl-dev \
            python3-virt-firmware ovmf qemu-efi-aarch64 swtpm swtpm-tools tpm2-tools systemd-boot-efi \
            meson ninja-build gperf libcap-dev libmount-dev python3-jinja2 python3-pyelftools
          # Package installation can recreate /dev/kvm with root-only access.
          # Apply runner permissions after every runtime package is installed.
          sudo test/ci-setup
      - name: Disposable signing identity
        run: |
          mkdir -p build/ipe-check
          openssl req -newkey rsa:4096 -nodes -x509 -sha256 -days 2 \
            -subj /CN=werewolf-ipe-check -keyout build/ipe-check/policy.key -out build/ipe-check/policy.crt
          chmod 600 build/ipe-check/policy.key
      - name: Use the tested ARM firmware and immutable variable-store profile
        if: matrix.runner == 'ubuntu-26.04-arm'
        run: |
          python3 tools/native-firmware aarch64 boot/firmware-requirements.txt build/ipe-check/firmware.json
          python3 - <<'PY' >>"$GITHUB_ENV"
          import json, pathlib, shutil
          firmware = json.loads(pathlib.Path('build/ipe-check/firmware.json').read_text())
          target = pathlib.Path('build/ipe-check/firmware').resolve()
          target.mkdir()
          for source, name in [('code.fd', 'code.fd'), ('template.fd', 'vars.fd')]:
              shutil.copyfile(firmware[source], target / name)
          print('SECUREBOOT_DIR=' + str(target))
          PY
      - name: Stock Alpine Secure Boot release
        run: make check-secureboot
      - name: Build the test kernel and test enforcement
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: |
          make ipe-kernel
          make IPE=1 check-ipe
          make IPE=1 check-image-updater
          make IPE=1 check-image-updater-uki
          make IPE=1 check-ab-qemu
      - name: Protected TPM policy
        run: |
          make build/host/tpm-policy build/host/tpm-bootstrap
          TPM_POLICY_PROBE="$PWD/build/host/tpm-policy" python3 test/check-tpm-policy
          TPM_POLICY_PROBE="$PWD/build/host/tpm-policy" python3 test/check-tpm-ab
          TPM_POLICY_PROBE="$PWD/build/host/tpm-policy" python3 test/check-tpm-enrollment
          TPM_POLICY_PROBE="$PWD/build/host/tpm-policy" python3 test/check-tpm-recovery
          python3 test/check-cloud-tpm-activation
      - name: Build pinned measured stub
        run: |
          sh tools/build-tpm-stub build/tpm-stub
          echo "UKI_STUB=$PWD/build/tpm-stub/linux.efi.stub" >> "$GITHUB_ENV"
      - name: Protected TPM guest and power cuts
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: make IPE=1 check-tpm-guest
      - name: Signed firmware authority and trust substitutions
        run: |
          make build/host/uki
          arch=$(uname -m)
          python3 test/check-boot-authority --arch "$arch" \
            --kernel "build/ipe-kernel/$arch/rootfs.tar" --stub "$UKI_STUB" \
            --output "build/$arch/ipe/check/boot-authority"
      - name: Signed rootless TPM bootstrap
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: make IPE=1 check-tpm-bootstrap-guest
      - name: Secured QEMU CLI lifecycle and power cuts
        env:
          WEREWOLF_IPE_KEY: build/ipe-check/policy.key
          WEREWOLF_IPE_CRT: build/ipe-check/policy.crt
        run: make IPE=1 check-secure-qemu
      - name: Keep console logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ipe-${{ runner.arch }}
          path: |
            build/*/ipe/check/ipe/*.log
            build/*/ipe/check/image-updater/*.log
            build/*/check/secureboot/*.log
            build/*/ipe/check/provider-ab-qemu/*.log
            build/*/ipe/check/provider-ab-qemu/phases.json
            build/*/ipe/check/tpm-guest/fixture.log
            build/*/ipe/check/tpm-guest/factory.log
            build/*/ipe/check/tpm-guest/guest/*.log
            build/*/ipe/check/tpm-guest/guest/*.status
            build/*/ipe/check/tpm-guest/guest/evidence.jsonl
            build/*/ipe/check/tpm-bootstrap/*.log
            build/*/ipe/check/tpm-bootstrap/manifest.json
            build/*/ipe/check/tpm-bootstrap/quote.msg
            build/*/ipe/check/tpm-bootstrap/quote.sig
            build/*/ipe/check/boot-authority/*.log
            build/*/ipe/check/secure-qemu/*.log
            build/*/ipe/check/secure-qemu/evidence.jsonl
