name: kernel-repro

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'boot/kernel*'
      - 'boot/build-kernel'
      - 'boot/ipe-*'
      - 'boot/alpine-keys/**'
      - 'tools/sign-kernel'
      - 'tools/local-prerequisites'
      - 'tools/install-deps'
      - 'test/*kernel*'
      - 'test/module-init.zig'
      - '.github/workflows/kernel-repro.yml'
  push:
    branches: [main]
    paths:
      - 'boot/kernel*'
      - 'boot/build-kernel'
      - 'boot/ipe-*'
      - 'boot/alpine-keys/**'
      - 'tools/sign-kernel'
      - 'tools/local-prerequisites'
      - 'tools/install-deps'
      - 'test/*kernel*'
      - 'test/module-init.zig'
      - '.github/workflows/kernel-repro.yml'

permissions:
  contents: read

concurrency:
  group: kernel-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: sudo test/ci-setup
      - name: Resolve the pinned Alpine base and disposable public trust
        run: |
          set -eu
          umask 077
          arch=$(uname -m)
          . boot/kernel-source
          mkdir -p build/kernel-repro
          apko --workdir boot build-minirootfs --build-arch "$arch" \
            -p "linux-virt=$alpine_version" kernel.yaml "$PWD/build/kernel-repro/base.tar"
          openssl req -newkey rsa:4096 -nodes -x509 -sha256 -days 2 \
            -subj /CN=werewolf-repro-test -keyout build/kernel-repro/policy.key \
            -out build/kernel-repro/policy.crt
      - name: Compare independent cold builds and complete host signatures
        run: |
          python3 test/check-kernel-repro "$(uname -m)" build/kernel-repro/base.tar \
            build/kernel-repro/policy.key build/kernel-repro/policy.crt build/kernel-repro/compare
      - name: Kernel accepts trusted modules and refuses unsigned, foreign and altered copies
        run: |
          set -eu
          arch=$(uname -m)
          accel=tcg
          cpu=max
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then accel=kvm; cpu=host; fi
          case $arch in
            x86_64) qemu='qemu-system-x86_64'; machine='q35' ;;
            aarch64) qemu='qemu-system-aarch64'; machine='virt,gic-version=3' ;;
          esac
          python3 test/check-kernel-modules "$arch" \
            build/kernel-repro/compare/A/unsigned.tar build/kernel-repro/compare/A/signed.tar \
            build/kernel-repro/module-probe "$qemu" -machine "$machine" -accel "$accel" \
            -cpu "$cpu" -smp 2 -m 768 -nographic -no-reboot
      - name: Remove disposable private signer
        if: always()
        run: rm -f build/kernel-repro/policy.key
      - name: Keep public evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kernel-repro-${{ runner.arch }}
          path: |
            build/kernel-repro/compare/result.json
            build/kernel-repro/compare/mismatch.json
            build/kernel-repro/compare/*/build.log
            build/kernel-repro/module-probe/console.log
            build/kernel-repro/module-probe/result.json
