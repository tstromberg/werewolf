# Each form/architecture advances independently after matching clean builds,
# its own integration tests and a boot of the actual signed release disk.
name: form-images

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'boot/**'
      - 'cmd/**'
      - 'forms/**'
      - 'lib/**'
      - 'tools/**'
      - 'test/**'
      - 'release/**'
      - 'examples/**'
      - 'Makefile'
      - 'files.zig'
      - '.github/workflows/form-images.yml'
      - '!**/*.md'
      - 'forms/**/rootfs/**/*.md'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and retest even when authenticated inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: form-images
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the shared CLI, signing and publication machinery
        run: |
          sudo test/ci-setup
          make -j2 _test/cmd/howl/howl.zig _test/local-publisher _test/release-signing _test/howl-smoke _test/howl-lock
      - id: matrix
        run: echo "value=$(python3 release/form-images matrix)" >>"$GITHUB_OUTPUT"

  resolve:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools and example compilers
        run: |
          sudo test/ci-setup
          command -v go || sudo apt-get install -y golang-go
          command -v javac || sudo apt-get install -y default-jdk-headless
          command -v rustup || sudo apt-get install -y rustup
          rustup toolchain install stable --profile minimal --target "$(uname -m)-unknown-linux-musl"
          dotnet --list-sdks 2>/dev/null | grep -q '^10\.' || sudo apt-get install -y dotnet-sdk-10.0
      - run: make howl build/host/form
      - name: Resolve package, OCI, recipe environment and source inputs
        env:
          ARCH: ${{ matrix.arch }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          FORM_IMAGES_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 release/form-images resolve "$ARCH" "$SHARD" "$SHARDS" snapshot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: snapshot/

  build:
    needs: [plan, resolve]
    if: always() && !cancelled() && needs.plan.result == 'success'
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        copy: [1, 2]
        target: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: inputs-${{ matrix.target.arch }}-${{ matrix.target.shard }}
          path: snapshot
      - name: Install pinned tools and example compilers
        run: |
          sudo test/ci-setup
          command -v go || sudo apt-get install -y golang-go
          command -v javac || sudo apt-get install -y default-jdk-headless
          command -v rustup || sudo apt-get install -y rustup
          rustup toolchain install stable --profile minimal --target "$(uname -m)-unknown-linux-musl"
          dotnet --list-sdks 2>/dev/null | grep -q '^10\.' || sudo apt-get install -y dotnet-sdk-10.0
      - run: make howl
      # No compiled-kernel or form output cache is restored: the copies must
      # independently produce identical bytes, including PE and slot signatures.
      - name: Build every changed form in this shard with host-only signing
        env:
          WEREWOLF_BOOT_KEY: ${{ secrets.WEREWOLF_BOOT_KEY }}
        run: python3 release/with-boot-key python3 release/form-images build snapshot candidates
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: images-${{ matrix.target.arch }}-${{ matrix.target.shard }}-${{ matrix.copy }}
          path: candidates/
          compression-level: 0
          retention-days: 3

  check:
    needs: [plan, resolve, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: snapshot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: images-${{ matrix.arch }}-${{ matrix.shard }}-*
          path: copies
      - name: Install pinned tools and example compilers
        run: |
          sudo test/ci-setup
          command -v go || sudo apt-get install -y golang-go
          command -v javac || sudo apt-get install -y default-jdk-headless
          command -v rustup || sudo apt-get install -y rustup
          rustup toolchain install stable --profile minimal --target "$(uname -m)-unknown-linux-musl"
          dotnet --list-sdks 2>/dev/null | grep -q '^10\.' || sudo apt-get install -y dotnet-sdk-10.0
      - run: make howl
      - name: Require byte-identical builds and passing tests for this form and architecture
        env:
          ARCH: ${{ matrix.arch }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 release/form-images check snapshot \
            "copies/images-$ARCH-$SHARD-1" "copies/images-$ARCH-$SHARD-2" verified
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: verified-${{ matrix.arch }}-${{ matrix.shard }}
          path: verified/
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: form-test-logs-${{ matrix.arch }}-${{ matrix.shard }}
          path: build/**/check/*.log

  publish:
    needs: [plan, resolve, build, check]
    if: always() && !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned form metadata tool
        run: |
          sudo test/ci-setup zig
          make build/host/form
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: inputs-*
          path: snapshots
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: verified-*
          path: verified
      - name: Publish passing forms, package release notes and the signed catalog
        env:
          WEREWOLF_BOOT_KEY: ${{ secrets.WEREWOLF_BOOT_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 release/with-boot-key python3 release/form-images publish snapshots verified
