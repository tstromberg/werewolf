# The one image pipeline. Only minimal, prod-ssh and playground are built twice,
# with explicit secure-boot and legacy-boot profiles. Secure targets retain
# every protection and exact-bundle lifecycle gates; compatibility targets
# boot their exact disk and direct image without Secure Boot or TPM.
# The copies must match byte for byte and the form's own tests must pass.
# A secure target is published only when its
# exact bundle has passed the fourteen lifecycle gates on a runner that can
# boot it: hosted KVM for qemu/x86_64; for arm64, the self-hosted runners
# named by the WEREWOLF_ARM64_KVM_RUNNER (qemu) and WEREWOLF_LIMA_RUNNER
# (macOS) repository variables, each a JSON list of runner labels.
name: form-images
run-name: Form images (${{ inputs.target || (github.event_name == 'schedule' && 'all' || 'base') }})

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'boot/**'
      - 'cmd/**'
      - 'forms/**'
      - 'lib/**'
      - 'tools/**'
      - 'test/**'
      - 'release/**'
      - 'examples/**'
      - 'Makefile'
      - 'files.zig'
      - '.github/workflows/form-images.yml'
      - '!**/*.md'
      - 'forms/**/rootfs/**/*.md'
  workflow_dispatch:
    inputs:
      target:
        description: Publish the three selected images (base/all) or the recovery target
        type: choice
        options:
          - base
          - all
          - playground/qemu/x86_64
        default: base
      force:
        description: Rebuild and retest even when authenticated inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep the published head stable until this run's public consumers finish.
  # Base, all and focused runs write the same catalog and share this lock.
  group: form-images-release
  cancel-in-progress: false

env:
  FORM_IMAGES_TARGET: ${{ inputs.target || (github.event_name == 'schedule' && 'all' || 'base') }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      gates: ${{ steps.matrix.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the shared CLI, signing and publication machinery
        run: |
          sudo test/ci-setup
          make -j2 _test/cmd/howl/howl.zig _test/local-publisher _test/release-signing _test/howl-smoke _test/howl-lock
      - id: matrix
        env:
          ARM64_KVM_RUNNER: ${{ vars.WEREWOLF_ARM64_KVM_RUNNER }}
          LIMA_RUNNER: ${{ vars.WEREWOLF_LIMA_RUNNER }}
        run: |
          echo "value=$(python3 release/form-images matrix)" >>"$GITHUB_OUTPUT"
          echo "gates=$(python3 release/form-images gates)" >>"$GITHUB_OUTPUT"

  resolve:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: sudo test/ci-setup
      - run: make howl build/host/form
      - name: Resolve package, OCI, recipe environment and source inputs
        env:
          ARCH: ${{ matrix.arch }}
          FORM_IMAGES_SHARD: ${{ matrix.shard }}
          FORM_IMAGES_SHARDS: ${{ matrix.shards }}
          FORM_IMAGES_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 release/form-images resolve "$ARCH" "$FORM_IMAGES_SHARD" "$FORM_IMAGES_SHARDS" snapshot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: snapshot/

  build:
    needs: [plan, resolve]
    if: always() && !cancelled() && needs.plan.result == 'success'
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        copy: [1, 2]
        target: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: inputs-${{ matrix.target.arch }}-${{ matrix.target.shard }}
          path: snapshot
      - name: Install pinned tools
        run: sudo test/ci-setup
      - run: make howl
      # No compiled-kernel or form output cache is restored: the copies must
      # independently produce identical bytes, including PE and slot signatures.
      - name: Build every changed form for each provider with host-only signing
        env:
          WEREWOLF_PROTECTED_BOOT_KEY: ${{ secrets.WEREWOLF_PROTECTED_BOOT_KEY }}
          WEREWOLF_PROTECTED_IMAGE_KEY: ${{ secrets.WEREWOLF_PROTECTED_IMAGE_KEY }}
        run: python3 release/with-protected-keys python3 release/form-images build snapshot candidates
      # Candidates are public. The signature that admits a bundle is made
      # only by the gate job, and published only after its gates pass.
      # Forms without gates leave only descriptors and digests to compare.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: images-${{ matrix.target.arch }}-${{ matrix.target.shard }}-${{ matrix.copy }}
          path: |
            candidates/
            !candidates/**/boot.json.sig
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: build-logs-${{ matrix.target.arch }}-${{ matrix.target.shard }}-${{ matrix.copy }}
          path: build/protected-cache/**/build.log

  check:
    needs: [plan, resolve, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: snapshot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: images-${{ matrix.arch }}-${{ matrix.shard }}-*
          path: copies
      - name: Install pinned tools
        run: sudo test/ci-setup
      - run: make howl
      - name: Require byte-identical builds and passing tests for this form and architecture
        env:
          ARCH: ${{ matrix.arch }}
          FORM_IMAGES_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p lifecycle
          cp snapshot/plan.json lifecycle/plan.json
          python3 release/form-images check snapshot \
            "copies/images-$ARCH-$FORM_IMAGES_SHARD-1" "copies/images-$ARCH-$FORM_IMAGES_SHARD-2" verified lifecycle
      # Evidence and inventories for every form; bundles only for the forms
      # the lifecycle gates, which alone can be published.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: verified-${{ matrix.arch }}-${{ matrix.shard }}
          path: verified/
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lifecycle-${{ matrix.arch }}-${{ matrix.shard }}
          path: lifecycle/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: form-test-logs-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            build/**/check/**/*.log
            build/**/check/*-native/results.json

  legacy-build:
    needs: [plan, resolve]
    if: always() && !cancelled() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        copy: [1, 2]
        target: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: inputs-${{ matrix.target.arch }}-${{ matrix.target.shard }}
          path: snapshot
      - run: sudo test/ci-setup
      - run: make howl
      - name: Build compatibility images from the shared package snapshot
        run: python3 release/legacy-images build snapshot legacy-candidates
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-${{ matrix.target.arch }}-${{ matrix.target.shard }}-${{ matrix.copy }}
          path: legacy-candidates/
          compression-level: 0

  legacy-check:
    needs: [plan, resolve, legacy-build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: inputs-${{ matrix.arch }}-${{ matrix.shard }}
          path: snapshot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: legacy-${{ matrix.arch }}-${{ matrix.shard }}-*
          path: copies
      - run: sudo test/ci-setup
      - run: make howl build/host/form
      - name: Compare builds, run integration tests and boot exact legacy images
        run: |
          python3 release/legacy-images check snapshot \
            copies/legacy-${{ matrix.arch }}-${{ matrix.shard }}-1 \
            copies/legacy-${{ matrix.arch }}-${{ matrix.shard }}-2 legacy-verified
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-verified-${{ matrix.arch }}-${{ matrix.shard }}
          path: legacy-verified/
          compression-level: 0

  gate:
    needs: [plan, check]
    if: always() && !cancelled() && needs.plan.result == 'success'
    # Authorizing a candidate needs the image key, so it happens here, on the
    # runner that boots it; the signature leaves only with passing gates.
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gates) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      PROVIDER: ${{ matrix.provider }}
      ARCH: ${{ matrix.arch }}
      FORMS: ${{ join(matrix.forms, ',') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lifecycle-${{ matrix.arch }}-${{ matrix.shard }}
          path: lifecycle
      # Self-hosted runners keep these tools installed (docs/releases.md).
      - name: Ensure macOS protected runtime
        if: runner.os == 'macOS'
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          for package in python@3.14 swtpm qemu lima osslsigncode zstd; do
            brew list --versions "$package" >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install "$package"
          done
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
          echo "$(brew --prefix python@3.14)/libexec/bin" >>"$GITHUB_PATH"
      - name: Install pinned runtime and host tools
        if: runner.environment == 'github-hosted'
        run: sudo test/ci-setup
      - name: Build native host admission tool
        run: make howl
      - name: Gate each form's exact production downloads and A/B recovery
        env:
          WEREWOLF_PROTECTED_BOOT_KEY: ${{ secrets.WEREWOLF_PROTECTED_BOOT_KEY }}
          WEREWOLF_PROTECTED_IMAGE_KEY: ${{ secrets.WEREWOLF_PROTECTED_IMAGE_KEY }}
        run: |
          python3 release/with-protected-keys python3 release/form-images gate lifecycle gated \
            --provider "$PROVIDER" --arch "$ARCH" --forms "$FORMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: gated-${{ matrix.provider }}-${{ matrix.arch }}-${{ matrix.shard }}
          path: gated/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: lifecycle-evidence-${{ matrix.provider }}-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            build/lifecycle/**/*.log
            build/lifecycle/**/evidence.jsonl
            build/lifecycle/**/result.json
            build/lifecycle/**/storage-fault.json

  publish:
    needs: [plan, resolve, build, check, gate, legacy-check]
    if: always() && !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: release
    # Keep this name compatible with runs of the previous workflow, which
    # held the same lock for their entire run. Catalog reads, release notes,
    # heads and the catalog itself must advance under one writer.
    concurrency:
      group: form-images
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 120
    outputs:
      smoke: ${{ steps.publish.outputs.smoke }}
      targets: ${{ steps.publish.outputs.public_targets }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned host admission tools
        run: |
          sudo test/ci-setup
          make howl build/host/form
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: inputs-*
          path: snapshots
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: verified-*
          path: verified
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: gated-*
          path: gated
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: legacy-verified-*
          path: legacy-verified
      - name: Export signed downloads and release notes for every gated bundle
        id: export
        env:
          WEREWOLF_PROTECTED_BOOT_KEY: ${{ secrets.WEREWOLF_PROTECTED_BOOT_KEY }}
          WEREWOLF_PROTECTED_IMAGE_KEY: ${{ secrets.WEREWOLF_PROTECTED_IMAGE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 release/with-protected-keys python3 release/form-images export \
            snapshots verified gated release-assets exported.json --legacy-verified legacy-verified
      - name: Create the GitHub release as a draft
        id: github
        if: steps.export.outputs.targets != '0'
        run: python3 release/github-protected exported.json
      - name: Attest every release asset
        if: steps.github.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release-assets/*/*
      - name: Publish gated bundles, then the signed catalog of every target
        id: publish
        env:
          WEREWOLF_PROTECTED_BOOT_KEY: ${{ secrets.WEREWOLF_PROTECTED_BOOT_KEY }}
          WEREWOLF_PROTECTED_IMAGE_KEY: ${{ secrets.WEREWOLF_PROTECTED_IMAGE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FORM_IMAGES_GATES: ${{ needs.plan.outputs.gates }}
        run: python3 release/with-protected-keys python3 release/form-images publish snapshots verified exported.json
      # A form failing elsewhere fails this job, not the release of these.
      - name: Publish the GitHub release after exact public R2 parity passes
        if: always() && steps.github.outcome == 'success' && steps.publish.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.github.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  public-check:
    needs: publish
    if: >-
      always() && !cancelled() && needs.publish.outputs.targets != '' &&
      needs.publish.outputs.targets != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish.outputs.smoke) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install consumer tools
        if: runner.environment == 'github-hosted'
        run: sudo test/ci-setup
      - run: make howl
      - name: Discover and boot the exact newly published images from public R2
        env:
          PUBLIC_TARGETS: ${{ toJSON(matrix.targets) }}
        run: python3 test/check-public-image build/host/howl "$PUBLIC_TARGETS" build/public-downloads
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-downloads-${{ strategy.job-index }}
          path: build/public-downloads/
