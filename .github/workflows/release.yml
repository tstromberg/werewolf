# Every 15 minutes, and whenever `check` passes on main, resolve what the
# published forms would be built from.
# When that has changed, build them twice on each architecture, on separate
# runners, and require the builds to match byte for byte; boot and check
# each form; then sign, attest and publish a release, unless its images are
# the same as the latest release's. Daily, sign the latest release's
# manifests again so they do not expire. GitHub runs schedules this often
# late or not at all, so a change to werewolf itself does not wait on one:
# its push releases once its boots have passed. See docs/releases.md.
name: release

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "41 4 * * *" # the daily re-signing
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  inputs:
    if: >-
      github.event.schedule != '41 4 * * *' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.inputs.outputs.key }}
      build: ${{ inputs.force || steps.seen.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # What check passed, when it was check's passing that started this.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install apko
        run: sudo test/ci-setup apko
      - name: Resolve the locks
        id: inputs
        run: |
          make release-inputs
          echo "key=inputs-$(sha256sum build/lock/inputs | cut -c1-64)" >>"$GITHUB_OUTPUT"
      # A cache entry per inputs digest records that they were built,
      # whether or not that made a release.
      - name: Built before?
        id: seen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/lock/inputs
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: locks
          path: build/lock/

  build:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        copy: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # What check passed, when it was check's passing that started this.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install tools
        run: sudo test/ci-setup
      # After the checkout, so the locks are newer than the configs and
      # make uses them as they are.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: locks
          path: build/lock
      - name: Build
        run: make dist
      - name: Boot and check
        if: matrix.copy == 1
        run: make -k check-minimal check-prod check-prod-ssh check-slot check-lease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ runner.arch }}-${{ matrix.copy }}
          path: dist/
      - name: Keep the build and console logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: logs-${{ runner.arch }}-${{ matrix.copy }}
          path: build/*/check/*.log

  publish:
    needs: [inputs, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # What check passed, when it was check's passing that started this.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          path: dists
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: locks
          path: build/lock
      - name: The two builds of each architecture match
        run: |
          for a in X64 ARM64; do diff -r "dists/dist-$a-1" "dists/dist-$a-2"; done
          mkdir dist
          cp dists/dist-*-1/* dist/
      - name: Sign, and make a draft release
        id: publish
        env:
          WEREWOLF_IMAGE_KEY: ${{ secrets.WEREWOLF_IMAGE_KEY }}
        run: release/publish dist build/lock
      - name: Attest
        if: steps.publish.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        if: steps.publish.outputs.tag != ''
        run: gh release edit "${{ steps.publish.outputs.tag }}" --draft=false --latest
      - name: Remember these inputs as built
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/lock/inputs
          key: ${{ needs.inputs.outputs.key }}

  resign:
    if: github.event.schedule == '41 4 * * *'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # What check passed, when it was check's passing that started this.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Sign the latest release's manifests again
        env:
          WEREWOLF_IMAGE_KEY: ${{ secrets.WEREWOLF_IMAGE_KEY }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$tag" --dir m --pattern '*-aarch64.json' --pattern '*-x86_64.json'
          release/sign "$tag" m/*.json
          gh release upload "$tag" --clobber m/*
